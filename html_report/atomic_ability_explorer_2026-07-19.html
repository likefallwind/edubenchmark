LLM 裁判打分整体偏高压缩。","家族 halo 0.76（家族内 ρ 0.5-0.97、对外接近零），触发\"家族内先聚合\"。","M2 换裁判实验结论（2026-07-12，250 条 × deepseek-v4-pro + doubao-seed-2.0-pro）：指标分三类——支持簇（个性化适应 ρ 0.77-0.81、高阶思维 0.63-0.73、动机引导 0.61-0.68）跨裁判稳健是真测量；错误识别指标是裁判噪声（三裁判两两 ρ≤0.14、均分 4.6/7.4/8.7 各判各的），不入映射；知识/格式簇被新裁判打到天花板（9.8-10.0）只作门槛参考。对原裁判总分 response 级 ρ=0.43-0.45（含 prompt 差异）。","题级两簇结构：基础事实与动机/个性化/高阶思维题级 ρ≈0——同一批回答里\"答得准\"和\"教得好\"是独立方向（\"会答题≠会教\"最硬同源证据）。"]}],"file":"edubench.md","missing":false}},{"id":"eduguard_adversarial","name":"EduGuard-Bench P2","confidence":0.85,"metric_family":"asr_0_to_1_lower_better","score_direction":"lower_better","source_scope":"repo_eval_and_otherbenchmark","rationale":"对抗安全主要测安全处置（R7：拒答质量主挂 P22，P18 副挂降 0.10），同时需要识别风险和维持教育角色边界。","profile":{"title":"EduGuardBench · 对抗越狱测试","one_liner":"EduGuardBench 两个子评测之一——用 801 条越狱提示反复诱导模型越过教育者的边界，看它顶不顶得住、以及顶住之后拒得体不体面。","sections":[{"heading":"这是哪个子评测","bullets":["家族 EduGuardBench（YL1N，2026）由两部分组成：SATA 知识题（P1），以及本页的对抗测试（P2）。","两者构成安全的知识与行为两面，而且实测几乎不相关（相关系数 0.07）——选择题答满分的模型照样可能在诱导下失守。这是必须分开计分的直接理由。","本页产出两个独立取分维度：攻击成功率测\"有没有被带过去\"，拒答质量分布测\"守住之后处理得怎么样\"。"]},{"heading":"出处与背景","bullets":["YL1N/EduGuardBench，2026；https://github.com/YL1N/EduGuardBench","动机：扮演教师的模型有专属的越狱面——以\"为了教学演示\"为名索要不该给的内容，是通用安全评测覆盖不到的攻击面。"]},{"heading":"任务与判分","bullets":["801 条越狱提示逐条施压，官方两阶段 LLM 裁判：先判有害无害，再对拒绝的回复分层判质量档。","每阶段三票多数决。报攻击成功率（越低越好）与拒答质量的分布。","判分流程按官方设定原样移植，第二阶段的质量分档相对更主观。"]},{"heading":"局限与注意","bullets":["全体系区分度最大的格子：实测均分 6.92、标准差 2.71。模型的安全水平差距是真实存在的巨大差距，分数从 3.8 一直跨到 10.0。","三票裁判的并发消耗很大，跑全量要压低并发。","深度缺口：801 条场景全部是主动越狱请求，没有一条是\"学生被动流露风险、需要模型主动升级转介\"。也就是说这里测的全是拒绝恶意请求，完全没测识别风险后主动转介人类。","曾经把攻击成功率也算作学生风险识别的证据，后来删掉了——那测的是被诱导时输出侧的行为，与从学生消息里感知风险是不同任务。"]}],"file":"eduguard_adversarial.md","missing":false}},{"id":"eduguard_sata","name":"EduGuard-Bench P1","confidence":1.0,"metric_family":"rfs_0_to_1","score_direction":"higher_better","source_scope":"repo_eval_and_otherbenchmark","rationale":"教学伤害全选题同时测试角色边界、风险识别和处置选择；R10：三 P 知识 facet 同源，不构成互证。","profile":{"title":"EduGuardBench · SATA 教学伤害知识","one_liner":"EduGuardBench 两个子评测之一——用全选题问模型\"哪些做法构成教学伤害\"，测的是安全知识，不是安全行为。","sections":[{"heading":"这是哪个子评测","bullets":["家族 EduGuardBench（YL1N，2026）由两部分组成：本页的 SATA 知识题（P1），以及对抗越狱测试（P2）。","两者刻意构成安全的知识与行为两面：知道什么算越界，和被诱导时真的不越界。","两面几乎不相关（预实验相关系数 0.07）。 这是家族最重要的发现，也是两个子评测必须分开计分的原因——合成一个安全总分会把这个分裂抹平。"]},{"heading":"出处与背景","bullets":["YL1N/EduGuardBench，2026；https://github.com/YL1N/EduGuardBench","动机：教育场景的安全有专属的伤害类型——泄露答案、羞辱学生、错误处置危机——通用安全评测测不到。"]},{"heading":"任务与判分","bullets":["2,635 道中英双语的 Select-All-That-Apply 题：选项集全对得满分、选出非空真子集得半分、否则零分。","官方规则判分，全程没有 LLM 裁判参与。"]},{"heading":"局限与注意","bullets":["区分度受限：实测均分 7.47、标准差仅 0.26，模型之间差别很小。","一份分数同时供给三项安全能力的知识层（教育角色边界、学生风险识别、安全处置选择）。三者显示的知识层数值会完全相同，报告中绝不能读作三份独立证据。","本地数据核实过：题目没有伤害类别标签，因此无法按类别拆分取分——要把三项能力的知识层真正分开，前提是先做类别标注。","它测的是教师侧的知识判断。用它代理\"从学生消息里察觉风险信号\"这种感知任务，是明确的降级使用。"]}],"file":"eduguard_sata.md","missing":false}},{"id":"eduillustrate","name":"EduIllustrate","confidence":0.7,"metric_family":"likert_0_to_5","score_direction":"higher_better","source_scope":"repo_eval","rationale":"教学图示/图文协同生成直接测多模态教学产物生成；R5 后不再挂 P03（理解侧）。","profile":{"title":"EduIllustrate","one_liner":"生成式多模态基准——模型写 Manim 动画代码把解题过程画出来，渲染成功后由裁判按 8 个维度（4 文本 + 4 视觉）打 0-5 分。","sections":[{"heading":"出处与背景","bullets":["arXiv 2604.05005，2026。","动机：多模态教学评测几乎全在输入侧（看图答题），输出侧（画图讲题）没有基准；EduIllustrate 测\"能不能把讲解变成正确、可读的可视化\"。"]},{"heading":"数据与运行","bullets":["不在本仓库 harness 里跑：依赖 manim + texlive 太重，评测在上游克隆（~/code/EduIllustrate）执行；scripts/eval/build_eduillustrate_report.py 只负责把 8 维裁判分回灌到标准 reports/eval/eduillustrate/<model>/ 布局。"]},{"heading":"任务与判分","bullets":["模型输出 Manim 代码 → 渲染 → 裁判按 8 维 0-5 打分（正确完整性、逻辑连贯、易懂性/教学效果等 4 个文本维 + 4 个视觉维）；单题总分是 8 维几何平均；渲染失败按失败计。","本地裁判是替代品：论文用 Gemini 3.0 Pro，本地用 MiniMax-M3 —— 分数只能内部比较，不可对外与论文对照（此 caveat 已写入 summary.json 和 HTML）。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=3，均分 6.77，sd 0.41——不受限但模型少。","渲染成败混入分数：一部分方差来自\"会不会写能跑的 Manim 代码\"（工程能力）而非教学可视化能力。","它是 P10 的唯一证据来源（孤证）——P10 的任何结论都依赖这一个 benchmark + 替代裁判。"]}],"file":"eduillustrate.md","missing":false}},{"id":"ifeval","name":"IFEval","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"可验证指令的规则判分（官方 checker，无裁判），P01 的首个直接测量（2026-07-12 缺口填补，R13：edubench 裁判打的指令遵循分在模型排名上无独立信息量）。通用指令非教育语境，作 P01 操作基座的门槛证据。","profile":{"title":"IFEval","one_liner":"541 条带可机器验证硬约束的指令（字数、格式、关键词、大小写等），官方规则代码判分——P01（指令与约束遵循）的第一个直接测量。","sections":[{"heading":"出处与背景","bullets":["Zhou et al. 2023, *Instruction-Following Evaluation for Large Language Models*（arXiv:2311.07911），google-research 官方实现，Apache-2.0。","接入动机（R13/R14）：edubench 裁判打的\"指令遵循\"分与知识指标在模型排名上信息重合（同源模型级 ρ≈0.96），且换裁判后不稳健——P01 的直接测量必须走规则判分。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark ifeval → sources/datasets/ifeval/data/input_data.jsonl（541 条）+ 官方 checker 四个模块 vendored 到 sources/datasets/ifeval/instruction_following_eval/。","判分依赖 nltk / langdetect / immutabledict / absl-py（miniconda python 已装；fetch 时自动下 nltk punkt）。"]},{"heading":"任务与判分","bullets":["每条 prompt 带 instruction_id_list + kwargs（约 25 种指令类型）；无裁判、无抽取 LLM，直接对原始回复跑官方检查。","headline = 官方 prompt 级 strict accuracy（一条 prompt 的全部指令在原始回复上全部满足）；extra_metrics 含 prompt-loose / instruction-strict / instruction-loose（loose 按官方 8 变体重试：去首行/尾行/去 *）。"]},{"heading":"局限与注意","bullets":["通用指令、英文为主，不是教育语境——按 foundation_gate 挂 P01，作操作基座门槛证据，不宣称教育指令遵循。","部分指令（如\"重复请求原文\"）会让回复看起来像回显题面，是正常现象。"]}],"file":"ifeval.md","missing":false}},{"id":"k12vista","name":"K12Vista","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"中文 K12 图文学科题（五学科×三学段，固定 300 题分层抽样）。R15 裁决：挂 P03 学科图表 facet 0.55（P03/P04 合并后难度不再分 P）；判分用官方 rubric 的 LLM 裁判逐空 0/1，裁判未校准、仅 4 个视觉模型可跑——参考值。","profile":{"title":"K12Vista","one_liner":"3.3 万道中文 K12 图文学科题（数理化生地 × 小初高，选择/填空/问答），必须先读懂学科图再多步推理——P04（复杂多模态理解）的第一个直接测量，也是中文多模态的补位。","sections":[{"heading":"出处与背景","bullets":["Li et al. 2025, *K12Vista*（arXiv:2506.01676），官方仓库 github.com/lichongod/K12Vista，数据 lipku1999/K12-Vista（公开，无 gate）。","接入动机：P04 在测量模型 v1 里是四个完全空白的 P 之一（model_type: undeclared，零格子）。缺口推荐文档（2026-07-11）把 K12Vista 列为首选，理由是中文、公开有标签、静态图文、接入成本与 mathvista 同级。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark k12vista → 克隆官方仓库（要 K12_Vista/code/prompt.py）+ 下 K12_Vista.jsonl（33,660 行 / 501 MB）。","图是 base64 内嵌在 img 字段的，没有单独的图片包——省了配图这一步。","build_k12vista_sample.py --size 600 生成固定题单 data/k12vista/item_list_v2.txt：按 题型 × 学科-学段 分层（33 个层，按人口比例分配、每层至少 1 题），解码出图片到 sources/datasets/k12vista/images/，并写一份去掉 base64 的瘦身 jsonl。所有模型跑同一份题。","抽样构成：选择题 209 / 填空题 198 / 问答题 193；11 个学科-学段各 53-64 题；难度 难 426 / 较难 132 / 中 31 / 较易 11（自然分布，与全量一致）。","难度为什么不做分层轴：difficulty 是数据自带的五档标签，但论文对它怎么来的只字未提，官方 evalaute.py 的汇总轴也只有 题型 × 学科-学段（学段已编码在 subject 里，如 math-g9），根本不用它；而且全量分布极偏（难 71.7% / 较难 22% / 易仅 4 题）。v1 拿它当第三轴撑出 121 个层，每层至少 1 题的地板吃掉 300 个名额里的 121 个，把样本拉得比全量偏易约 15pp（难档 54.7% vs 全量 71.7%）。v2 起难度只作报告分桶，并注明标签未经校准。","样本量：600 题时总分 95% CI 约 ±4pp，单个学科-学段桶约 ±13pp（v1 的 300 题分别是 ±5.7pp / ±17-20pp）。要在学科-学段这一档做严肃比较（每桶 ±10pp 以内）可提到 900——改 --size 重跑即可，脚本幂等。"]},{"heading":"任务与判分","bullets":["提示词照搬官方 prompt.py::infer_prompt['directly_infer_prompt'][题型]（三种题型三套）。官方 runner 会把题干里的 <image> 占位符删掉、把图放在文本前面（models/vllminfer.py），我们一致。","官方 evalaute.py 的汇总轴是 题型 × 学科-学段，外加按学科、按学段的边际——不含难度。","判分照搬官方 eval_prompt['directly_eval_prompt'][题型]：裁判逐空提取参考答案与学生答案，输出 <evaluation>[[参考],[学生],[0/1 列表]]</evaluation>，题分 = 各空得分均值（多空题部分给分，见 models/K12_PEM_judgemodel.py）。","表头 accuracy = 严格全对率（所有空都对）；官方口径的部分给分均值在 extra_metrics.official_score，score_10 = 10× 它，供能力聚合用。按题型/学科/学段/难度分桶。"]},{"heading":"局限与注意","bullets":["裁判不是官方那一个。官方判分用 GPU 部署的 Qwen2.5-VL-72B 或微调的 K12-PEM，本地起不来；这里换成 API 裁判（K12VISTA_JUDGE_MODEL，默认 MiniMax-M3）。rubric 原文一字未改，但裁判模型本身没有拿人工金标校准过，报告里必须直说，不能声称与官方榜单可比。","裁判只看文本（题干、标准答案、解析、学生作答），不看图——官方也是这样，所以裁判不需要视觉能力。","模型面天然受限：主测 5 个模型里只有 2 个能看图。2026-07-13 用真实题图逐个探测的结果——能看图：MiniMax-M3、doubao-seed-2.0-pro、doubao-seed-2.0-lite、kimi-k2.6；不能看图：MiniMax-M2.7（纯文本）、glm-5.2（网关 400）、deepseek-v4-pro。","deepseek-v4-pro 是个陷阱：收到图片不报错、返回 200，然后回一句\"你没有上传图片\"照样作答。跑之前不探测的话，会静默产出一堆瞎猜的分数而判分链路毫无警告。文本模型在 K12Vista 上必须标\"不适用\"，绝不能记 0 分——那是测量假象不是能力差距。","建议模型面：MiniMax-M3 + doubao-seed-2.0-pro（主测 5 中的两个）+ doubao-seed-2.0-lite + kimi-k2.6（补充档），凑够 4 个模型，13 号检查的跨模型相关才有最低样本量（≥3）。","只跑 600 题抽样，不跑全量 33k：预算约束，且分层已覆盖全部 33 个层。抽样误差要在报告里带上（bootstrap CI）。"]}],"file":"k12vista.md","missing":false}},{"id":"longtutor_diagnosis","name":"LongTutor 知识状态诊断","confidence":0.85,"metric_family":"accuracy_or_f1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"从交互历史推断学生知识状态（四类认知层失败机制），headline macro-F1。2026-07-16 裁决：P16a『知识状态估计』主挂 0.30（参考值）+ P11c（原 P13）副挂 0.10，P11b（原 P12）排除（输入无解题步骤）。注记：类别不平衡（多数类基线 acc 0.506 > 模型 0.35-0.44）；金标为特征决策矩阵+人工修订，非独立盲标。","profile":{"title":"LongTutor · 学生状态诊断","one_liner":"LongTutor 三个子评测之一——从一段长的交互历史里判断这个学生现在的知识状态，四分类。","sections":[{"heading":"这是哪个子评测","bullets":["家族 LongTutor 面向长程辅导场景，本仓库实现了三个子评测：证据定位、本页的学生状态诊断、以及长历史下的教学动作选择。","三者是一条链：先找得到证据，才谈得上判断状态，再谈得上选对动作。本页是中间环节，也是学习者画像能力目前唯一的主证据。","与\"错因归因\"的区别在于时间尺度：归因是从这一次的作答解释这次为什么错，本页是从整段历史判断这个学生整体会什么、不会什么。"]},{"heading":"出处与背景","bullets":["官方仓库只提供 pipeline 脚本，本仓库自行移植为可复现的 adapter，绝对分不与原论文对照。"]},{"heading":"任务与判分","bullets":["给定长交互历史，模型把学生的知识状态归入四类之一，取 macro-F1。","取 macro-F1 而非准确率，因为类别分布不平衡。"]},{"heading":"局限与注意","bullets":["分数很低（约 2.0–3.2），这是真实发现不是测量故障，但要带两条注记读。","一是类别不平衡的严重程度：多数类基线的准确率是 0.506，而模型只有 0.35–0.44——也就是说模型的判断还不如\"永远猜最常见的那一类\"。","二是金标的产生方式：由特征决策矩阵加人工修订得到，不是独立盲标，金标本身带有构造痕迹。","这一项同时作为错因归因的弱信号计入，但那不是它的主场。"]}],"file":"longtutor_diagnosis.md","missing":false}},{"id":"longtutor_evidence","name":"LongTutor 证据抽取","confidence":0.7,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"长学生历史（约 200 条作答记录）上的单记录提取/跨 session 推理/幻觉检查，规则+语义等价裁判。R21(2026-07-19)：按 memory_type 拆三格等权直接测量（单记录提取近天花板 0.93–0.97，跨 session 推理 0.60–0.70 与幻觉检查 0.61–0.75 才有区分度）；四模型面（M2.7 补跑后）总分 0.71–0.81 已拉开，区分度红旗解除。","profile":{"title":"LongTutor · 证据定位","one_liner":"LongTutor 三个子评测之一——在长辅导材料和多轮历史里找到该找的那句话，并且不编造材料里没有的内容。","sections":[{"heading":"这是哪个子评测","bullets":["家族 LongTutor 面向长程辅导场景，本仓库实现了三个子评测：本页的证据定位、学生状态诊断、以及长历史下的教学动作选择。","三者共享同一批长程辅导对话，但测的是链条上的不同环节：先找得到证据，才谈得上判断学生状态，再谈得上选对教学动作。","本页内部再按记忆类型拆成三个取分维度：单条信息提取、跨会话推理、幻觉核查。"]},{"heading":"出处与背景","bullets":["官方仓库只提供 pipeline 脚本，没有可直接执行的评测实现，本仓库自行移植为可复现的 adapter。","因此绝对分不与原始论文对照，横向比较可用。"]},{"heading":"任务与判分","bullets":["三个维度各自按准确率计分，分开取值而不是合成一个总分。","分开是必要的：单条信息提取几乎人人满分（约 9.3–9.7），跨会话推理（约 6.0–7.0）和幻觉核查（约 6.1–7.5）才有区分度。合成总分会把后两者的信号稀释掉。"]},{"heading":"局限与注意","bullets":["移植实现与官方流程可比，但不是逐字节复现，置信度做了折价。","单条信息提取一维已接近天花板，看这项能力的差距时，实际信息基本来自另外两维。","幻觉核查这一维值得单独关注——长程辅导里模型凭空补出的\"学生说过的话\"，会污染后续所有个性化判断。"]}],"file":"longtutor_evidence.md","missing":false}},{"id":"longtutor_teaching","name":"LongTutor 教学动作","confidence":0.7,"metric_family":"likert_1_to_5","score_direction":"higher_better","source_scope":"repo_eval","rationale":"生成利用具体历史证据的教学反馈，固定裁判四维 1-5 分。2026-07-16 裁决：挂 P17 执行 facet 0.30，取 strategy_alignment + history_utilization 两维均值（coherence/appropriateness 不入分）；三模型 valid 1001、strategy_alignment 3.68-4.13 有区分度；3 模型面不补跑。","profile":{"title":"LongTutor · 长历史教学动作","one_liner":"LongTutor 三个子评测之一——在积累了很长交互历史的情况下，选出并做出合适的下一个教学动作。","sections":[{"heading":"这是哪个子评测","bullets":["家族 LongTutor 面向长程辅导场景，本仓库实现了三个子评测：证据定位、学生状态诊断、以及本页的教学动作选择。","三者是一条链的三个环节，本页是终点：前两步做对了，这一步才谈得上做对。","与其他辅导类评测的区别是上下文长度——同样是选下一步教学动作，这里的模型必须先消化一段很长的历史。"]},{"heading":"出处与背景","bullets":["官方仓库只提供 pipeline 脚本，本仓库自行移植为可复现的 adapter，绝对分不与原论文对照。"]},{"heading":"任务与判分","bullets":["取两个维度：教学策略是否对齐、以及是否真的用上了历史信息。","后一维是这个子评测的特色——很多模型在长历史条件下会退化成忽略历史、按通用套路回复。"]},{"heading":"局限与注意","bullets":["分数区间约 3.6–6.5，有一定区分度。","移植实现，置信度做了折价，在教学策略执行上只作弱信号计入。","长历史条件下的教学动作与短对话条件下的教学动作是否同一构念，目前没有实证检验。把它和其他辅导类证据放进同一层，是一个尚未验证的假设。"]}],"file":"longtutor_teaching.md","missing":false}},{"id":"mathtutorbench_mistake_correction","name":"MathTutorBench","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"纠错需要识别错因并生成可用修正/反馈；R6 裁决错因归因（原 P13，现 P11c）权重 0.45→0.20（只测改对与否）。","profile":{"title":"MathTutorBench · Mistake Correction","one_liner":"MathTutorBench 九个子任务之一——看出学生哪里错了之后，给出改对的解答。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是纠错任务。","它是错误诊断三层里最深的一层的一部分：判对错、定位步骤之后，纠错要求模型真的把正确的路径走出来。","与前两层分开计分，是因为纠错同时需要诊断和重新解题两种能力，失败原因可以来自任何一侧。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","学生解答数据来自 eth-nlped/stepverify，英文。"]},{"heading":"任务与判分","bullets":["给定含错的学生解答，模型产出修正后的正确答案，从回复中提取答案后按规则判分。","不经过裁判，但判的是最终答案而不是修正过程。"]},{"heading":"局限与注意","bullets":["区分度受限：实测均分 9.02，模型普遍接近天花板；在早期试跑里它与纯门槛类任务的相关接近 1，说明它测到的很大一部分其实是解题能力。","判最终答案而不判修正过程，意味着\"改对了但没说清为什么原来错\"拿的是满分。它作为错因归因的证据只能算弱信号，主证据在别处。","这一项同时给推理与生成、适配性解释两项能力提供弱信号，都是尾部权重。"]}],"file":"mathtutorbench_mistake_correction.md","missing":false}},{"id":"mathtutorbench_mistake_location","name":"MathTutorBench","confidence":1.0,"metric_family":"accuracy_or_f1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"错误位置定位是 P11b（原 P12）的直接测量。","profile":{"title":"MathTutorBench · Mistake Location","one_liner":"MathTutorBench 九个子任务之一——学生解答里第一处错误出现在哪一步，指出来。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是定位错误步骤的那个。","它夹在判定正误和给出修正之间，是错误诊断三层里的中间层：知道错了还不够，要说得出错从哪里开始。","这一层对教学的价值很直接——能定位到步骤，反馈才可能具体，否则只能说一句\"你再检查检查\"。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","学生解答数据来自 eth-nlped/stepverify，逐步骤标注了首个出错位置，英文。"]},{"heading":"任务与判分","bullets":["给定题目与一份含错的学生解答，模型指出第一处错误发生在哪一步。","规则判分，与标注的首错步骤比对，不经过裁判。"]},{"heading":"局限与注意","bullets":["区分度受限：实测标准差仅 0.10，模型之间基本无差别。","这一项同时作为长上下文与证据定位能力的弱信号计入——定位行为是真实的，但材料很短，测不出长材料下的定位压力，所以权重压得很低。","只测首处错误。学生解答里往往有连锁错误，\"后面几步是被第一步带歪的还是独立错的\"这个区分没有覆盖。"]}],"file":"mathtutorbench_mistake_location.md","missing":false}},{"id":"mathtutorbench_pedagogy","name":"MathTutorBench","confidence":0.85,"metric_family":"win_rate_or_accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"教学法指令遵循主测策略选择和适配反馈。","profile":{"title":"MathTutorBench · Pedagogy Instruction Following","one_liner":"MathTutorBench 九个子任务之一——明确告诉模型该用哪种教学法，看它能不能照着做出来。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是教学法指令遵循，另有一个更难的 hard 变体单独计分。","它属于家族里四个开放式生成任务之一，判分方式是与参考回复比较的胜率。","与脚手架任务的区别在于：脚手架考的是自己选对下一步，这一项是策略已经给定，只考执行——把\"不会选\"和\"选了也做不出\"两种失败分开。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","对话数据来自 MathDial，英文。"]},{"heading":"任务与判分","bullets":["给定辅导上下文和一条教学法指令，模型按该教学法生成回复，与参考回复成对比较取胜率。","官方用专家级奖励模型判分，本仓库改用 LLM 裁判做成对判决。"]},{"heading":"局限与注意","bullets":["分数区间约 7.5–8.7，比同家族的脚手架任务高出一大截。给定策略就做得出来、要自己选就做不好，这个对比很能说明问题。","这一项同时挂在教学专业知识上——按教学法指令生成，是教学法知识的生成式测法，与选择题式的测法互补。","与 hard 变体的跨模型相关为 0.92，两者信息高度重叠。"]}],"file":"mathtutorbench_pedagogy.md","missing":false}},{"id":"mathtutorbench_pedagogy_hard","name":"MathTutorBench","confidence":0.85,"metric_family":"win_rate_or_accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"hard 子集较有区分度，权重略高。","profile":{"title":"MathTutorBench · Pedagogy Instruction Following (hard)","one_liner":"MathTutorBench 九个子任务之一——教学法指令遵循的加难版，指令照旧给定，情境更棘手。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是教学法指令遵循的 hard 子集，与常规版分开计分。","它属于家族里四个开放式生成任务之一，判分方式是与参考回复比较的胜率。","家族里两个 hard 变体中，这一个是相对更有信息量的：它比常规版拉得开一些。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","对话数据来自 MathDial，英文。"]},{"heading":"任务与判分","bullets":["给定较难的辅导上下文和一条教学法指令，模型按该教学法生成回复，成对比较取胜率。","官方用专家级奖励模型判分，本仓库改用 LLM 裁判做成对判决。"]},{"heading":"局限与注意","bullets":["区分度尚可：实测均分 8.00、标准差 0.71，是家族两个 hard 变体里表现更有区分力的一个。","与常规版的跨模型相关 0.92，信息重叠度高，不应视为两份独立证据。","分数区间约 6.6–8.6，仍明显高于同家族的脚手架任务——策略给定和策略自选之间的落差在 hard 条件下依然成立。"]}],"file":"mathtutorbench_pedagogy_hard.md","missing":false}},{"id":"mathtutorbench_problem_solving","name":"MathTutorBench","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"数学求解门槛，重要但不能证明会辅导。","profile":{"title":"MathTutorBench · Problem Solving","one_liner":"MathTutorBench 九个子任务里最基础的一个——不辅导、不引导，就是把数学题做对，用来卡\"连题都做不对就别谈教\"的门槛。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench（ETH Zurich LRE 组，2025）按学习科学理论把\"辅导\"拆成九个可分别计分的任务，本页是其中的解题任务。","九个任务分三类判分：四个规则判分的硬任务（解题、判解法对错、定位错误步骤、给出修正）、一个用 BLEU 对金标问句比对的苏格拉底式提问、四个用胜率判分的开放辅导任务（脚手架与教学法指令，各含一个 hard 变体）。","每个子任务单独计分而不合成家族总分，是因为它们的难度与判分方式差得太远——合成会让门槛类任务的高分掩盖辅导类任务的低分，而那个落差恰恰是本体系最想呈现的结论。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","题源为 GSM8K 的小学数学应用题，英文。"]},{"heading":"任务与判分","bullets":["给一道数学题，模型直接作答，按数值匹配规则判分，不经过任何裁判。","这是家族里判分最硬的一类，分数没有裁判噪声。"]},{"heading":"局限与注意","bullets":["严重受限的区分度：实测均分 9.70，模型几乎全部贴在天花板上，拉不开差距。","它证明的是\"会做题\"，完全不能证明\"会教\"。整个体系里它的权重被刻意压得很低，就是为了不让解题能力冒充教学能力。","看这一项时，建议同时看同一家族的脚手架任务——同一批模型在那里的分数区间是 1.4 到 6.0，反差本身就是结论。"]}],"file":"mathtutorbench_problem_solving.md","missing":false}},{"id":"mathtutorbench_scaffolding","name":"MathTutorBench","confidence":0.85,"metric_family":"win_rate_or_accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"脚手架主测下一步教学干预选择与反馈生成。","profile":{"title":"MathTutorBench · Scaffolding","one_liner":"MathTutorBench 九个子任务之一——学生卡住了，给出下一句辅导回复，搭一级刚好够他自己迈上去的台阶。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是脚手架生成，另有一个更难的 hard 变体单独计分。","它属于家族里四个开放式生成任务之一（脚手架、脚手架 hard、教学法指令、教学法指令 hard），判分方式是与参考回复比较的胜率，而不是规则匹配。","这是整个体系里最接近\"真的在辅导\"的任务：不给答案、不讲一整套，只给下一步。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","对话数据来自 MathDial，真实学生数学错误场景，英文。"]},{"heading":"任务与判分","bullets":["给定辅导对话上下文，模型生成下一句回复，与参考回复做成对比较，取胜率。","官方用一个 GPU 上的专家级奖励模型判分（该模型能区分专家教师与新手教师的回复）；本仓库改用 LLM 裁判做成对判决，绝对分因此不可与论文对照，横向比较仍然可用。"]},{"heading":"局限与注意","bullets":["全体系区分度最好的格子之一：实测均分 3.36、标准差 1.83，模型之间差距巨大且真实。想看模型的教学能力差异，这里比任何门槛类任务都有信息量。","分数普遍偏低（约 1.4–6.0）。同一批模型在纯解题任务上接近满分，落差就是\"会答题≠会教\"最直接的证据。","胜率类分数依赖裁判，也与参考回复的风格相关——风格差异大的好回复可能被判负。","与 hard 变体的跨模型相关高达 0.98，两者提供的其实几乎是同一份信息，不应视为互相印证的两份证据。"]}],"file":"mathtutorbench_scaffolding.md","missing":false}},{"id":"mathtutorbench_scaffolding_hard","name":"MathTutorBench","confidence":0.85,"metric_family":"win_rate_or_accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"hard 子集仍主测教学干预与反馈。","profile":{"title":"MathTutorBench · Scaffolding (hard)","one_liner":"MathTutorBench 九个子任务之一——脚手架任务的加难版，同样是给出下一句辅导回复，但上下文更棘手。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是脚手架的 hard 子集，与常规版分开计分。","它属于家族里四个开放式生成任务之一，判分方式是与参考回复比较的胜率。","分开计分的初衷是看难度上升后模型是否掉队——实测结果并不支持这个假设，见下方注记。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","对话数据来自 MathDial，英文。"]},{"heading":"任务与判分","bullets":["给定较难的辅导对话上下文，模型生成下一句回复，与参考回复成对比较取胜率。","官方用专家级奖励模型判分，本仓库改用 LLM 裁判做成对判决，绝对分不与论文对照。"]},{"heading":"局限与注意","bullets":["区分度很好：实测均分 2.98、标准差 1.62，与常规版同属全体系拉得最开的一批格子。","与常规版的跨模型相关高达 0.98。 也就是说 hard 变体几乎没有带来新信息，两者本质是同一份证据的两次呈现。做效度检验时不得互为独立证据。","分数区间约 1.3–5.6，比常规版整体再低一档。"]}],"file":"mathtutorbench_scaffolding_hard.md","missing":false}},{"id":"mathtutorbench_socratic","name":"MathTutorBench","confidence":1.0,"metric_family":"bleu_0_to_1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"生成引导性提问、与教师金标问题比 BLEU，是 P17a（提问式干预）的测量来源（R11 补挂，2026-07-12；按拆分准入规则提问不单列子能力）。BLEU 对合理的不同问法会误罚，权重保守。","profile":{"title":"MathTutorBench · Socratic Questioning","one_liner":"MathTutorBench 九个子任务之一——不直接给答案，而是提一个能把学生引到自己发现问题的问句。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是苏格拉底式提问。","它在判分方式上自成一类：既不是规则判分的硬任务，也不是胜率判分的开放任务，而是拿模型生成的问句和金标问句比措辞相似度。","引导式提问是辅导里最能体现\"不代替学生思考\"的动作，构念上很重要，但正因为好问题有很多种问法，它也是最难判分的。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","对话数据来自 MathDial，真实学生数学错误场景，英文。"]},{"heading":"任务与判分","bullets":["给定学生犯错的对话上下文，模型生成下一句引导性提问。","用 SacreBLEU 与金标问句取最佳匹配打分。"]},{"heading":"局限与注意","bullets":["BLEU 对短问句是弱指标。 一个合理但换了说法的好问题会被误罚，而措辞贴近金标的平庸问题反而得分高——分数方差里\"引导质量\"和\"措辞相似\"分不开。","分数整体很低（约 2.1–3.0），但这个低分至少有一部分来自判分方式而非模型表现，不宜直接读作\"模型不会引导\"。","因为这个问题，它在教学策略执行上的权重被下调，让语义更鲁棒的胜率类证据主导；同时作为适配性解释的弱信号计入。"]}],"file":"mathtutorbench_socratic.md","missing":false}},{"id":"mathtutorbench_solution_correctness","name":"MathTutorBench","confidence":1.0,"metric_family":"accuracy_or_f1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"给定参考/学生解判断正确性，主测作答正误判定。","profile":{"title":"MathTutorBench · Solution Correctness","one_liner":"MathTutorBench 九个子任务之一——给一份学生写的解答，判断它对不对，这是错误诊断的第一层。","sections":[{"heading":"这是哪个子任务","bullets":["家族 MathTutorBench 把辅导拆成九个可分别计分的任务，本页是判定学生解答正误的那个。","与它相邻的两个诊断任务是定位错误步骤和给出修正，三者构成诊断由浅入深的三层：判对错、指出哪一步、说清怎么改。","三层分开计分，是因为模型的表现明显不同步——判得出对错，未必定位得准，更未必解释得了。"]},{"heading":"出处与背景","bullets":["ETH Zurich LRE 组（Macina 等），2025；https://github.com/eth-lre/mathtutorbench","学生解答数据来自 eth-nlped/stepverify，英文。"]},{"heading":"任务与判分","bullets":["给定题目、参考解和一份学生解，模型判断学生解是否正确。","规则判分，判分逻辑移植自官方实现，不经过裁判。"]},{"heading":"局限与注意","bullets":["区分度受限：实测均分 8.68、标准差仅 0.16，模型之间几乎没有差别。当前模型判\"对还是错\"已经普遍过关。","这一项同时作为自我校验能力的辅助证据计入——判别别人的解法对错和复查自己的输出共享同一种核验动作，但它不是那项能力的主证据。","判对错是诊断里最浅的一层。这一项分数高，不说明模型能指出错在哪，更不说明能解释为什么错。"]}],"file":"mathtutorbench_solution_correctness.md","missing":false}},{"id":"mathvista","name":"MathVista","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"静态图文数学题，主要测多模态理解（解题图像 facet）、数学推理和知识调用。","profile":{"title":"MathVista","one_liner":"图文结合的数学推理基准（图表、几何图、函数图像），测多模态模型\"看图做数学\"的能力。","sections":[{"heading":"出处与背景","bullets":["Lu Pan 等（UCLA / 微软），2023，ICLR 2024；https://github.com/lupantech/MathVista","动机：数学推理评测此前几乎全是纯文本，MathVista 把 28 个既有多模态数据集 + 3 个新建子集统一成一个视觉数学基准。"]},{"heading":"数据","bullets":["6,141 题；常用 testmini 1,000 题（带答案）；英文。","图片需单独下载：cd sources/datasets/mathvista/data && wget .../images.zip && unzip。"]},{"heading":"任务与判分","bullets":["混合题型（选择/数值/文本），按 task / question_type / answer_type 分桶。","判分移植官方 evaluation/：few-shot 提取提示（ext_ans.demo_prompt）+ normalize_extracted_answer + 最近选项编辑距离，重实现在 scripts/eval/scoring.py，无额外依赖。"]},{"heading":"在本仓库怎么用","bullets":["adapter scripts/eval/benchmarks/mathvista.py；必须用视觉模型（MiniMax-M3 可以，M2.7 纯文本不行）；--dry-run 会省略 base64 图片打印消息。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=1——只有一个模型跑过，完全没法做配对分析。补模型清单里要带上它。","题源来自公开数据集拼装，部分子集污染风险高。","感知与推理混在一个 accuracy 里，拆不开（构念核对里归\"解题式图像理解\"）。"]}],"file":"mathvista.md","missing":false}},{"id":"mmlu_pro","name":"MMLU-Pro","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"基础学科知识与选择题答题能力，主要验证 LLM 答题门槛，不应主导教育能力雷达图。R22：0.35→0.7——精确匹配判分最硬却被压到低于裁判天花板分的 edubench，倒挂；护栏由映射结构（不挂教育侧 P）承担。","profile":{"title":"MMLU-Pro","one_liner":"MMLU 的高难升级版——选项从 4 个加到 10 个、题目偏推理，用来测大学水平的学科知识与答题能力。","sections":[{"heading":"出处与背景","bullets":["TIGER-Lab，2024（论文 *MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark*）；https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro","动机：原版 MMLU 被强模型刷到 88%+ 接近饱和，且对 prompt 敏感；MMLU-Pro 通过 10 选 1 + 提高推理占比来恢复区分度。"]},{"heading":"数据","bullets":["约 12,000 题，14 个学科大类（数学、物理、化学、法律、工程、心理学等），英文。","获取：TIGER-Lab/MMLU-Pro 公开可下（注意 TIGER-AI-Lab/ 路径是 gated 的，别用错）；fetch_eval_datasets.py --benchmark mmlu_pro 落到 sources/datasets/。"]},{"heading":"任务与判分","bullets":["10 选 1 选择题，模型输出选项字母。","规则判分：官方 answer is (X) 正则提取，失败时走 LLM 提取兜底；精确匹配字母。无裁判依赖。"]},{"heading":"在本仓库怎么用","bullets":["adapter scripts/eval/benchmarks/mmlu_pro.py，--benchmark mmlu_pro。","按 category 出分桶。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=5，均分 8.60，标准差 0.21 → ceiling + low_variance 双标记，当前模型集上排名基本无信息量。","训练数据污染风险高（公开考试题库类）。","纯英文，对中文教育场景是间接证据。"]}],"file":"mmlu_pro.md","missing":false}},{"id":"mmtutorbench","name":"MMTutorBench","confidence":0.85,"metric_family":"score_0_to_6","score_direction":"higher_better","source_scope":"repo_eval","rationale":"多模态 tutor 综合测图文感知、反馈生成和策略选择；当前小样本默认排除主图。","profile":{"title":"MMTutorBench","one_liner":"视频关键帧数学辅导基准——模型看教学视频的关键帧序列 + 学生提问，生成结构化辅导回复，裁判按 6 个二元维度打分。","sections":[{"heading":"出处与背景","bullets":["HF Tangchiu/mmtutorbench，2025。","动机：真实辅导常发生在\"学生看着题/看着讲解卡住了\"的多模态语境，考察模型能否基于视觉上下文做辅导（而非只看文字）。"]},{"heading":"数据","bullets":["770 条 JSONL 样本、1,414 张关键帧图片。英文。","获取：fetch_eval_datasets.py --benchmark mmtutorbench（JSONL + 关键帧 + data_manifest.json）。"]},{"heading":"任务与判分","bullets":["输入：历史关键帧 + 当前帧 + 学生提问；要求回复分三段：Insight Discovery / Operation Formulation / Operation Execution。","固定 rubric 裁判（MMTUTORBENCH_JUDGE_MODEL，默认 MiniMax-M3）按 6 个二元维度判分：insight_identification、operation_prescription、operation_execution、solution_scope_control、brevity、coherence；报告 0-6 总分 + 论文等权分。","mmtutorbench_judge_calibration 只是占位：公开数据没有逐条人类金标，无法做裁判校准（输出状态而非编造校准）。"]},{"heading":"在本仓库怎么用","bullets":["首次冒烟：LIMIT=5 MODEL=MiniMax-M3 JUDGE_MODEL=MiniMax-M3 ./scripts/run_eval.sh mmtutorbench；不要默认跑全量 770。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=1（默认小样本、单模型），当前不进主图（映射备注\"小样本默认排除\"）。","无人类金标 → 裁判分数完全没有外部锚点，只能做模型间相对比较。","三段式格式要求让分数混入格式遵循成分。"]}],"file":"mmtutorbench.md","missing":false}},{"id":"mooccube_prereq","name":"MOOCCube 先修关系推理","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"MOOCCube（ACL 2020，学堂在线）905 条专家先修边当金标，200 道先修选择 + 100 道排序，100% 规则判分，P19（知识结构层路径规划）的首个测量。R16 裁决：P19 0.70 / P05 0.20 / P06 0.10；自建协议、无公开基线，benchmark weight 压到 0.70，参考值；『按学习者状态定制路径』是 P16×P19 组合能力，不设 P19b。","profile":{"title":"MOOCCube 先修关系推理","one_liner":"拿学堂在线知识图谱里 905 条专家标注的先修边当金标，自建两类题（先修选择 + 学习顺序排序），100% 规则判分、零裁判——P19（学习路径规划）的第一个直接测量，但只覆盖\"知识结构\"那一半。","sections":[{"heading":"出处与背景","bullets":["Yu et al. 2020, *MOOCCube: A Large-scale Data Repository for NLP Applications in MOOCs*（ACL 2020），学堂在线 706 门真实课程 / 38,181 个视频 / 114,563 个概念 + 概念图谱。官方页 moocdata.cn，数据一个 1.09 GB 的 zip 直接下，无需申请。","接入动机：P19 在测量模型 v1 里是四个完全空白的 P 之一（model_type: undeclared，零格子）。缺口推荐文档（2026-07-11）把 MOOCCube 列为 P19a（先修关系推理）的首选：图谱现成、规则判分，代价是任务协议要自己设计（MOOCCube 原文没有这个任务）。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark mooccube → 下 zip + 解压到 sources/datasets/mooccube/MOOCCube/（gitignored，1.09 GB 压缩 / 解压后约 4 GB）。","概念 id 的形状是 K_<名称>_<领域>（例：K_IP地址_计算机科学技术），领域直接从 id 尾巴切出来，不需要再 join concept-field.json。","金标只有两个领域：数学 525 条边、计算机科学技术 502 条（其中 35 条跨领域，出题时丢弃）。","方向是我验证过的，不是猜的——在语义无歧义的样例上核对：加法→函数、算术→绝对值、算法→时间复杂度、向量→巴拿赫空间，左列一律是先修。","1. 有环。60 个概念落在环上（图谱不是 DAG）。所以：排序题只采导出子图无环的连通子图；选择题的干扰项合法性一律走传递闭包判定（干扰项不得 ∈ anc[Y]），环上节点被闭包自动排除。凭\"这是 Y 的后继所以肯定不是先修\"这种直觉写代码会错。","2. 不完备。905 条边远不是数学+计算机全部的先修关系（见\"局限\"）。","为什么不用后者当金标（这是本次接入最需要拿主意的地方）：","1. 它和图谱边几乎是两套标注——1,605 条正例里只有 28 条能和 905 条图谱边对上（1.7%）。不是同一份东西的两种存法。","2. 它的主体是模型的猜测。489,300 对里 98.5% 是 label: -1（无人工标签）+ 一个模型的 predict 概率。拿它当金标 = 拿另一个模型的输出当真值，正是本仓库反复要避免的事（P19 的分数不能背裁判/模型噪声）。","3. 按名字编码，join 不回去。没有 id 就拿不到领域、定义、课程，做不了同领域干扰项——而同领域干扰项恰恰是这个评测不退化成常识题的命门。","它那 2,011 条人工负例本身是有价值的（是\"已验证的非先修对\"，比图谱闭包推出来的负例更硬），但词表对不上，这次没用。后续想用：需要先做一次 名字→id 的消歧映射（同名概念跨领域会撞），值得单独做一版。"]},{"heading":"任务与判分","bullets":["题目由 build_mooccube_item_list.py 从图谱构造（固定 seed 20260713，分层抽样，300 题：200 选择 + 100 排序），产出 data/mooccube/item_list_v1.txt + manifest（含生成题目文件的 sha256，adapter 每次跑都校验），所有模型跑同一份题。","① 先修选择（200 题，随机基线 0.25）：给概念 Y 和它的定义，问\"学 Y 之前必须先掌握下面哪一个\"。正确选项是图谱里 Y 的真实先修概念；三个干扰项全部同领域，且优先采 Y 的后继概念（reverse——Y 才是它们的先修，方向反了），不足时补\"同领域 + 与 Y 同课程 + 图谱闭包里与 Y 无先修通路\"的近邻概念。200 题里 102 题带方向反转陷阱。判分：正则抽 答案：<字母>，精确匹配。","真实的一道题（mooccube-mcq-05bbc39615）：","四个选项全是计算机网络的词——选对必须知道方向，\"听起来相关\"没用。","选择题的出题算法（build_mcq_pool），逐个概念 Y 走一遍：","为什么正确项位置用轮转不用 shuffle：shuffle 出来的 gold 分布会偏（第一版实测 A=36 / C=57），\"永远选 C\" 就能拿 28.5%。轮转把恒定策略压回 25% 附近（实测最好的恒定策略 0.275）。","② 学习顺序排序（100 题，随机基线均值 0.030）：4-6 个有依赖关系的概念打乱给出，要求排出满足全部先修约束的顺序。不要求唯一拓扑序——任何满足全部依赖的顺序都算对；部分分 = 满足的约束比例。","排序题的出题算法（build_order_pool）：从随机种子概念出发，沿 succ ∪ pred 随机扩张成 4-6 个点的连通集 → 取导出子图 → 无环检查（三色 DFS，有环就丢）→ 精确枚举 n! 种排列算随机通过概率（n≤6 → ≤720 种，便宜）→ 只保留 chance ≤ --max-order-chance（默认 0.05）→ 概念顺序打乱后存题。","一道真题（mooccube-order-0455d1dc06，5 个概念 / 4 条约束 / chance 0.033）：","extract_answer 里不发任何 API 请求——这是 P19 的硬约束，分数不能背抽取模型的噪声。","选择题：三级正则兜底。① 答案\\s*[:：]?\\s*\\(?\\[?([A-Da-d])（取最后一个匹配，避免模型在思考里先写错再改）；② (?:answer|选项)\\s*(?:is|为|是)?\\s*[:：]?\\s*\\(?([A-Da-d])；③ 最后一个非空行是光秃秃一个字母（容忍 B、(B)、B. 这些包装）。三级都抽不出 → unparsed。","排序题：先按分隔符切（-> → => > ＞ , ， 、 都认），剥掉 1. 这种序号和  引号括号，要求切出来的恰好是全部概念名的一个排列（集合相等且个数相同）才算数；否则退回\"某一行里每个概念名恰好出现一次 → 按首次出现位置排序\"的兜底。兜底有个防御：如果本题有概念名是另一个概念名的子串（算术 vs 算术运算），位置匹配会歧义，直接放弃兜底判 unparsed——宁可记未解析，也不能瞎判对错。","判分：pos[a] < pos[b] 逐条查图谱边。全满足 → correct；满足比例 → 部分分。","unparsed 一律判 0 分并计入 unparsed_rate，不静默丢弃（丢弃会让分母变小、分数虚高）。","分桶（报告里的分组列）：task（mcq/order）、field（数学/计算机）、variant（mcq_with_reverse_trap / mcq_sibling_only / order_n4..n6）。","score_10 做了随机基线校正，随机作答得 0 分而不是 2.8 分：","两类题各占一半：选择题量大但单题信息少（4 选 1），排序题量小但每题是多约束联合判定，信息密度高，等权是折中。"]},{"heading":"在本仓库怎么用","bullets":["纯文本，不需要视觉模型；不花裁判的钱——只有答题成本，判分是本地正则。","--limit N 取的是交错后的前 N 题（load_items 按 2 选择 : 1 排序 交错），所以任何前缀都同时覆盖两种题型，冒烟不会只测到一半。","题单是 300 题的全集，--item-list 只是完整性校验（少一题就报错，防止跨模型题目不一致）。","提交进 git 的是 data/mooccube/item_list_v1.txt（300 个 item_id）+ item_list_v1_manifest.json（含出题参数、分层计数、随机基线、生成题目文件的 sha256）。","题目本体 sources/datasets/mooccube/items_v1.jsonl 不提交（gitignored）。它由 builder 确定性重建（固定 seed 20260713 + 全程排序迭代），adapter 每次加载都拿 sha256 和 manifest 对，对不上直接报错退出——别人重新生成一份不一样的题却拿旧分数比较，这条能挡住。","item_id 是内容哈希（mooccube-mcq-<sha1(target+选项)[:10]>），不是序号：出题参数一改，id 就变，不会出现\"同一个 id 指向不同题目\"的静默错配。","改完必须重跑弱基线自查（下一节），并且换一个 item_list_v2 的名字——不要原地覆盖 v1，已经跑过分的模型没法回溯。"]},{"heading":"天花板自查（必读）","bullets":["本仓库最大的方法论问题是分数拉不开（19 个格子因此作废），所以出题时就按\"难\"设计，并做了三轮自查：","1. 弱基线实算（items_v1.jsonl 全 300 题）：","最后两行是关键：部分分的随机地板高达 0.50（每条约束在随机排列下有一半概率被满足），所以 score_10 的排序分量用的是严格全对率（地板 0.03），部分分只作为 extra_metrics 里的诊断量，绝不进 headline。这一条如果搞错，排序题会白送 5 分。","2. 第一版太简单，改了：初版干扰项没限制领域，结果出现\"学『乘法』之前要先掌握『即时通信』\"这种题——跨领域干扰项让模型不用懂先修关系、光靠常识就能排除。改法：所有选项（含正确项）强制同领域，跨领域的边（905 条里 35 条）对应的题直接丢掉；并优先采 Y 的后继概念做干扰项（方向反转陷阱）。定义字段也修了：没有\"定义：\"子句的概念不再吐出乱码学科路径（那会泄漏领域线索）。","3. 真实模型离天花板很远。2026-07-13 smoke（deepseek-v4-pro，网关，12 题：9 选择 + 3 排序，unparsed_rate = 0.0）：","选择题 0.78 有头部空间，排序题明显是硬骨头（部分分 0.69 只比随机的 0.50 高一点）。没有任何天花板迹象。样本量小（尤其排序题 n=3），只证明链路通、难度对，不作能力结论。","反向风险是排序题过难（有可能全模型贴地板，同样拉不开分）。全量跑完后如果排序题严格全对率普遍 <0.05，就把 --size 里的排序题降到 4-5 个概念、或改用约束满足率做 headline 分量（但那样必须减去 0.503 的随机地板）。若相反、选择题普遍 >0.90，则只保留带方向反转陷阱的 102 道题。"]},{"heading":"局限与注意","bullets":["这只是半个 P19，别吹成完整的 P19。先修关系是学科知识结构层面的顺序——\"概念 A 依赖概念 B\"，是课程设计者视角的静态图。P19 的另一半——根据某个学生当前的掌握状态、错题、进度，为他定制下一步学什么——本基准完全没测，仍然是缺口（缺口推荐文档里的 P19b 下一步练习推荐 / P19c 整体规划生成）。报告里必须写\"P19 部分覆盖\"。","任务协议是本仓库自建的。MOOCCube 原文只发图谱，没有这个任务、没有官方基线、没有可比的公开成绩。所以 benchmark weight 压到 0.70（低于 K12Vista 0.80），且不能宣称与任何公开榜单可比。","图谱不完备。905 条边远不是数学+计算机全部的先修关系。干扰项\"在图谱闭包里与 Y 无通路\"不等于\"现实中真的不是 Y 的先修\"——这是不可消除的标签噪声。缓解手段：优先用 Y 的后继概念做干扰项，那是图谱内可证的非先修（有环的节点已被闭包排除），不依赖\"图谱完备\"这个假设。102/200 道题带这种干扰项。","金标本身有一部分是可争议的。smoke 里 deepseek 把「加法」排在「基本运算」之前，图谱说的是「基本运算 先于 加法」——判错。这类粒度/顺序的争议在专家标注里客观存在，排序题要求满足全部约束，所以一条有争议的边就能让整题挂掉。这是\"严格全对率\"口径的已知代价（也是为什么同时报约束满足率）。要更干净的结论，需要人工复核一遍被判错的边——尚未做。","领域只有数学和计算机，没有文科理科其它学科；概念粒度也偏细（\"左值\"\"缓冲\"这种）。结论不要外推到全学科。","概念定义直接取自图谱 explanation 的\"定义：\"子句；约一半概念没有这个子句，只显示名字。"]}],"file":"mooccube.md","missing":false}},{"id":"mrbench_judge","name":"MRBench Judge","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"多维 tutor 回复评判（被测模型自己当裁判，与人类标注算一致率/macro-F1/kappa）。R23：仅在 P10「主观题评价能力」计分——该 P 的被测构念就是判卷能力，与已计分的 sas_bench CCS 同属『按维度分解评判 + 与人类标注算一致性』这类操作（R19 定的 facet 划分轴是评分操作类型，不是评分对象）。置信 0.0→0.75：人类标注锚定的一致率统计，与 CCS 0.95、asap_2 0.8 同族，因裁判协议自身噪声折价一档。构念错位的原 P09c/P17a 挂载已删除。","profile":{"title":"MRBench · Judge 判卷一致性","one_liner":"MRBench 两个子评测之一——让模型当评卷人按八个维度给 tutor 回复贴标签，与人类标注比一致性。","sections":[{"heading":"这是哪个子评测","bullets":["家族 MRBench（NAACL 2025，MBZUAI）是 AI tutor 回复质量的八维人工标注基准，本仓库据此实现了两个方向相反的子评测。","本页是判卷侧：模型当裁判。另一个是生成侧：模型当 tutor 写回复。","两者共用同一批人类标注，但被测能力完全不同，所以分开计分；本页只挂到主观题评价能力上。"]},{"heading":"出处与背景","bullets":["Maurya、Kochmar 等（MBZUAI），NAACL 2025；仓库 kaushal0494/UnifyingAITutorEvaluation。","数据为 200 段真实学生数学错误对话，每段配至多 9 个 tutor 模型的回复，八维人工标注。英文。"]},{"heading":"任务与判分","bullets":["模型逐维贴标签，与人类金标算一致性，取 macro-F1 而非裸准确率——标签类别高度不平衡。","这是本体系里唯二直接测\"判卷能力\"的证据之一，另一个来自 BEA 2025。"]},{"heading":"局限与注意","bullets":["这一类证据曾被整体排除在计分之外，后来因为构念对口而重新纳入：判卷能力这项能力，被测的就是判卷本身。","只在主观题评价能力上计分，不进任何其他能力。","量尺问题：macro-F1（约 4.1–5.6）与同一层里的评分一致性指标不在同一度量尺度上，两者进同一个加权平均隐含了可比性假设，待单独处理。","200 段对话的样本量偏小，因裁判协议噪声，置信度做了一档折价。"]}],"file":"mrbench_judge.md","missing":false}},{"id":"mrbench_tutor","name":"MRBench Tutor","confidence":0.85,"metric_family":"share_0_to_1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"tutor 回复生成、固定裁判 8 维标注。R2 裁决：复合 pass rate 换单维度分（Mistake_Identification/Providing_Guidance/Actionability 用 Yes 占比）。R19：Tutor_Tone 一份标注取两个统计量——P20 边界用 1−Offensive，P18 语气支持用 Encouraging 占比（替换原 Encouraging+0.5×Neutral 单格，去重）。仅 3 个模型面（2026-07-16 决定不补跑）。","profile":{"title":"MRBench · Tutor 回复生成","one_liner":"MRBench 两个子评测之一——让模型给犯错的学生写下一句辅导回复，由固定裁判按八个教学维度标注。","sections":[{"heading":"这是哪个子评测","bullets":["家族 MRBench（NAACL 2025，MBZUAI）是 AI tutor 回复质量的八维人工标注基准，本仓库据此实现了两个方向相反的子评测。","本页是生成侧：模型当 tutor，被别人评。另一个是判卷侧：模型当裁判贴标签。","八个维度里，本体系刻意取单维度分而不是复合通过率——一个通过率数字会把识别错误、提供引导、可执行性三种不同能力糅在一起。"]},{"heading":"出处与背景","bullets":["Maurya、Kochmar 等（MBZUAI），NAACL 2025；仓库 kaushal0494/UnifyingAITutorEvaluation。","动机：把 tutor 回复质量的评价维度统一成一套分类学，后来直接衍生出 BEA 2025 共享任务。","数据为 200 段真实学生数学错误对话（源自 MathDial 与 Bridge），英文。"]},{"heading":"任务与判分","bullets":["八个原生维度：识别错误、定位错误、是否泄露答案、提供引导、可执行性、连贯性、语气（鼓励/中性/冒犯）、拟人度。","模型生成下一句 tutor 回复，由固定裁判逐维标注。","本体系按单维度取分：识别错误挂错因归因、提供引导挂教学策略执行、可执行性挂适配性解释，语气的两个统计量分别挂动机支持与角色边界。"]},{"heading":"局限与注意","bullets":["只有 200 段对话，样本量小，维度级估计的噪声较大；实测配对模型数也偏少。","结果依赖固定裁判的标注质量，不是人工标注。","语气维度里的非冒犯占比目前所有模型都是满分。它保留作哨兵用——当前面板恰好都不冒犯，不代表指标永久饱和，但权重已降到不压缩其他证据拉开的真实差距。"]}],"file":"mrbench_tutor.md","missing":false}},{"id":"olympiadbench","name":"OlympiadBench","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"高难学科推理和多模态竞赛题，答题能力未完全饱和；仍作为门槛/诊断而非教育核心。R22：0.55→0.7——解题簇唯一未饱和、真正承担区分度的证据不应压最低档；污染风险低于 mmlu。","profile":{"title":"OlympiadBench","one_liner":"奥林匹克竞赛级数学/物理开放题（非选择题），双语带图，是当前门槛类里最难、离饱和最远的一个。","sections":[{"heading":"出处与背景","bullets":["OpenBMB / 清华，2024（ACL 2024）；https://github.com/OpenBMB/OlympiadBench","动机：常规考试题对强模型饱和，用奥赛题（IMO/IPhO 级别）保持区分度，且带完整推理过程标注。"]},{"heading":"数据","bullets":["全集 8,476 题，数学+物理，中英双语，部分带图（多模态）。","本仓库只用 OE（开放式作答）配置，TP（证明题）配置跳过（无法自动判分）；图片抽取到 olympiadbench/images/。","获取：fetch_eval_datasets.py --benchmark olympiadbench（HF Hothan/OlympiadBench）。"]},{"heading":"任务与判分","bullets":["开放式作答，答案是数值/表达式/区间。","判分移植官方 repo：make_prompt 构造提示，sympy 符号等价的 AutoScoringJudge 判对错——需要 antlr4-python3-runtime==4.11（与 hydra-core 的 4.9 依赖冲突，必要时独立 venv）。"]},{"heading":"在本仓库怎么用","bullets":["adapter scripts/eval/benchmarks/olympiadbench.py；多模态题需要视觉模型。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=2，均分 7.26，标准差 0.14——没天花板问题，但共同模型太少，什么都推不出来。补模型时优先补它（门槛类里唯一有区分度潜力的）。","竞赛真题，污染风险存在但比普通考试题低（解题过程难背）。"]}],"file":"olympiadbench.md","missing":false}},{"id":"p07_selfcheck","name":"P07 两轮自查","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"两轮自查协议（先答题、再无提示复查），P07 的首个直接测量（2026-07-12 缺口填补）；headline=0.5×改对率+0.5×(1−改错率)，与第一轮正确率解耦。复查时对自身答案的把握与校准相通，P08 占 0.15。","profile":{"title":"P07 两轮自查（p07_selfcheck）","one_liner":"先答题、再在同一对话里无提示地要求\"重新检查你的解答\"，规则判分分离\"错改对\"（真自查）与\"对改错\"（有害的自我怀疑）——P07（自我校验与修正）的第一个直接测量。","sections":[{"heading":"出处与背景","bullets":["本仓库自建（2026-07-12，缺口推荐文档优先级第 2 项）；协议是学术界 intrinsic self-correction 评测的标准做法（无外部反馈、不暗示对错）。","动机：构念核对（R9）发现 P07 此前全是搭车格子——分数看着有，实际没有任何测验直接考\"自查\"这个行为。"]},{"heading":"数据","bullets":["零新增标注：复用 P08 的 delegate（ceval 0-shot / mmlu_pro / agieval / mtb_problem_solving）和同一份难度分层 item_list（data/p08_calibration/item_list_v1.txt，550 题），P07/P08 同题可比。"]},{"heading":"任务与判分","bullets":["第一轮：delegate 原生出题（prediction 阶段）；第二轮：extract 阶段把原对话 + 模型自己的第一轮回答 + 固定复查指令再发给被测模型本身（harness 会把被测模型名写进 adapter.model_under_test；传给 extract 的 client 是抽取模型，不是被测模型）。","两轮答案都用 delegate 自己的抽取和判分。headline score_10 = 10×[0.5×改对率 + 0.5×(1−改错率)]，两项都以第一轮状态为条件，构造上与第一轮正确率解耦。extra_metrics 含 r1/r2 accuracy、net_gain、change_rate、逐来源分解。"]},{"heading":"为什么不能复用以前跑过的预测","bullets":["以前各 benchmark 的全量预测只有\"第一轮答案\"，而 P07 测的是第二轮行为——模型看到自己的第一轮回答后改不改、改对还是改错。第二轮必须以第一轮的原始回复作为对话历史现场再调一次被测模型，这个交互在旧预测里不存在，也没法离线补造（换措辞、换上下文都算换协议）。所以旧全量分数只能省下\"第一轮\"这一半成本吗？也不能：为了保证两轮在同一套 prompt/参数/对话格式下发生，第一轮也要在本协议内重跑，否则改答率会混入格式差异。"]},{"heading":"局限与注意","bullets":["每题两次被测模型调用（round 1 + round 2），成本约是普通跑分的 2 倍。","\"复查\"指令措辞固定（中/英各一版）；换措辞就是换协议，对比时注意。","已知现象（文献一致）：多数模型 intrinsic self-correction 改对率低、部分模型改错率不低——低分是真实测量结果，不是 bug。"]}],"file":"p07_selfcheck.md","missing":false}},{"id":"p08_abstention","name":"P08 能力性弃答","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"公开弃答数据集（UMWP/TreeCut）测对不可答题能否说“不会”；识别并按格式声明带少量指令遵循成分故 P01 占 0.15。与 p08_calibration 共同构成 P08 两半证据。","profile":{"title":"P08 自建 · 能力性弃答","one_liner":"自建两件套之一——给模型一批根本答不了的题，看它会不会直接说\"这题信息不全，答不了\"。","sections":[{"heading":"这是哪个子评测","bullets":["家族是为置信度校准与弃答这项能力专门设计的两个自建测验，本页测弃答，另一页测置信度校准。","弃答是行为决策问题，校准是概率质量问题。两者相关但可分离，因此分开计分。","在教育产品里，这一项对应的是最直接的信任问题：模型宁可编一个答案，还是承认不知道。"]},{"heading":"出处与背景","bullets":["本仓库自建。题目取自公开的不可答数学应用题集——把原题里的必要条件删掉，使其在逻辑上无解。","默认跑 500 题的分层子集，按五类不可答类型均衡抽取，前缀稳定可复现。"]},{"heading":"任务与判分","bullets":["模型需要识别出题目不可答并明确声明，规则判分，无裁判参与。","取平衡口径：只奖励拒答会训练出\"什么都不答\"的退化策略，因此同时惩罚该答而不答。"]},{"heading":"局限与注意","bullets":["分数偏高（约 8.6–9.1）。当前模型在\"明显不可答\"的情形下普遍愿意说不会。","但这批题的不可答性是可判定的、干净的。真实课堂里的灰区问题——学生问一个超纲但相邻的知识点——完全没有覆盖。把这个高分外推成\"模型不会瞎编\"是危险的。","自建协议、无公开基线，置信度做了折价。","曾经把它当作指令与约束遵循的辅助证据（弃答需要遵守输出约束），后来摘除了：分数里分不出\"守住了约束\"和\"本来就想弃答\"。"]}],"file":"p08_abstention.md","missing":false}},{"id":"p08_calibration","name":"P08 置信度校准","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"复用 exact-match benchmark + verbalized confidence，测“自信地教错”（CWR）与“知道自己不知道”（AUROC）；自报置信度带少量自检成分故 P07 占 0.20。","profile":{"title":"P08 自建 · 置信度校准","one_liner":"自建两件套之一——让模型答题时同时报出自己的把握有多大，再看这个把握和实际对错是不是对得上。","sections":[{"heading":"这是哪个子评测","bullets":["家族是为置信度校准与弃答这项能力专门设计的两个自建测验，本页测校准，另一页测能力性弃答。","两者按设计各测一半：校准是概率质量问题（自信程度与正确率是否一致），弃答是行为决策问题（不会时会不会主动说不会）。","分开计分是因为两者可分离——模型完全可能内部把握很准，但被问到就是硬答不肯放弃。"]},{"heading":"出处与背景","bullets":["本仓库自建。这项能力此前完全没有覆盖，方案刻意走零人工标注路线：复用已有精确匹配评测的对错信号。","题目为 550 道，从多个学科考试与解题评测里分层抽样，与两轮自查测验共用同一份题单。"]},{"heading":"任务与判分","bullets":["模型作答时附带自报置信度，规则判对错后计算自信错误率与区分度指标（AUROC）。","核心分数由\"少犯自信的错\"和\"把握排序准\"两半合成，全程规则判分，无裁判。"]},{"heading":"局限与注意","bullets":["自报置信度是模型嘴上说的把握，与内部概率可能脱节。这本身是测量的一部分——用户看到的就是嘴上这句——但解释时别当成真实概率。","自建协议、无公开基线可对照，置信度做了折价，横向比较可用，绝对分请谨慎引用。","题源复用了门槛类评测，分数与总体答题水平天然相关。分析时需要用偏相关控制总分，否则会把\"知识强\"读成\"校准好\"。","分数区间约 5.6–6.8，偏低。同时作为自我校验能力的辅助证据计入。"]}],"file":"p08_calibration.md","missing":false}},{"id":"pedagogy_benchmark","name":"Pedagogy Benchmark","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"otherbenchmark","rationale":"教学法知识选择题，既有教育知识，也有教学策略选择；R8 裁决后不再挂 P06。","profile":{"title":"Pedagogy Benchmark","one_liner":"用教师资格/职业考试真题测模型的教学法专业知识——不是学科知识，而是\"怎么教\"的知识。","sections":[{"heading":"出处与背景","bullets":["AI for Education（aiforeducation.io），2025（论文 *Benchmarking the Pedagogical Knowledge of Large Language Models*）；https://huggingface.co/datasets/AI-for-Education/pedagogy-benchmark","动机：模型的学科能力评得很多，教育学专业知识（学习理论、课堂管理、评估方法、特殊教育）几乎没人评。官方 leaderboard 覆盖 97 个模型。"]},{"heading":"数据","bullets":["两个子集：CDPK（跨领域教学法知识，约 900 题选择题）和 SEND（特殊教育需求，约 300 题）。题目来自教师资格认证考试。","获取状态：HF gated（要申请），本地没有原始数据——这是它和其他教育核心 benchmark 的关键区别。"]},{"heading":"任务与判分","bullets":["选择题，accuracy，规则判分。","原生维度：CDPK 按教学主题分类；SEND 单列。"]},{"heading":"在本仓库怎么用","bullets":["无 adapter，分数来自同事跑分的外部报告（otherbenchmark/，0701 聚合卡片 + ASAP+Peda.png）。仓库里它是 source_scope: otherbenchmark。","映射里有三行：CDPK / SEND / 0701 聚合卡片（后者只在没有细分分数时用，去重逻辑保证不重复计分）。"]},{"heading":"局限与注意","bullets <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const app = document.getElementById('app');

/* ---------- indexes ---------- */
const abilityBy = {}; D.abilities.forEach(a => abilityBy[a.p_code] = a);

const modelBy = {}; D.models.forEach(m => modelBy[m.key] = m);
const groupLabel = {}; D.groups.forEach(g => groupLabel[g.id] = g.label);
const coveredP = D.abilities.map(a => a.p_code).filter(p => !D.meta.uncovered_p.includes(p));
// The full universe of atomic abilities (20). coveredP is the measurable subset;
// allP always spans every P so column/axis counts read as the true total, with
// the two benchmark-less abilities (P09/P20) shown as 未测 rather than dropped.
const allP = D.abilities.map(a => a.p_code);
const isUncovered = p => D.meta.uncovered_p.includes(p);

/* --- R26 缺测口径，页面内复算 ------------------------------------------
   R22 的「缺格取该格已测模型最低分顶替」已废除（用户裁决 2026-08-04）。
   缺格现在由聚合脚本分成两类，页面只如实呈现，不再自己造替代行：
     · 能力不具备（evidence 行 zero=true，分数 0）：整套题都得有某项能力
       （目前只有视觉）才能作答，模型没有——真实能力差距，计分，并按常规
       权重规则传导到这一格挂载的每一个 P。
     · 未测过（在 D.untested 里，不进 evidence）：没跑过，不计分也不进分母。
   下面只把 evidence 行按 facet 加权聚合，结果与 09_atomic_p_scores.jsonl
   逐行一致（见 console 自检输出）。                                      */
const MEASURED = D.evidence.filter(r => !r.zero);
const untestedBy = {};
D.untested.forEach(r => (untestedBy[r.m + '|' + r.p] ||= []).push(r));

function buildScores(){
  const rows = D.evidence.slice();
  const acc = {};
  rows.forEach(r => {
    const s = (acc[r.m + '|' + r.p] ||= {facets: {}, n: 0, zero: 0, zerow: 0, w: 0, b: new Set()});
    const f = (s.facets[r.f] ||= {ws: 0, w: 0});
    f.ws += r.s * r.eff; f.w += r.eff;
    s.n++; s.w += r.eff; s.b.add(r.b);
    if (r.zero){ s.zero++; s.zerow += r.eff; }
  });
  const scores = {};
  Object.keys(acc).forEach(k => {
    const s = acc[k], parts = k.split('|');
    const facets = {}, means = [];
    Object.keys(s.facets).forEach(id => {
      const f = s.facets[id];
      if (f.w){ facets[id] = f.ws / f.w; means.push(f.ws / f.w); }
    });
    if (!means.length) return;
    scores[k] = {
      m: parts[0], p: parts[1], s: means.reduce((a, b) => a + b, 0) / means.length,
      facets: facets, n: s.n, zero: s.zero, zerow: s.w ? s.zerow / s.w : 0,
      unt: (untestedBy[k] || []).length,
      nf: means.length, b: [...s.b].sort()
    };
  });
  const groups = {};
  Object.keys(scores).forEach(k => {
    const r = scores[k], g = abilityBy[r.p].group;
    const slot = (groups[r.m + '|' + g] ||= {sum: 0, n: 0});
    slot.sum += r.s; slot.n++;
  });
  Object.keys(groups).forEach(k => groups[k] = {s: groups[k].sum / groups[k].n, np: groups[k].n});
  return {scores: scores, groups: groups, evidence: rows};
}

let scoreOf, groupScoreOf, evByModelP, evByBench;
function applyMode(){
  const built = buildScores();
  scoreOf = built.scores;
  groupScoreOf = built.groups;
  evByModelP = {}; evByBench = {};
  built.evidence.forEach(r => {
    (evByModelP[r.m + '|' + r.p] ||= []).push(r);
    (evByBench[r.b] ||= []).push(r);
  });
}
applyMode();

// Self-check: the rebuild must reproduce the committed artifact exactly.
(() => {
  let worst = 0, n = 0;
  D.scores.forEach(r => {
    const mine = scoreOf[r.m + '|' + r.p];
    if (mine){ worst = Math.max(worst, Math.abs(mine.s - r.s)); n++; }
  });
  // 已发布的 score_10 本身是 4 位小数，所以 5e-5 是这个比对的理论下限，
  // 阈值只能卡在它之上；真正的逻辑错误会差好几个数量级。
  const msg = `R26 复算自检：${n}/${D.scores.length} 行比对，最大偏差 ${worst.toExponential(1)}`;
  (worst < 2e-4 && n === D.scores.length ? console.log : console.error)(msg);
})();

})));

function heatClass(v){
  if (v === null || v === undefined) return '';
  return 'h' + Math.max(0, Math.min(9, Math.floor(v)));
}
function markers(row){
  if (!row) return '';
  let out = '';
  if (row.nf < (abilityBy[row.p]?.facets.length || 0)) out += '<span class="mark" title="并非所有 facet 都有证据">◐</span>';
  if (row.zero > 0) out += `<span class="mark" title="含 ${row.zero} 个「能力不具备记 0 分」的格（占有效权重 ${(row.zerow*100).toFixed(0)}%）">✕</span>`;
  if (row.unt > 0) out += `<span class="mark" title="另有 ${row.unt} 个格未测过，未计入分母">·</span>`;
  return out;
}
function go(hash){ location.hash = hash; }
function pLink(p){ return `<span class="link" onclick="go('#/p/${p}')">${p} ${esc(abilityBy[p]?.p_name || '')}</span>`; }
function bLink(b){ return `<span class="link" onclick="go('#/bench/${encodeURIComponent(b)}')">${esc(benchBy[b]?.name || b)}</span>`; }
function mLink(m){ return `<span class="link" onclick="go('#/model/${encodeURIComponent(m)}')">${esc(mName(m))}</span>`; }
// 实测覆盖：只数真跑过的格，「能力不具备记 0 分」的格不算跑过。
const measuredP = {};
MEASURED.forEach(r => (measuredP[r.m] ||= new Set()).add(r.p));

function covBadge(m){
  const mm = modelBy[m];
  const real = (measuredP[m] || new Set()).size;
  const now = coveredP.filter(p => scoreOf[m + '|' + p]).length;
  if (now > real){
    // 只由「能力不具备记 0 分」撑起来的 P，别当成跑过。
    return `<span class="badge warn" title="实测 ${real} 项，另有 ${now - real} 项只有「能力不具备记 0 分」的格">实测 ${real}/${coveredP.length}，另 ${now - real} 项仅 0 分格</span>`;
  }
  return real >= coveredP.length
    ? `<span class="badge full">全覆盖 ${real}/${coveredP.length}</span>`
    : `<span class="badge warn">${real}/${coveredP.length} 项有证据</span>`;
}

/* ---------- charts ---------- */
function radar(series){
  const R = 168, cx = 250, cy = 210, N = allP.length;
  const ang = i => (i / N) * 2 * Math.PI - Math.PI / 2;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  let g = '';
  for (const lvl of [2, 4, 6, 8, 10]){
    const pts = allP.map((_, i) => pt(i, R * lvl / 10).map(n => n.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  }
  g += `<text x="${cx+4}" y="${cy-R+2}" font-size="9" fill="var(--muted)">10</text>`;
  allP.forEach((p, i) => {
    const off = isUncovered(p);
    const [x, y] = pt(i, R);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const [lx, ly] = pt(i, R + 26);
    const anchor = Math.abs(lx - cx) < 12 ? 'middle' : (lx > cx ? 'start' : 'end');
    g += `<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="${off ? 'var(--muted)' : 'var(--ink-2)'}"
            style="cursor:pointer${off ? ';opacity:.65' : ''}" onclick="go('#/p/${p}')"><title>${esc(abilityBy[p].p_name)}${off ? '（暂无 benchmark，未测）' : ''}</title>${p}</text>`;
  });
  series.forEach((s, si) => {
    const col = `var(${SERIES[si % SERIES.length]})`;
    // Missing axes break the ring: draw only contiguous measured runs, never
    // interpolate a model's uncovered ability as if it scored there.
    const vals = allP.map(p => { const r = scoreOf[s.key + '|' + p]; return r ? r.s : null; });
    let run = [];
    const flush = () => {
      if (run.length > 1){
        g += `<polyline points="${run.map(a => a.join(',')).join(' ')}" fill="none"
                stroke="${col}" stroke-width="2" stroke-linejoin="round" opacity=".92"/>`;
      }
      run = [];
    };
    if (vals.every(v => v !== null)){
      const pts = vals.map((v, i) => pt(i, R * v / 10).map(n => n.toFixed(1)));
      // Fill only a lone series - stacked translucent fills mix into a muddy
      // third hue and stop reading as either model.
      const fill = series.length === 1 ? `fill="${col}" fill-opacity=".13"` : 'fill="none"';
      g += `<polygon points="${pts.map(a => a.join(',')).join(' ')}" ${fill}
              stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    } else {
      vals.forEach((v, i) => { if (v === null) flush(); else run.push(pt(i, R * v / 10).map(n => n.toFixed(1))); });
      flush();
    }
    vals.forEach((v, i) => {
      if (v === null) return;
      const [x, y] = pt(i, R * v / 10);
      // 分数过半来自「能力不具备记 0 分」的点画空心：那是能力缺口砸出来的低分，
      // 不是在这套题上量出来的水平，一眼扫过去不该跟实测点长得一样。
      const row = scoreOf[s.key + '|' + allP[i]];
      const mostlyZero = row && row.zerow >= 0.5;
      const note = mostlyZero ? `（其中 ${(row.zerow * 100).toFixed(0)}% 的有效权重来自「能力不具备记 0 分」的格）` : '';
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"
              fill="${mostlyZero ? 'var(--surface)' : col}" stroke="${col}" stroke-width="2"
              ><title>${esc(mName(s.key))} · ${allP[i]} ${esc(abilityBy[allP[i]].p_name)}: ${fx(v)}${note}</title></circle>`;
    });
  });
  return `<svg viewBox="0 0 500 440" role="img" aria-label="原子能力雷达图">${g}</svg>`;
}

function bars(rows, maxV = 10){
  return rows.map(r => `
    <tr>
      <td>${mLink(r.key)}
        ${r.facetCov && r.facetCov.have < r.facetCov.total
          ? `<span class="badge warn" title="这项能力有 ${r.facetCov.total} 个 facet，该模型只测了 ${r.facetCov.have} 个，分数不可与全测模型直接比">仅测 ${r.facetCov.have}/${r.facetCov.total} facet</span>`
          : ''}
        ${r.zeroShare > 0
          ? `<span class="badge warn" title="这一分数里有 ${(r.zeroShare*100).toFixed(0)}% 的有效权重来自「能力不具备记 0 分」的格">能力缺口 ${(r.zeroShare*100).toFixed(0)}%</span>`
          : ''}
        ${r.full ? '' : '<span class="badge">全库 ' + modelBy[r.key].p_count + '/' + coveredP.length + '</span>'}</td>
      <td style="width:52%"><div class="track" title="${esc(r.tip || '')}">
        <div class="bar${r.full ? '' : ' hollow'}" style="width:${(r.value / maxV * 100).toFixed(1)}%"></div></div></td>
      <td class="num">${fx(r.value)}${r.mark || ''}</td>
    </tr>`).join('');
}

/* ---------- view: overview ---------- */
let ovSort = {key: '_avg', dir: -1};
function viewOverview(){
  const rowsFor = list => list.map(m => {
    const cells = allP.map(p => {
      if (isUncovered(p))
        return `<td class="num cell untestedcol"><span class="mark" title="${esc(abilityBy[p].p_name)}：暂无 benchmark，全部模型均未测">未测</span></td>`;
      const r = scoreOf[m.key + '|' + p];
      return r
        ? `<td class="num cell"><span class="heat ${heatClass(r.s)}"
             title="${esc(m.display)} · ${p} ${esc(abilityBy[p].p_name)}: ${fx(r.s)}（${r.n} 条证据）">${fx(r.s, 1)}</span>${markers(r)}</td>`
        : `<td class="num cell"><span class="untested" title="该模型这项能力的取分格一个都没跑过；不给分，也不折算成 0">未测过</span></td>`;
    }).join('');
    const gcells = D.groups.map(g => {
      const r = groupScoreOf[m.key + '|' + g.id];
      const last = g.id === D.groups[D.groups.length - 1].id;
      return `<td class="num${last ? ' gsep' : ''}">${r ? fx(r.s, 1) : '<span class="mark">·</span>'}</td>`;
    }).join('');
    return `<tr><td>${mLink(m.key)}<br>${covBadge(m.key)}</td>${gcells}${cells}</tr>`;
  }).join('');

  const sorted = list => {
    const k = ovSort.key;
    return [...list].sort((a, b) => {
      const va = k === '_avg' ? a.p_count : (scoreOf[a.key + '|' + k]?.s ?? -1);
      const vb = k === '_avg' ? b.p_count : (scoreOf[b.key + '|' + k]?.s ?? -1);
      return ovSort.dir === -1 ? vb - va : va - vb;
    });
  };
  const full = sorted(D.models.filter(m => m.full_panel));
  const partial = sorted(D.models.filter(m => !m.full_panel));

  app.innerHTML = `
    <h2>总览</h2>
    <p class="sub">模型 × 原子能力得分矩阵（0–10）。列头可排序；点任意模型名或能力编号进入详情。
      <span class="mark">◐</span> 该能力并非所有 facet 都有证据，<span class="mark">✕</span> 含「能力不具备记 0 分」的格，<span class="mark">·</span> 另有格子未测过。<b>未测过</b>的能力不给分，也不折算成 0。</p>
    <div class="stats">
      <div class="stat"><b>${D.meta.n_models}</b><span>已测模型</span></div>
      <div class="stat"><b>${D.meta.full_panel_size}</b><span>全覆盖模型</span></div>
      <div class="stat"><b>${D.meta.n_abilities_covered}/${D.meta.n_abilities_total}</b><span>有数据的原子能力</span></div>
      <div class="stat"><b>${D.meta.n_benchmarks}</b><span>benchmark 取分维度来源</span></div>
      <div class="stat"><b>${D.meta.n_evidence}</b><span>条证据行</span></div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th class="sortable" data-k="_avg">模型</th>
          ${D.groups.map((g, i) => `<th class="num${i === D.groups.length - 1 ? ' gsep' : ''}" title="${esc(g.label)}">${g.id}</th>`).join('')}
          ${allP.map(p => `<th class="num${isUncovered(p) ? ' untestedcol' : ' sortable'}" ${isUncovered(p) ? '' : `data-k="${p}"`} title="${esc(abilityBy[p].p_name)}${isUncovered(p) ? '（暂无 benchmark，未测）' : ''}">${p}</th>`).join('')}
        </tr></thead>
        <tbody>
          <tr class="rowsep"><td colspan="${1 + D.groups.length + allP.length}">
            发布面板 · ${D.panel.length} 个模型 · 共 ${allP.length} 项原子能力，其中 ${coveredP.length} 项有分；${D.meta.uncovered_p.join('、')} 暂无 benchmark 记为「未测」。R26 起缺格不再拿别的模型顶替：能力不具备的格记 0 分照常计分，纯未测的格不计分也不进分母（全库 ${D.meta.n_zero_cells} 个 0 分格、${D.meta.n_untested_cells} 个未测格）</td></tr>
          ${rowsFor(full)}
          <tr class="rowsep"><td colspan="${1 + D.groups.length + allP.length}">
            部分覆盖 · 覆盖面差异很大，跨行比较前务必看徽章上的覆盖率</td></tr>
          ${rowsFor(partial)}
        </tbody>
      </table>
    </div>
    <p class="foot">大类：${D.groups.map(g => `${g.id} ${esc(g.label)}`).join(' · ')}。
      ${D.meta.uncovered_p.length ? D.meta.uncovered_p.join('、') + ' 目前全库无数据，未列入矩阵。' : ''}</p>`;

  app.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    ovSort = {key: k, dir: ovSort.key === k ? -ovSort.dir : -1};
    viewOverview();
  });
}

/* ---------- view: model ---------- */
let picked = [];
let openP = null;
function viewModel(){
  if (!picked.length) picked = fullPanel.slice(0, 2);
  const chips = D.models.map(m => {
    const i = picked.indexOf(m.key);
    const dot = i >= 0 ? `<span class="dot" style="background:var(${SERIES[i]})"></span>` : '';
    // 数实测能力，不数有分能力——只靠「能力不具备记 0 分」撑起来的 P
    // 不该把这个数字撑大。
    const real = (measuredP[m.key] || new Set()).size;
    return `<button class="chip${real >= coveredP.length ? '' : ' partial'}" aria-pressed="${i >= 0}" data-m="${esc(m.key)}"
      title="实测 ${real}/${coveredP.length} 项原子能力">
      ${dot}${esc(m.display)} <span class="cnt">${real}/${coveredP.length}</span></button>`;
  }).join('');

  const series = picked.map(k => ({key: k}));
  const legend = picked.map((k, i) => {
    const real = (measuredP[k] || new Set()).size;
    const now = coveredP.filter(p => scoreOf[k + '|' + p]).length;
    const cov = now > real
      ? `实测 ${real}/${coveredP.length}，另 ${now - real} 项只有「能力不具备记 0 分」的格（空心点＝该项过半权重来自 0 分格）`
      : `${real}/${coveredP.length} 项有证据${real >= coveredP.length ? '' : '（未测过之处断线）'}`;
    return `<span><i style="background:var(${SERIES[i]})"></i>${esc(mName(k))}
      <span class="cov">${cov}</span></span>`;
  }).join('');

  const primary = picked[0];
  const list = allP.map(p => {
    const a = abilityBy[p];
    if (isUncovered(p)) return `<div class="prow" style="opacity:.5" onclick="go('#/p/${p}')">
      <div class="name"><b>${p} ${esc(a.p_name)}</b><span>${esc(a.definition)}</span></div>
      <div class="val"><span class="untested">未测</span></div></div>`;
    const r = scoreOf[primary + '|' + p];
    if (!r) return `<div class="prow" style="opacity:.45" onclick="go('#/p/${p}')">
      <div class="name"><b>${p} ${esc(a.p_name)}</b><span>${esc(a.definition)}</span></div>
      <div class="val">—</div></div>`;
    return `<div class="prow" data-p="${p}">
        <div class="name"><b>${p} ${esc(a.p_name)}</b><span>${esc(a.definition)}</span></div>
        <div class="track" style="width:110px;flex:none"><div class="bar" style="width:${(r.s * 10).toFixed(1)}%"></div></div>
        <div class="val">${fx(r.s)}</div><div style="width:26px">${markers(r)}</div>
      </div>${openP === p ? drill(primary, p) : ''}`;
  }).join('');

  app.innerHTML = `
    <h2>模型视图</h2>
    <p class="sub">雷达图共 ${allP.length} 个轴（全部原子能力）；${D.meta.uncovered_p.join('、')} 暂无 benchmark，任何模型都无数据，对应轴留空断线，不画成 0。最多叠加 3 个模型，部分覆盖的模型缺口处同样断线。点右侧任一能力展开它的证据构成。</p>
    <div class="chips" id="chips">${chips}</div>
    <div class="grid2">
      <div class="card radarwrap">
        <div class="radarwrap">${radar(series)}</div>
        <div class="legend">${legend}</div>
      </div>
      <div class="card">
        <h3>${esc(mName(primary))} 的能力得分 ${covBadge(primary)}</h3>
        <div>${list}</div>
        <p class="foot">数值为 0–10 归一分。表格视图见「总览」，同一批数据。</p>
      </div>
    </div>`;

  app.querySelectorAll('#chips .chip').forEach(c => c.onclick = () => {
    const k = c.dataset.m, i = picked.indexOf(k);
    if (i >= 0){ if (picked.length > 1) picked.splice(i, 1); }
    else { if (picked.length >= 3) picked.shift(); picked.push(k); }
    openP = null; viewModel();
  });
  app.querySelectorAll('.prow[data-p]').forEach(r => r.onclick = () => {
    openP = openP === r.dataset.p ? null : r.dataset.p; viewModel();
  });
}

function drill(model, p){
  const a = abilityBy[p];
  const rows = evByModelP[model + '|' + p] || [];
  const byFacet = {};
  rows.forEach(r => (byFacet[r.f] ||= []).push(r));
  const untRows = untestedBy[model + '|' + p] || [];
  const untByFacet = {};
  untRows.forEach(r => (untByFacet[r.f] ||= []).push(r));
  const sc = scoreOf[model + '|' + p];
  // 未测过的格不进分数，但一定要在同一张表里列出来——否则读者看到的
  // facet 分会显得比它实际的证据面更扎实。
  const untRowHtml = rs => rs.map(r => `<tr class="untestedrow">
            <td>${bLink(r.b)} · ${esc(r.sd)}
              <br><b class="untested">未测过</b>
              <span style="color:var(--muted);font-size:11.5px">——${esc(r.why || '该模型没跑过这一格')}；不计分，也不进分母</span></td>
            <td class="num">${fx(r.rel)}</td><td class="num">${fx(r.conf)}</td><td class="num">${fx(r.eff)}</td>
            <td class="num untested">未测过</td><td class="num untested">未测过</td>
          </tr>`).join('');
  const groups = a.facets.map(f => {
    const rs = byFacet[f.facet_id] || [];
    const us = untByFacet[f.facet_id] || [];
    if (!rs.length) return `<div class="facetgrp">
      <h4>${esc(f.facet_name)} <span class="badge">${us.length ? '全部未测过' : '无证据'}</span></h4>
      <p>${esc(f.facet_description)}</p>
      ${us.length ? `<table><thead><tr>
        <th>benchmark · 取分维度</th><th class="num">相关</th><th class="num">置信</th>
        <th class="num">有效</th><th class="num">原始值</th><th class="num">0–10 分</th>
      </tr></thead><tbody>${untRowHtml(us)}</tbody></table>` : ''}</div>`;
    return `<div class="facetgrp">
      <h4>${esc(f.facet_name)} <span class="badge">facet 分 ${fx(sc.facets[f.facet_id])}</span></h4>
      <p>${esc(f.facet_description)}</p>
      <table><thead><tr>
        <th>benchmark · 取分维度</th><th class="num">相关</th><th class="num">置信</th>
        <th class="num">有效</th><th class="num">原始值</th><th class="num">0–10 分</th>
      </tr></thead><tbody>
      ${rs.map(r => r.zero
        ? `<tr class="capzero">
            <td>${bLink(r.b)} · ${esc(r.sd)}
              <br><b class="untested">能力不具备，记 0 分</b>
              <span style="color:var(--muted);font-size:11.5px">——${esc(r.why || '')}。这是真实的能力差距，照常计分</span></td>
            <td class="num">${fx(r.rel)}</td><td class="num">${fx(r.conf)}</td><td class="num">${fx(r.eff)}</td>
            <td class="num untested">跑不了</td>
            <td class="num"><b>0.00</b><span class="mark" title="能力不具备记 0 分">✕</span></td>
          </tr>`
        : `<tr>
            <td>${bLink(r.b)} · ${esc(r.sd)}
              <br><span style="color:var(--muted);font-size:11.5px">${esc(benchBy[r.b]?.profile.one_liner || '')}</span></td>
            <td class="num">${fx(r.rel)}</td><td class="num">${fx(r.conf)}</td><td class="num">${fx(r.eff)}</td>
            <td class="num">${fx(r.raw, 3)}</td><td class="num"><b>${fx(r.s)}</b></td>
          </tr>`).join('')}
      ${untRowHtml(us)}
      </tbody></table></div>`;
  }).join('');
  const nZero = rows.filter(r => r.zero).length;
  return `<div class="drill">
    <div class="defn"><b>${p} ${esc(a.p_name)}</b>——${esc(a.definition)}
      ${a.single_source ? '<span class="badge warn">单源测量</span>' : ''}</div>
    ${nZero ? `<div class="notice" style="margin-bottom:12px">
      这项分数里有 <b>${nZero} 个格记 0 分</b>，占有效权重 <b>${(sc.zerow * 100).toFixed(0)}%</b>——
      ${esc(mName(model))} 缺这些格必需的能力（当前只有视觉一项），<b>整套题都作答不了</b>。
      这是真实的能力差距而非排期缺口，所以照常计分，并按常规权重规则传导到它挂载的每一个能力。</div>` : ''}
    ${untRows.length ? `<div class="notice" style="margin-bottom:12px">
      另有 <b>${untRows.length} 个格未测过</b>（下表中标黄的行）：${esc(mName(model))} 没跑过，
      <b>不计分也不进分母</b>——不拿别人的分数顶替，也不折算成 0。</div>` : ''}
    ${groups}
    <p class="foot">有效权重 = 相关度 × 置信度；facet 内按有效权重加权平均，P 分为各 facet 的等权平均。
      <span class="link" onclick="go('#/p/${p}')">查看这项能力的完整说明与全模型排名 →</span></p>
  </div>`;
}

/* ---------- view: ability ---------- */
let curP = null;
function viewAbility(){
  if (!curP || !abilityBy[curP]) curP = coveredP[0];
  const a = abilityBy[curP];
  const opts = D.abilities.map(x => `<option value="${x.p_code}" ${x.p_code === curP ? 'selected' : ''}>
    ${x.p_code} ${esc(x.p_name)}${D.meta.uncovered_p.includes(x.p_code) ? '（无数据）' : ''}</option>`).join('');

  // 边界口径 titles look like "P03 / P04" or "P05 与 P06/P17" - match the P code as a token.
  const bounds = D.boundaries.filter(b => new RegExp(curP + '\\b').test(b.title));

  const facetBlocks = a.facets.map(f => `
    <div class="facetgrp">
      <h4>${esc(f.facet_name)}${f.coverage_gap ? ' <span class="badge warn">覆盖缺口</span>' : ''}</h4>
      <p>${esc(f.facet_description)}</p>
      ${f.cells.length ? `<table><thead><tr>
          <th>benchmark · 取分维度</th><th class="num">相关</th><th class="num">置信</th><th class="num">有效</th>
          <th class="num">区分度 n / sd</th></tr></thead><tbody>
        ${f.cells.map(c => {
          const v = D.validity[c.benchmark_id + '||' + c.subdimension] || {};
          const conf = benchBy[c.benchmark_id]?.confidence;
          const flags = (v.flags || []).length ? `<span class="badge warn" title="${esc((v.flags||[]).join('、'))}">${esc((v.flags||[])[0])}</span>` : '';
          return `<tr>
            <td>${bLink(c.benchmark_id)} · ${esc(c.subdimension)}</td>
            <td class="num">${fx(c.weight)}</td><td class="num">${fx(conf)}</td>
            <td class="num">${conf ? fx(c.weight * conf) : '—'}</td>
            <td class="num">${v.n_models ?? '—'} / ${fx(v.sd)} ${flags}</td>
          </tr>`;
        }).join('')}
        </tbody></table>` : '<p class="empty">这个 facet 目前没有挂载任何 benchmark。</p>'}
      ${f.revision_rationale ? `<details><summary>裁决原文（P 编号为旧制，R20 前）</summary>
        <div class="body stale">${esc(f.revision_rationale)}</div></details>` : ''}
      ${f.cells.filter(c => c.revision_rationale).map(c => `<details>
        <summary>${esc(benchBy[c.benchmark_id]?.name || c.benchmark_id)} · ${esc(c.subdimension)} 的定权理由（P 编号为旧制）</summary>
        <div class="body stale">${esc(c.revision_rationale)}</div></details>`).join('')}
    </div>`).join('');

  const ranked = D.models
    .map(m => ({key: m.key, full: m.full_panel, row: scoreOf[m.key + '|' + curP]}))
    .filter(x => x.row)
    .sort((x, y) => y.row.s - x.row.s)
    .map(x => ({
      key: x.key, full: x.full, value: x.row.s, mark: markers(x.row),
      // Facet coverage *within this P* is the honest caveat on a ranking: a model
      // scored on one easy facet can outrank one measured on all three.
      facetCov: {have: x.row.nf, total: a.facets.length},
      zeroShare: x.row.zerow,
      tip: Object.entries(x.row.facets).map(([k, v]) => `${a.facets.find(f => f.facet_id === k)?.facet_name || k}: ${fx(v)}`).join(' · ')
    }));

  app.innerHTML = `
    <h2>原子能力视图</h2>
    <p class="sub">这项能力是什么、怎么测的、谁做得好。</p>
    <div class="toolbar"><select id="psel">${opts}</select>
      <span class="badge">${a.group} ${esc(groupLabel[a.group] || '')}</span>
      <span class="badge">${esc(a.model_type)}</span>
      ${a.single_source ? '<span class="badge warn">单源直接测量</span>' : ''}
      ${D.meta.uncovered_p.includes(curP) ? '<span class="badge warn">暂无任何模型数据</span>' : ''}
    </div>
    <div class="card">
      <h3>它是什么</h3>
      <p style="margin:0 0 12px"><b>${curP} ${esc(a.p_name)}</b>——${esc(a.definition)}</p>
      ${bounds.length ? `<h3 style="margin-top:14px">与相邻能力的边界</h3>
        <ul style="margin:0;padding-left:18px;color:var(--ink-2);font-size:12.5px">
        ${bounds.map(b => `<li><b>${esc(b.title)}</b>：${esc(b.text)}</li>`).join('')}</ul>` : ''}
      ${a.rationale ? `<details><summary>能力级裁决原文（P 编号为旧制，R20 前）</summary>
        <div class="body stale">${esc(a.rationale)}</div></details>` : ''}
    </div>
    <div class="card"><h3>怎么测的</h3>${facetBlocks}
      <p class="foot">相关度五档由 R25 规则推导（1.0 完全一致 / 0.8 强 / 0.5 中等 / 0.2 弱）；
        置信度起点 1.0，判分方式与数据质量各可扣 0.15。区分度 n / sd 取自 13 号映射效度检查。</p>
    </div>
    <div class="card"><h3>谁做得好</h3>
      ${ranked.length ? `<table><tbody>${bars(ranked)}</tbody></table>
        <p class="foot">实心条 = 全覆盖面板模型，描边条 = 部分覆盖模型。悬停条形看 facet 拆解。
          <b>排名要连着覆盖徽章一起读</b>：P 分是各 facet 的等权平均，只测了部分 facet 的模型等于跳过了没测的那几面，
          与全测模型不在同一量尺上。</p>`
        : '<p class="empty">这项能力目前没有任何模型数据。</p>'}
    </div>`;

  document.getElementById('psel').onchange = e => go('#/p/' + e.target.value);
}

/* ---------- view: benchmark ---------- */
let curB = null, curSub = null;
function viewBench(){
  if (!curB || !benchBy[curB]) curB = D.benchmarks[0].id;
  const b = benchBy[curB];
  const rows = evByBench[curB] || [];
  const subs = [...new Set(rows.map(r => r.sd))].sort();
  if (!curSub || !subs.includes(curSub)) curSub = subs[0];

  const opts = D.benchmarks.map(x => `<option value="${esc(x.id)}" ${x.id === curB ? 'selected' : ''}>${esc(x.id)} — ${esc(x.name)}</option>`).join('');
  const cells = benchToCells[curB] || [];

  // A benchmark's leaderboard lists only models actually run on it. Imputed
  // rows carry the *donor* model's raw value, so showing them here would put a
  // number next to a model that was never evaluated - exactly the fabrication
  // this view must not commit. They are listed separately as 未测过.
  const board = rows.filter(r => r.sd === curSub && !r.zero);
  const seen = new Set();
  const uniq = board.filter(r => { if (seen.has(r.m)) return false; seen.add(r.m); return true; })
                    .sort((x, y) => y.s - x.s);
  const untested = D.models.map(m => m.key).filter(k => !seen.has(k));
  const v = D.validity[curB + '||' + curSub] || {};

  app.innerHTML = `
    <h2>Benchmark 视图</h2>
    <p class="sub">它测什么、我们给了多少置信度、喂给了哪些原子能力、所有模型在它上面的表现。</p>
    <div class="toolbar"><select id="bsel">${opts}</select></div>
    <div class="card">
      <h3>${esc(b.name)} <span style="color:var(--muted);font-weight:400">${esc(b.id)}</span></h3>
      ${b.profile.one_liner ? `<p class="oneline">${esc(b.profile.one_liner)}</p>` : ''}
      ${b.profile.missing ? '<span class="badge warn">档案待补 —— 下方仅有摘要，无完整 profile 文档</span>' : ''}
      <div class="kv">
        <span class="tag">置信权重 ${fx(b.confidence)}</span>
        <span class="tag">${esc(b.metric_family)}</span>
        <span class="tag">${esc(b.score_direction)}</span>
        <span class="tag">${esc(b.source_scope)}</span>
        ${b.profile.file ? `<span class="tag">doc/benchmark_profiles/${esc(b.profile.file)}</span>` : ''}
      </div>
      ${b.profile.sections.length ? `<div class="secs">${b.profile.sections.map(s => `
        <section><h4>${esc(s.heading)}</h4><ul>${s.bullets.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>` : ''}
      ${b.rationale ? `<details><summary>置信权重的定权理由（含 R2x 裁决记号）</summary>
        <div class="body stale">${esc(b.rationale)}</div></details>` : ''}
    </div>
    <div class="card"><h3>喂给了哪些原子能力</h3>
      ${cells.length ? `<table><thead><tr><th>取分维度</th><th>原子能力 · facet</th><th class="num">相关</th><th class="num">有效</th></tr></thead><tbody>
        ${cells.map(c => `<tr>
          <td>${esc(c.subdimension)}</td>
          <td>${pLink(c.p_code)} · ${esc(c.facet_name)}</td>
          <td class="num">${fx(c.weight)}</td>
          <td class="num">${b.confidence ? fx(c.weight * b.confidence) : '—'}</td>
        </tr>`).join('')}</tbody></table>`
        : '<p class="empty">这个 benchmark 在 v6 映射里没有挂载格。</p>'}
    </div>
    <div class="card">
      <h3>模型表现</h3>
      <div class="toolbar"><select id="ssel">${subs.map(s => `<option ${s === curSub ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <span class="badge">实测 n=${uniq.length}</span>
        <span class="badge">均分 ${fx(v.mean)}</span>
        <span class="badge">sd ${fx(v.sd)}</span>
        ${(v.flags || []).map(f => `<span class="badge warn">${esc(f)}</span>`).join('')}
      </div>
      <table><thead><tr><th>模型</th><th class="num">原始值</th><th></th><th class="num">0–10 分</th></tr></thead><tbody>
        ${uniq.map(r => `<tr>
          <td>${mLink(r.m)}</td>
          <td class="num">${fx(r.raw, 3)}</td>
          <td style="width:42%"><div class="track"><div class="bar${modelBy[r.m].full_panel ? '' : ' hollow'}"
            style="width:${(r.s * 10).toFixed(1)}%"></div></div></td>
          <td class="num"><b>${fx(r.s)}</b></td>
        </tr>`).join('')}
      </tbody></table>
      ${untested.length ? `<p class="foot" style="margin-top:12px">
        <b class="untested">未测过这一维度的 ${untested.length} 个模型</b>：${untested.map(k => mLink(k)).join('、')}。
        榜上只放真跑过的结果。</p>` : ''}
      <p class="foot">原始值为该 benchmark 的原生指标（${esc(b.metric_family)}），0–10 分是归一后进入映射的值。本榜<b>只列实际跑过的模型</b>：未测过的模型不在此列，因能力不具备记 0 分的模型也不在此列（那不是在这套题上量出来的成绩）。
        ${v.variance_restricted ? '⚠️ 13 号效度检查判定这一维度<b>方差受限</b>，当前模型集上排名信息量低。' : ''}</p>
    </div>`;

  document.getElementById('bsel').onchange = e => { curSub = null; go('#/bench/' + encodeURIComponent(e.target.value)); };
  document.getElementById('ssel').onchange = e => { curSub = e.target.value; viewBench(); };
}

/* ---------- search ---------- */
const index = [
  ...D.models.map(m => ({label: m.display, kind: '模型', hash: '#/model/' + encodeURIComponent(m.key), t: m.display + ' ' + m.key})),
  ...D.abilities.map(a => ({label: a.p_code + ' ' + a.p_name, kind: '原子能力', hash: '#/p/' + a.p_code, t: a.p_code + a.p_name + a.definition})),
  ...D.benchmarks.map(b => ({label: b.name + ' · ' + b.id, kind: 'Benchmark', hash: '#/bench/' + encodeURIComponent(b.id), t: b.id + b.name + b.profile.one_liner}))
];
const qEl = document.getElementById('q'), qrEl = document.getElementById('qr');
let hits = [], sel = 0;
qEl.oninput = () => {
  const q = qEl.value.trim().toLowerCase();
  if (!q){ qrEl.classList.remove('open'); return; }
  hits = index.filter(x => x.t.toLowerCase().includes(q)).slice(0, 12);
  sel = 0;
  qrEl.innerHTML = hits.length
    ? hits.map((h, i) => `<div class="${i === 0 ? 'sel' : ''}" data-i="${i}">${esc(h.label)}<span class="kind">${h.kind}</span></div>`).join('')
    : '<div style="color:var(--muted)">无匹配</div>';
  qrEl.classList.add('open');
  qrEl.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => { go(hits[+d.dataset.i].hash); qEl.value = ''; qrEl.classList.remove('open'); });
};
qEl.onkeydown = e => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
    qrEl.querySelectorAll('div[data-i]').forEach((d, i) => d.classList.toggle('sel', i === sel));
  } else if (e.key === 'Enter'){
    go(hits[sel].hash); qEl.value = ''; qrEl.classList.remove('open');
  } else if (e.key === 'Escape'){ qrEl.classList.remove('open'); }
};
document.addEventListener('click', e => { if (!e.target.closest('.search')) qrEl.classList.remove('open'); });

/* ---------- theme ---------- */
const themeBtn = document.getElementById('theme');
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', next);
  render();
};

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#\/?/, '');
  const [view, arg] = h.split('/');
  let active = 'overview';
  if (view === 'model'){ active = 'model'; if (arg && modelBy[decodeURIComponent(arg)]){ const k = decodeURIComponent(arg); if (!picked.includes(k)) picked = [k]; else picked = [k, ...picked.filter(x => x !== k)].slice(0, 3); openP = null; } viewModel(); }
  else if (view === 'p'){ active = 'ability'; if (arg) curP = arg; viewAbility(); }
  else if (view === 'bench'){ active = 'bench'; if (arg) curB = decodeURIComponent(arg); viewBench(); }
  else viewOverview();
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === active)));
  window.scrollTo({top: 0});
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  const v = b.dataset.view;
  go(v === 'overview' ? '#/overview' : v === 'model' ? '#/model/' + encodeURIComponent(picked[0] || fullPanel[0])
     : v === 'ability' ? '#/p/' + (curP || coveredP[0]) : '#/bench/' + encodeURIComponent(curB || D.benchmarks[0].id));
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
