<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgenticEdu Continuum · 教育 AI 原子能力评测</title>
<style>
:root{
  color-scheme: light;
  --plane:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff; --sunken:#efeeea;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e6e5de; --axis:#c3c2b7; --border:rgba(11,11,11,.09);
  --border-2:rgba(11,11,11,.14);
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec;
  --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --warning-ink:#7a5200; --critical:#d03b3b;
  --wash:rgba(42,120,214,.07);
  --sh-1:0 1px 2px rgba(11,11,11,.04);
  --sh-2:0 1px 2px rgba(11,11,11,.05), 0 10px 28px -18px rgba(11,11,11,.30);
  --sh-3:0 2px 6px rgba(11,11,11,.07), 0 18px 44px -22px rgba(11,11,11,.34);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0c0c0c; --surface:#171716; --raised:#1f1f1e; --sunken:#111110;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8d8b85;
  --grid:#2a2a28; --axis:#3d3d3a; --border:rgba(255,255,255,.10);
  --border-2:rgba(255,255,255,.16);
  --s1:#3987e5; --s2:#008300; --s3:#d55181;
  --warning-ink:#fab219;
  --wash:rgba(57,135,229,.12);
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
  --sh-3:0 2px 6px rgba(0,0,0,.55), 0 18px 44px -22px rgba(0,0,0,.95);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0c0c0c; --surface:#171716; --raised:#1f1f1e; --sunken:#111110;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8d8b85;
    --grid:#2a2a28; --axis:#3d3d3a; --border:rgba(255,255,255,.10);
    --border-2:rgba(255,255,255,.16);
    --s1:#3987e5; --s2:#008300; --s3:#d55181;
    --warning-ink:#fab219;
    --wash:rgba(57,135,229,.12);
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
    --sh-3:0 2px 6px rgba(0,0,0,.55), 0 18px 44px -22px rgba(0,0,0,.95);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.62; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit}
::selection{background:var(--wash)}
.link{
  color:var(--s1); cursor:pointer; text-decoration:none;
  border-bottom:1px solid transparent; transition:border-color .12s, color .12s;
}
.link:hover{border-bottom-color:currentColor}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
  padding:11px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap;
}
.brand{
  font-weight:680; letter-spacing:-.018em; white-space:nowrap; font-size:15px;
  display:flex; flex-direction:column; line-height:1.25;
}
.brand small{
  font-weight:400; font-size:10.5px; color:var(--muted);
  letter-spacing:.02em; margin-top:1px;
}
nav{
  display:flex; gap:2px; background:var(--sunken); padding:3px;
  border-radius:10px; border:1px solid var(--border);
}
nav button{
  border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:6px 15px; border-radius:7px; font:inherit; font-size:13px;
  transition:background .14s, color .14s;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{
  background:var(--raised); color:var(--ink); font-weight:620; box-shadow:var(--sh-1);
}
.spacer{flex:1}
.search{position:relative}
.search input{
  width:250px; padding:8px 12px; border-radius:9px;
  border:1px solid var(--border); background:var(--sunken); color:var(--ink);
  font:inherit; font-size:13px; transition:border-color .14s, background .14s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{
  outline:none; border-color:var(--s1); background:var(--raised);
  box-shadow:0 0 0 3px var(--wash);
}
.results{
  position:absolute; top:calc(100% + 6px); right:0; width:340px;
  max-height:360px; overflow:auto; background:var(--raised);
  border:1px solid var(--border-2); border-radius:12px;
  box-shadow:var(--sh-3); padding:5px; display:none; z-index:30;
}
.results.open{display:block}
.results div{
  padding:8px 11px; border-radius:7px; cursor:pointer; font-size:13px;
  display:flex; justify-content:space-between; gap:10px; align-items:center;
}
.results div:hover,.results div.sel{background:var(--wash)}
.results .kind{color:var(--muted); font-size:10.5px; white-space:nowrap}
.iconbtn{
  border:1px solid var(--border); background:var(--sunken); color:var(--ink-2);
  width:36px; height:36px; border-radius:9px; cursor:pointer; font-size:15px;
  transition:background .14s, color .14s;
}
.iconbtn:hover{background:var(--raised); color:var(--ink)}

/* ---------- layout ---------- */
main{max-width:1440px; margin:0 auto; padding:28px 24px 96px}
h2{
  font-size:23px; margin:0 0 5px; letter-spacing:-.022em; font-weight:660;
}
h3{
  font-size:11px; margin:0 0 14px; color:var(--muted); font-weight:640;
  text-transform:uppercase; letter-spacing:.09em;
}
.sub{color:var(--ink-2); font-size:13px; margin:0 0 22px; max-width:80ch}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px 22px; margin-bottom:18px;
  box-shadow:var(--sh-1);
}

/* ---------- stat tiles ---------- */
.stats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px}
.stat{
  position:relative; background:var(--surface); border:1px solid var(--border);
  border-radius:13px; padding:15px 18px 14px; min-width:132px; flex:1;
  box-shadow:var(--sh-1); overflow:hidden;
}
.stat::before{
  content:""; position:absolute; inset:0 auto auto 0; width:100%; height:2px;
  background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--s1) 25%,transparent));
}
.stat b{
  display:block; font-size:27px; font-weight:660; letter-spacing:-.03em;
  line-height:1.15; margin-bottom:2px;
}
.stat span{color:var(--muted); font-size:11.5px; letter-spacing:.01em}

/* ---------- tables ---------- */
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--grid)}
tbody tr:last-child td{border-bottom:0}
th{
  color:var(--muted); font-weight:620; font-size:10.5px; white-space:nowrap;
  text-transform:uppercase; letter-spacing:.07em;
  position:sticky; top:0; background:var(--surface); z-index:2;
  border-bottom:1px solid var(--border-2);
}
th.sortable{cursor:pointer; user-select:none; transition:color .14s}
th.sortable:hover{color:var(--ink)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr{transition:background .1s}
.scroll{
  overflow-x:auto; border:1px solid var(--border); border-radius:14px;
  background:var(--surface); box-shadow:var(--sh-1);
}
.scroll table th:first-child,.scroll table td:first-child{
  position:sticky; left:0; background:var(--surface); z-index:1;
  border-right:1px solid var(--grid); min-width:170px;
}
.scroll table th:first-child{z-index:3}
.scroll tbody tr:hover td{background:var(--wash)}
.scroll tbody tr:hover td:first-child{background:color-mix(in srgb,var(--wash) 100%, var(--surface))}
.rowsep td{
  background:var(--sunken)!important; color:var(--muted); font-size:11px;
  letter-spacing:.04em; padding:7px 11px; border-bottom:1px solid var(--border-2);
}
.gsep{border-right:1px solid var(--border-2)}

/* ---------- heat cells ---------- */
.heat{
  display:inline-block; min-width:42px; padding:4px 8px; border-radius:6px;
  text-align:center; font-variant-numeric:tabular-nums; font-size:12.5px;
  font-weight:560; letter-spacing:-.01em;
}
/* Sequential magnitude ramp. Light mode runs light->dark; dark mode runs the
   other way, so "more" always means "further from the surface" rather than
   darkest-on-dark, which reads as least. */
.h0{background:var(--seq-100);color:#0b0b0b} .h1{background:var(--seq-100);color:#0b0b0b}
.h2{background:var(--seq-200);color:#0b0b0b} .h3{background:var(--seq-200);color:#0b0b0b}
.h4{background:var(--seq-300);color:#0b0b0b} .h5{background:var(--seq-300);color:#0b0b0b}
.h6{background:var(--seq-400);color:#fff}    .h7{background:var(--seq-500);color:#fff}
.h8{background:var(--seq-600);color:#fff}    .h9{background:var(--seq-700);color:#fff}
:root[data-theme="dark"] .h0,:root[data-theme="dark"] .h1{background:var(--seq-700);color:#fff}
:root[data-theme="dark"] .h2,:root[data-theme="dark"] .h3{background:var(--seq-600);color:#fff}
:root[data-theme="dark"] .h4,:root[data-theme="dark"] .h5{background:var(--seq-500);color:#fff}
:root[data-theme="dark"] .h6{background:var(--seq-400);color:#fff}
:root[data-theme="dark"] .h7{background:var(--seq-300);color:#0b0b0b}
:root[data-theme="dark"] .h8{background:var(--seq-200);color:#0b0b0b}
:root[data-theme="dark"] .h9{background:var(--seq-100);color:#0b0b0b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .h0,:root:not([data-theme="light"]) .h1{background:var(--seq-700);color:#fff}
  :root:not([data-theme="light"]) .h2,:root:not([data-theme="light"]) .h3{background:var(--seq-600);color:#fff}
  :root:not([data-theme="light"]) .h4,:root:not([data-theme="light"]) .h5{background:var(--seq-500);color:#fff}
  :root:not([data-theme="light"]) .h6{background:var(--seq-400);color:#fff}
  :root:not([data-theme="light"]) .h7{background:var(--seq-300);color:#0b0b0b}
  :root:not([data-theme="light"]) .h8{background:var(--seq-200);color:#0b0b0b}
  :root:not([data-theme="light"]) .h9{background:var(--seq-100);color:#0b0b0b}
}
td.cell{white-space:nowrap}
td.cell .mark{margin-left:3px}
.mark{color:var(--muted); cursor:help; font-size:11px}

/* ---------- badges ---------- */
.badge{
  display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px;
  border:1px solid var(--border-2); color:var(--ink-2); background:var(--sunken);
  white-space:nowrap; font-weight:520; letter-spacing:.01em;
}
.badge.full{border-color:transparent; background:var(--s2); color:#fff}
.badge.warn{
  border-color:color-mix(in srgb,var(--warning) 55%,transparent);
  background:color-mix(in srgb,var(--warning) 14%,transparent);
  color:var(--warning-ink);
}
.tag{
  display:inline-block; font-size:11px; color:var(--ink-2); background:var(--sunken);
  border:1px solid var(--border); border-radius:6px; padding:3px 9px;
  white-space:nowrap; font-variant-numeric:tabular-nums;
}

/* ---------- bars ---------- */
.track{
  height:9px; border-radius:999px; background:var(--sunken);
  overflow:hidden; min-width:90px; box-shadow:inset 0 0 0 1px var(--border);
}
.bar{height:100%; border-radius:0 4px 4px 0; background:var(--s1)}
.bar.hollow{
  background:transparent; border:1.5px solid var(--s1);
  border-left:0; border-radius:0 4px 4px 0;
}

/* ---------- chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.chip{
  border:1px solid var(--border-2); background:var(--surface); color:var(--ink-2);
  padding:6px 13px; border-radius:999px; cursor:pointer; font:inherit; font-size:12.5px;
  display:inline-flex; align-items:center; gap:7px;
  transition:border-color .14s, background .14s, color .14s;
}
.chip:hover{border-color:var(--axis); background:var(--raised)}
.chip[aria-pressed="true"]{
  background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:560;
}
.chip .dot{width:8px; height:8px; border-radius:50%; flex:none}
.chip.partial{border-style:dashed}
.chip .cnt{color:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .cnt{color:color-mix(in srgb,var(--surface) 70%,transparent)}

/* ---------- two-column ---------- */
.grid2{display:grid; grid-template-columns:minmax(360px,.95fr) minmax(380px,1.2fr); gap:18px; align-items:start}
@media (max-width:1040px){.grid2{grid-template-columns:1fr}}
.radarwrap{display:flex; flex-direction:column; align-items:center}
.radarwrap svg{width:100%; max-width:620px; height:auto; display:block}
svg{max-width:100%; height:auto; display:block}
.legend{
  display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
  margin-top:14px; font-size:12.5px; padding-top:14px;
  border-top:1px solid var(--grid); width:100%;
}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px}
.legend .cov{color:var(--muted); font-size:11px; margin-left:6px}

/* ---------- disclosure ---------- */
details{border-top:1px solid var(--grid); padding:10px 0}
details summary{
  cursor:pointer; color:var(--ink-2); font-size:12.5px; list-style:none;
  display:flex; gap:8px; align-items:center; transition:color .14s;
}
details summary:hover{color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸"; color:var(--muted); transition:transform .16s}
details[open] summary::before{transform:rotate(90deg)}
details .body{padding:10px 0 4px; color:var(--ink-2); font-size:12.5px}
.stale{
  border-left:2px solid var(--warning); padding-left:14px; margin-top:8px;
  color:var(--ink-2); font-size:12.5px;
}
.notice{
  border:1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  background:color-mix(in srgb, var(--warning) 8%, transparent);
  border-radius:11px; padding:12px 16px; margin-bottom:16px;
  font-size:12.5px; color:var(--ink-2); line-height:1.6;
}

/* ---------- ability rows (model view) ---------- */
.prow{
  display:flex; align-items:center; gap:14px; padding:11px 12px;
  border-radius:9px; cursor:pointer; border-bottom:1px solid var(--grid);
  position:relative; transition:background .12s;
}
.prow::before{
  content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
  border-radius:2px; background:var(--s1); opacity:0; transition:opacity .14s;
}
.prow:hover{background:var(--wash)}
.prow:hover::before{opacity:1}
.prow .name{flex:1; min-width:0}
.prow .name b{font-weight:620; font-size:13px}
.prow .name span{
  display:block; color:var(--muted); font-size:11.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.prow .val{
  font-variant-numeric:tabular-nums; font-weight:640; width:46px;
  text-align:right; letter-spacing:-.02em; font-size:14px;
}
.drill{
  background:var(--sunken); border:1px solid var(--border);
  border-radius:11px; padding:14px 16px; margin:4px 0 12px;
}
.drill .defn{color:var(--ink-2); font-size:12.5px; margin-bottom:12px}
.drill table{font-size:12px}
.drill th,.drill td{padding:7px 9px}
.facetgrp{margin-bottom:14px}
.facetgrp:last-child{margin-bottom:0}
.facetgrp h4{
  margin:0 0 5px; font-size:12.5px; font-weight:640;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.facetgrp p{margin:0 0 8px; color:var(--muted); font-size:11.5px}

/* ---------- imputed / untested ---------- */
tr.imputed td{color:var(--muted)}
tr.imputed{
  background:repeating-linear-gradient(135deg,transparent,transparent 6px,var(--grid) 6px,var(--grid) 7px);
}
.untested{color:var(--warning-ink); font-weight:620}

/* ---------- profile card ---------- */
.kv{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 16px}
.secs{columns:2 310px; column-gap:30px}
.secs section{break-inside:avoid; margin-bottom:16px}
.secs h4{
  margin:0 0 6px; font-size:10.5px; font-weight:640; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em;
}
.secs ul{margin:0; padding-left:18px; color:var(--ink-2); font-size:12.5px}
.secs li{margin-bottom:4px}
.oneline{font-size:15px; line-height:1.55; margin:0 0 12px; letter-spacing:-.01em}

/* ---------- misc ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
select{
  padding:7px 11px; border-radius:9px; border:1px solid var(--border-2);
  background:var(--surface); color:var(--ink); font:inherit; font-size:13px;
  cursor:pointer; transition:border-color .14s;
}
select:hover{border-color:var(--axis)}
select:focus{outline:none; border-color:var(--s1); box-shadow:0 0 0 3px var(--wash)}
.empty{color:var(--muted); padding:28px; text-align:center; font-size:13px}
.foot{color:var(--muted); font-size:11.5px; margin-top:12px; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">AgenticEdu Continuum<small>教育 AI 原子能力评测 · v6 · R25 · 2026-07-19</small></div>
  <nav id="nav">
    <button data-view="overview">总览</button>
    <button data-view="model">模型</button>
    <button data-view="ability">原子能力</button>
    <button data-view="bench">Benchmark</button>
  </nav>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="搜模型 / 能力 / benchmark" autocomplete="off">
    <div class="results" id="qr"></div>
  </div>
  <button class="iconbtn" id="theme" title="切换深浅色">◐</button>

 → 三 P 假一致（R10：拆分要先做类别标注）。"]}],"file":"eduguard_bench.md","missing":false}},{"id":"eduillustrate","name":"EduIllustrate","confidence":0.7,"metric_family":"likert_0_to_5","score_direction":"higher_better","source_scope":"repo_eval","rationale":"教学图示/图文协同生成直接测多模态教学产物生成；R5 后不再挂 P03（理解侧）。","profile":{"one_liner":"生成式多模态基准——模型写 Manim 动画代码把解题过程画出来，渲染成功后由裁判按 8 个维度（4 文本 + 4 视觉）打 0-5 分。","sections":[{"heading":"出处与背景","bullets":["arXiv 2604.05005，2026。","动机：多模态教学评测几乎全在输入侧（看图答题），输出侧（画图讲题）没有基准；EduIllustrate 测\"能不能把讲解变成正确、可读的可视化\"。"]},{"heading":"数据与运行","bullets":["不在本仓库 harness 里跑：依赖 manim + texlive 太重，评测在上游克隆（~/code/EduIllustrate）执行；scripts/eval/build_eduillustrate_report.py 只负责把 8 维裁判分回灌到标准 reports/eval/eduillustrate/<model>/ 布局。"]},{"heading":"任务与判分","bullets":["模型输出 Manim 代码 → 渲染 → 裁判按 8 维 0-5 打分（正确完整性、逻辑连贯、易懂性/教学效果等 4 个文本维 + 4 个视觉维）；单题总分是 8 维几何平均；渲染失败按失败计。","本地裁判是替代品：论文用 Gemini 3.0 Pro，本地用 MiniMax-M3 —— 分数只能内部比较，不可对外与论文对照（此 caveat 已写入 summary.json 和 HTML）。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=3，均分 6.77，sd 0.41——不受限但模型少。","渲染成败混入分数：一部分方差来自\"会不会写能跑的 Manim 代码\"（工程能力）而非教学可视化能力。","它是 P10 的唯一证据来源（孤证）——P10 的任何结论都依赖这一个 benchmark + 替代裁判。"]}],"file":"eduillustrate.md","missing":false}},{"id":"ifeval","name":"IFEval","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"可验证指令的规则判分（官方 checker，无裁判），P01 的首个直接测量（2026-07-12 缺口填补，R13：edubench 裁判打的指令遵循分在模型排名上无独立信息量）。通用指令非教育语境，作 P01 操作基座的门槛证据。","profile":{"one_liner":"541 条带可机器验证硬约束的指令（字数、格式、关键词、大小写等），官方规则代码判分——P01（指令与约束遵循）的第一个直接测量。","sections":[{"heading":"出处与背景","bullets":["Zhou et al. 2023, *Instruction-Following Evaluation for Large Language Models*（arXiv:2311.07911），google-research 官方实现，Apache-2.0。","接入动机（R13/R14）：edubench 裁判打的\"指令遵循\"分与知识指标在模型排名上信息重合（同源模型级 ρ≈0.96），且换裁判后不稳健——P01 的直接测量必须走规则判分。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark ifeval → sources/datasets/ifeval/data/input_data.jsonl（541 条）+ 官方 checker 四个模块 vendored 到 sources/datasets/ifeval/instruction_following_eval/。","判分依赖 nltk / langdetect / immutabledict / absl-py（miniconda python 已装；fetch 时自动下 nltk punkt）。"]},{"heading":"任务与判分","bullets":["每条 prompt 带 instruction_id_list + kwargs（约 25 种指令类型）；无裁判、无抽取 LLM，直接对原始回复跑官方检查。","headline = 官方 prompt 级 strict accuracy（一条 prompt 的全部指令在原始回复上全部满足）；extra_metrics 含 prompt-loose / instruction-strict / instruction-loose（loose 按官方 8 变体重试：去首行/尾行/去 *）。"]},{"heading":"局限与注意","bullets":["通用指令、英文为主，不是教育语境——按 foundation_gate 挂 P01，作操作基座门槛证据，不宣称教育指令遵循。","部分指令（如\"重复请求原文\"）会让回复看起来像回显题面，是正常现象。"]}],"file":"ifeval.md","missing":false}},{"id":"k12vista","name":"K12Vista","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"中文 K12 图文学科题（五学科×三学段，固定 300 题分层抽样）。R15 裁决：挂 P03 学科图表 facet 0.55（P03/P04 合并后难度不再分 P）；判分用官方 rubric 的 LLM 裁判逐空 0/1，裁判未校准、仅 4 个视觉模型可跑——参考值。","profile":{"one_liner":"3.3 万道中文 K12 图文学科题（数理化生地 × 小初高，选择/填空/问答），必须先读懂学科图再多步推理——P04（复杂多模态理解）的第一个直接测量，也是中文多模态的补位。","sections":[{"heading":"出处与背景","bullets":["Li et al. 2025, *K12Vista*（arXiv:2506.01676），官方仓库 github.com/lichongod/K12Vista，数据 lipku1999/K12-Vista（公开，无 gate）。","接入动机：P04 在测量模型 v1 里是四个完全空白的 P 之一（model_type: undeclared，零格子）。缺口推荐文档（2026-07-11）把 K12Vista 列为首选，理由是中文、公开有标签、静态图文、接入成本与 mathvista 同级。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark k12vista → 克隆官方仓库（要 K12_Vista/code/prompt.py）+ 下 K12_Vista.jsonl（33,660 行 / 501 MB）。","图是 base64 内嵌在 img 字段的，没有单独的图片包——省了配图这一步。","build_k12vista_sample.py --size 600 生成固定题单 data/k12vista/item_list_v2.txt：按 题型 × 学科-学段 分层（33 个层，按人口比例分配、每层至少 1 题），解码出图片到 sources/datasets/k12vista/images/，并写一份去掉 base64 的瘦身 jsonl。所有模型跑同一份题。","抽样构成：选择题 209 / 填空题 198 / 问答题 193；11 个学科-学段各 53-64 题；难度 难 426 / 较难 132 / 中 31 / 较易 11（自然分布，与全量一致）。","难度为什么不做分层轴：difficulty 是数据自带的五档标签，但论文对它怎么来的只字未提，官方 evalaute.py 的汇总轴也只有 题型 × 学科-学段（学段已编码在 subject 里，如 math-g9），根本不用它；而且全量分布极偏（难 71.7% / 较难 22% / 易仅 4 题）。v1 拿它当第三轴撑出 121 个层，每层至少 1 题的地板吃掉 300 个名额里的 121 个，把样本拉得比全量偏易约 15pp（难档 54.7% vs 全量 71.7%）。v2 起难度只作报告分桶，并注明标签未经校准。","样本量：600 题时总分 95% CI 约 ±4pp，单个学科-学段桶约 ±13pp（v1 的 300 题分别是 ±5.7pp / ±17-20pp）。要在学科-学段这一档做严肃比较（每桶 ±10pp 以内）可提到 900——改 --size 重跑即可，脚本幂等。"]},{"heading":"任务与判分","bullets":["提示词照搬官方 prompt.py::infer_prompt['directly_infer_prompt'][题型]（三种题型三套）。官方 runner 会把题干里的 <image> 占位符删掉、把图放在文本前面（models/vllminfer.py），我们一致。","官方 evalaute.py 的汇总轴是 题型 × 学科-学段，外加按学科、按学段的边际——不含难度。","判分照搬官方 eval_prompt['directly_eval_prompt'][题型]：裁判逐空提取参考答案与学生答案，输出 <evaluation>[[参考],[学生],[0/1 列表]]</evaluation>，题分 = 各空得分均值（多空题部分给分，见 models/K12_PEM_judgemodel.py）。","表头 accuracy = 严格全对率（所有空都对）；官方口径的部分给分均值在 extra_metrics.official_score，score_10 = 10× 它，供能力聚合用。按题型/学科/学段/难度分桶。"]},{"heading":"局限与注意","bullets":["裁判不是官方那一个。官方判分用 GPU 部署的 Qwen2.5-VL-72B 或微调的 K12-PEM，本地起不来；这里换成 API 裁判（K12VISTA_JUDGE_MODEL，默认 MiniMax-M3）。rubric 原文一字未改，但裁判模型本身没有拿人工金标校准过，报告里必须直说，不能声称与官方榜单可比。","裁判只看文本（题干、标准答案、解析、学生作答），不看图——官方也是这样，所以裁判不需要视觉能力。","模型面天然受限：主测 5 个模型里只有 2 个能看图。2026-07-13 用真实题图逐个探测的结果——能看图：MiniMax-M3、doubao-seed-2.0-pro、doubao-seed-2.0-lite、kimi-k2.6；不能看图：MiniMax-M2.7（纯文本）、glm-5.2（网关 400）、deepseek-v4-pro。","deepseek-v4-pro 是个陷阱：收到图片不报错、返回 200，然后回一句\"你没有上传图片\"照样作答。跑之前不探测的话，会静默产出一堆瞎猜的分数而判分链路毫无警告。文本模型在 K12Vista 上必须标\"不适用\"，绝不能记 0 分——那是测量假象不是能力差距。","建议模型面：MiniMax-M3 + doubao-seed-2.0-pro（主测 5 中的两个）+ doubao-seed-2.0-lite + kimi-k2.6（补充档），凑够 4 个模型，13 号检查的跨模型相关才有最低样本量（≥3）。","只跑 600 题抽样，不跑全量 33k：预算约束，且分层已覆盖全部 33 个层。抽样误差要在报告里带上（bootstrap CI）。"]}],"file":"k12vista.md","missing":false}},{"id":"longtutor_diagnosis","name":"LongTutor 知识状态诊断","confidence":0.85,"metric_family":"accuracy_or_f1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"从交互历史推断学生知识状态（四类认知层失败机制），headline macro-F1。2026-07-16 裁决：P16a『知识状态估计』主挂 0.30（参考值）+ P11c（原 P13）副挂 0.10，P11b（原 P12）排除（输入无解题步骤）。注记：类别不平衡（多数类基线 acc 0.506 > 模型 0.35-0.44）；金标为特征决策矩阵+人工修订，非独立盲标。","profile":{"one_liner":"从交互历史判断学生的知识状态，四分类诊断取 macro-F1。金标为特征决策矩阵加人工修订，且类别不平衡（多数类基线 acc 0.506）。","sections":[{"heading":"在本仓库怎么用","bullets":["官方仓库只有 pi ,"bullets":["adapter scripts/eval/benchmarks/mathvista.py；必须用视觉模型（MiniMax-M3 可以，M2.7 纯文本不行）；--dry-run 会省略 base64 图片打印消息。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=1——只有一个模型跑过，完全没法做配对分析。补模型清单里要带上它。","题源来自公开数据集拼装，部分子集污染风险高。","感知与推理混在一个 accuracy 里，拆不开（构念核对里归\"解题式图像理解\"）。"]}],"file":"mathvista.md","missing":false}},{"id":"mmlu_pro","name":"MMLU-Pro","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"基础学科知识与选择题答题能力，主要验证 LLM 答题门槛，不应主导教育能力雷达图。R22：0.35→0.7——精确匹配判分最硬却被压到低于裁判天花板分的 edubench，倒挂；护栏由映射结构（不挂教育侧 P）承担。","profile":{"one_liner":"MMLU 的高难升级版——选项从 4 个加到 10 个、题目偏推理，用来测大学水平的学科知识与答题能力。","sections":[{"heading":"出处与背景","bullets":["TIGER-Lab，2024（论文 *MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark*）；https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro","动机：原版 MMLU 被强模型刷到 88%+ 接近饱和，且对 prompt 敏感；MMLU-Pro 通过 10 选 1 + 提高推理占比来恢复区分度。"]},{"heading":"数据","bullets":["约 12,000 题，14 个学科大类（数学、物理、化学、法律、工程、心理学等），英文。","获取：TIGER-Lab/MMLU-Pro 公开可下（注意 TIGER-AI-Lab/ 路径是 gated 的，别用错）；fetch_eval_datasets.py --benchmark mmlu_pro 落到 sources/datasets/。"]},{"heading":"任务与判分","bullets":["10 选 1 选择题，模型输出选项字母。","规则判分：官方 answer is (X) 正则提取，失败时走 LLM 提取兜底；精确匹配字母。无裁判依赖。"]},{"heading":"在本仓库怎么用","bullets":["adapter scripts/eval/benchmarks/mmlu_pro.py，--benchmark mmlu_pro。","按 category 出分桶。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=5，均分 8.60，标准差 0.21 → ceiling + low_variance 双标记，当前模型集上排名基本无信息量。","训练数据污染风险高（公开考试题库类）。","纯英文，对中文教育场景是间接证据。"]}],"file":"mmlu_pro.md","missing":false}},{"id":"mmtutorbench","name":"MMTutorBench","confidence":0.85,"metric_family":"score_0_to_6","score_direction":"higher_better","source_scope":"repo_eval","rationale":"多模态 tutor 综合测图文感知、反馈生成和策略选择；当前小样本默认排除主图。","profile":{"one_liner":"视频关键帧数学辅导基准——模型看教学视频的关键帧序列 + 学生提问，生成结构化辅导回复，裁判按 6 个二元维度打分。","sections":[{"heading":"出处与背景","bullets":["HF Tangchiu/mmtutorbench，2025。","动机：真实辅导常发生在\"学生看着题/看着讲解卡住了\"的多模态语境，考察模型能否基于视觉上下文做辅导（而非只看文字）。"]},{"heading":"数据","bullets":["770 条 JSONL 样本、1,414 张关键帧图片。英文。","获取：fetch_eval_datasets.py --benchmark mmtutorbench（JSONL + 关键帧 + data_manifest.json）。"]},{"heading":"任务与判分","bullets":["输入：历史关键帧 + 当前帧 + 学生提问；要求回复分三段：Insight Discovery / Operation Formulation / Operation Execution。","固定 rubric 裁判（MMTUTORBENCH_JUDGE_MODEL，默认 MiniMax-M3）按 6 个二元维度判分：insight_identification、operation_prescription、operation_execution、solution_scope_control、brevity、coherence；报告 0-6 总分 + 论文等权分。","mmtutorbench_judge_calibration 只是占位：公开数据没有逐条人类金标，无法做裁判校准（输出状态而非编造校准）。"]},{"heading":"在本仓库怎么用","bullets":["首次冒烟：LIMIT=5 MODEL=MiniMax-M3 JUDGE_MODEL=MiniMax-M3 ./scripts/run_eval.sh mmtutorbench；不要默认跑全量 770。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=1（默认小样本、单模型），当前不进主图（映射备注\"小样本默认排除\"）。","无人类金标 → 裁判分数完全没有外部锚点，只能做模型间相对比较。","三段式格式要求让分数混入格式遵循成分。"]}],"file":"mmtutorbench.md","missing":false}},{"id":"mooccube_prereq","name":"MOOCCube 先修关系推理","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"MOOCCube（ACL 2020，学堂在线）905 条专家先修边当金标，200 道先修选择 + 100 道排序，100% 规则判分，P19（知识结构层路径规划）的首个测量。R16 裁决：P19 0.70 / P05 0.20 / P06 0.10；自建协议、无公开基线，benchmark weight 压到 0.70，参考值；『按学习者状态定制路径』是 P16×P19 组合能力，不设 P19b。","profile":{"one_liner":"拿学堂在线知识图谱里 905 条专家标注的先修边当金标，自建两类题（先修选择 + 学习顺序排序），100% 规则判分、零裁判——P19（学习路径规划）的第一个直接测量，但只覆盖\"知识结构\"那一半。","sections":[{"heading":"出处与背景","bullets":["Yu et al. 2020, *MOOCCube: A Large-scale Data Repository for NLP Applications in MOOCs*（ACL 2020），学堂在线 706 门真实课程 / 38,181 个视频 / 114,563 个概念 + 概念图谱。官方页 moocdata.cn，数据一个 1.09 GB 的 zip 直接下，无需申请。","接入动机：P19 在测量模型 v1 里是四个完全空白的 P 之一（model_type: undeclared，零格子）。缺口推荐文档（2026-07-11）把 MOOCCube 列为 P19a（先修关系推理）的首选：图谱现成、规则判分，代价是任务协议要自己设计（MOOCCube 原文没有这个任务）。"]},{"heading":"数据","bullets":["fetch_eval_datasets.py --benchmark mooccube → 下 zip + 解压到 sources/datasets/mooccube/MOOCCube/（gitignored，1.09 GB 压缩 / 解压后约 4 GB）。","概念 id 的形状是 K_<名称>_<领域>（例：K_IP地址_计算机科学技术），领域直接从 id 尾巴切出来，不需要再 join concept-field.json。","金标只有两个领域：数学 525 条边、计算机科学技术 502 条（其中 35 条跨领域，出题时丢弃）。","方向是我验证过的，不是猜的——在语义无歧义的样例上核对：加法→函数、算术→绝对值、算法→时间复杂度、向量→巴拿赫空间，左列一律是先修。","1. 有环。60 个概念落在环上（图谱不是 DAG）。所以：排序题只采导出子图无环的连通子图；选择题的干扰项合法性一律走传递闭包判定（干扰项不得 ∈ anc[Y]），环上节点被闭包自动排除。凭\"这是 Y 的后继所以肯定不是先修\"这种直觉写代码会错。","2. 不完备。905 条边远不是数学+计算机全部的先修关系（见\"局限\"）。","为什么不用后者当金标（这是本次接入最需要拿主意的地方）：","1. 它和图谱边几乎是两套标注——1,605 条正例里只有 28 条能和 905 条图谱边对上（1.7%）。不是同一份东西的两种存法。","2. 它的主体是模型的猜测。489,300 对里 98.5% 是 label: -1（无人工标签）+ 一个模型的 predict 概率。拿它当金标 = 拿另一个模型的输出当真值，正是本仓库反复要避免的事（P19 的分数不能背裁判/模型噪声）。","3. 按名字编码，join 不回去。没有 id 就拿不到领域、定义、课程，做不了同领域干扰项——而同领域干扰项恰恰是这个评测不退化成常识题的命门。","它那 2,011 条人工负例本身是有价值的（是\"已验证的非先修对\"，比图谱闭包推出来的负例更硬），但词表对不上，这次没用。后续想用：需要先做一次 名字→id 的消歧映射（同名概念跨领域会撞），值得单独做一版。"]},{"heading":"任务与判分","bullets":["题目由 build_mooccube_item_list.py 从图谱构造（固定 seed 20260713，分层抽样，300 题：200 选择 + 100 排序），产出 data/mooccube/item_list_v1.txt + manifest（含生成题目文件的 sha256，adapter 每次跑都校验），所有模型跑同一份题。","① 先修选择（200 题，随机基线 0.25）：给概念 Y 和它的定义，问\"学 Y 之前必须先掌握下面哪一个\"。正确选项是图谱里 Y 的真实先修概念；三个干扰项全部同领域，且优先采 Y 的后继概念（reverse——Y 才是它们的先修，方向反了），不足时补\"同领域 + 与 Y 同课程 + 图谱闭包里与 Y 无先修通路\"的近邻概念。200 题里 102 题带方向反转陷阱。判分：正则抽 答案：<字母>，精确匹配。","真实的一道题（mooccube-mcq-05bbc39615）：","四个选项全是计算机网络的词——选对必须知道方向，\"听起来相关\"没用。","选择题的出题算法（build_mcq_pool），逐个概念 Y 走一遍：","为什么正确项位置用轮转不用 shuffle：shuffle 出来的 gold 分布会偏（第一版实测 A=36 / C=57），\"永远选 C\" 就能拿 28.5%。轮转把恒定策略压回 25% 附近（实测最好的恒定策略 0.275）。","② 学习顺序排序（100 题，随机基线均值 0.030）：4-6 个有依赖关系的概念打乱给出，要求排出满足全部先修约束的顺序。不要求唯一拓扑序——任何满足全部依赖的顺序都算对；部分分 = 满足的约束比例。","排序题的出题算法（build_order_pool）：从随机种子概念出发，沿 succ ∪ pred 随机扩张成 4-6 个点的连通集 → 取导出子图 → 无环检查（三色 DFS，有环就丢）→ 精确枚举 n! 种排列算随机通过概率（n≤6 → ≤720 种，便宜）→ 只保留 chance ≤ --max-order-chance（默认 0.05）→ 概念顺序打乱后存题。","一道真题（mooccube-order-0455d1dc06，5 个概念 / 4 条约束 / chance 0.033）：","extract_answer 里不发任何 API 请求——这是 P19 的硬约束，分数不能背抽取模型的噪声。","选择题：三级正则兜底。① 答案\\s*[:：]?\\s*\\(?\\[?([A-Da-d])（取最后一个匹配，避免模型在思考里先写错再改）；② (?:answer|选项)\\s*(?:is|为|是)?\\s*[:：]?\\s*\\(?([A-Da-d])；③ 最后一个非空行是光秃秃一个字母（容忍 B、(B)、B. 这些包装）。三级都抽不出 → unparsed。","排序题：先按分隔符切（-> → => > ＞ , ， 、 都认），剥掉 1. 这种序号和  引号括号，要求切出来的恰好是全部概念名的一个排列（集合相等且个数相同）才算数；否则退回\"某一行里每个概念名恰好出现一次 → 按首次出现位置排序\"的兜底。兜底有个防御：如果本题有概念名是另一个概念名的子串（算术 vs 算术运算），位置匹配会歧义，直接放弃兜底判 unparsed——宁可记未解析，也不能瞎判对错。","判分：pos[a] < pos[b] 逐条查图谱边。全满足 → correct；满足比例 → 部分分。","unparsed 一律判 0 分并计入 unparsed_rate，不静默丢弃（丢弃会让分母变小、分数虚高）。","分桶（报告里的分组列）：task（mcq/order）、field（数学/计算机）、variant（mcq_with_reverse_trap / mcq_sibling_only / order_n4..n6）。","score_10 做了随机基线校正，随机作答得 0 分而不是 2.8 分：","两类题各占一半：选择题量大但单题信息少（4 选 1），排序题量小但每题是多约束联合判定，信息密度高，等权是折中。"]},{"heading":"在本仓库怎么用","bullets":["纯文本，不需要视觉模型；不花裁判的钱——只有答题成本，判分是本地正则。","--limit N 取的是交错后的前 N 题（load_items 按 2 选择 : 1 排序 交错），所以任何前缀都同时覆盖两种题型，冒烟不会只测到一半。","题单是 300 题的全集，--item-list 只是完整性校验（少一题就报错，防止跨模型题目不一致）。","提交进 git 的是 data/mooccube/item_list_v1.txt（300 个 item_id）+ item_list_v1_manifest.json（含出题参数、分层计数、随机基线、生成题目文件的 sha256）。","题目本体 sources/datasets/mooccube/items_v1.jsonl 不提交（gitignored）。它由 builder 确定性重建（固定 seed 20260713 + 全程排序迭代），adapter 每次加载都拿 sha256 和 manifest 对，对不上直接报错退出——别人重新生成一份不一样的题却拿旧分数比较，这条能挡住。","item_id 是内容哈希（mooccube-mcq-<sha1(target+选项)[:10]>），不是序号：出题参数一改，id 就变，不会出现\"同一个 id 指向不同题目\"的静默错配。","改完必须重跑弱基线自查（下一节），并且换一个 item_list_v2 的名字——不要原地覆盖 v1，已经跑过分的模型没法回溯。"]},{"heading":"天花板自查（必读）","bullets":["本仓库最大的方法论问题是分数拉不开（19 个格子因此作废），所以出题时就按\"难\"设计，并做了三轮自查：","1. 弱基线实算（items_v1.jsonl 全 300 题）：","最后两行是关键：部分分的随机地板高达 0.50（每条约束在随机排列下有一半概率被满足），所以 score_10 的排序分量用的是严格全对率（地板 0.03），部分分只作为 extra_metrics 里的诊断量，绝不进 headline。这一条如果搞错，排序题会白送 5 分。","2. 第一版太简单，改了：初版干扰项没限制领域，结果出现\"学『乘法』之前要先掌握『即时通信』\"这种题——跨领域干扰项让模型不用懂先修关系、光靠常识就能排除。改法：所有选项（含正确项）强制同领域，跨领域的边（905 条里 35 条）对应的题直接丢掉；并优先采 Y 的后继概念做干扰项（方向反转陷阱）。定义字段也修了：没有\"定义：\"子句的概念不再吐出乱码学科路径（那会泄漏领域线索）。","3. 真实模型离天花板很远。2026-07-13 smoke（deepseek-v4-pro，网关，12 题：9 选择 + 3 排序，unparsed_rate = 0.0）：","选择题 0.78 有头部空间，排序题明显是硬骨头（部分分 0.69 只比随机的 0.50 高一点）。没有任何天花板迹象。样本量小（尤其排序题 n=3），只证明链路通、难度对，不作能力结论。","反向风险是排序题过难（有可能全模型贴地板，同样拉不开分）。全量跑完后如果排序题严格全对率普遍 <0.05，就把 --size 里的排序题降到 4-5 个概念、或改用约束满足率做 headline 分量（但那样必须减去 0.503 的随机地板）。若相反、选择题普遍 >0.90，则只保留带方向反转陷阱的 102 道题。"]},{"heading":"局限与注意","bullets":["这只是半个 P19，别吹成完整的 P19。先修关系是学科知识结构层面的顺序——\"概念 A 依赖概念 B\"，是课程设计者视角的静态图。P19 的另一半——根据某个学生当前的掌握状态、错题、进度，为他定制下一步学什么——本基准完全没测，仍然是缺口（缺口推荐文档里的 P19b 下一步练习推荐 / P19c 整体规划生成）。报告里必须写\"P19 部分覆盖\"。","任务协议是本仓库自建的。MOOCCube 原文只发图谱，没有这个任务、没有官方基线、没有可比的公开成绩。所以 benchmark weight 压到 0.70（低于 K12Vista 0.80），且不能宣称与任何公开榜单可比。","图谱不完备。905 条边远不是数学+计算机全部的先修关系。干扰项\"在图谱闭包里与 Y 无通路\"不等于\"现实中真的不是 Y 的先修\"——这是不可消除的标签噪声。缓解手段：优先用 Y 的后继概念做干扰项，那是图谱内可证的非先修（有环的节点已被闭包排除），不依赖\"图谱完备\"这个假设。102/200 道题带这种干扰项。","金标本身有一部分是可争议的。smoke 里 deepseek 把「加法」排在「基本运算」之前，图谱说的是「基本运算 先于 加法」——判错。这类粒度/顺序的争议在专家标注里客观存在，排序题要求满足全部约束，所以一条有争议的边就能让整题挂掉。这是\"严格全对率\"口径的已知代价（也是为什么同时报约束满足率）。要更干净的结论，需要人工复核一遍被判错的边——尚未做。","领域只有数学和计算机，没有文科理科其它学科；概念粒度也偏细（\"左值\"\"缓冲\"这种）。结论不要外推到全学科。","概念定义直接取自图谱 explanation 的\"定义：\"子句；约一半概念没有这个子句，只显示名字。"]}],"file":"mooccube.md","missing":false}},{"id":"mrbench_judge","name":"MRBench Judge","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"多维 tutor 回复评判（被测模型自己当裁判，与人类标注算一致率/macro-F1/kappa）。R23：仅在 P10「主观题评价能力」计分——该 P 的被测构念就是判卷能力，与已计分的 sas_bench CCS 同属『按维度分解评判 + 与人类标注算一致性』这类操作（R19 定的 facet 划分轴是评分操作类型，不是评分对象）。置信 0.0→0.75：人类标注锚定的一致率统计，与 CCS 0.95、asap_2 0.8 同族，因裁判协议自身噪声折价一档。构念错位的原 P09c/P17a 挂载已删除。","profile":{"one_liner":"AI tutor 回复的 8 维人工标注基准（NAACL 2025 *Unifying AI Tutor Evaluation*）——200 段学生犯错对话 × 至多 9 个模型的 tutor 回复，每条人工标 8 个教学维度。","sections":[{"heading":"出处与背景","bullets":["Maurya、Kochmar 等（MBZUAI），NAACL 2025；repo kaushal0494/UnifyingAITutorEvaluation，数据 MRBench/MRBench_V2.json。","动机：把 tutor 回复质量的评价维度统一成一个分类学（后来直接衍生出 BEA 2025 共享任务）。"]},{"heading":"数据","bullets":["200 段对话（源自 MathDial + Bridge，真实学生数学错误），每段配至多 9 个 tutor 模型的回复，人工标注 8 维。英文。","获取：fetch_eval_datasets.py --benchmark mrbench（urllib 直下）。"]},{"heading":"任务与判分","bullets":["8 个原生维度：Mistake Identification / Mistake Location / Revealing of the Answer（No / Yes-correct / Yes-incorrect）/ Providing Guidance / Actionability / Coherence / Tutor Tone（鼓励/中性/冒犯）/ Humanlikeness。","两个 adapter：","mrbench_judge：被测模型当裁判逐维贴标签，与人类金标算一致率 + macro-F1 + kappa（测\"这个模型做裁判有多像人\"）；","mrbench_tutor：被测模型生成下一句 tutor 回复，固定裁判（MRBENCH_JUDGE_MODEL，默认 MiniMax-M3）标 8 维；headline = 关键三维（MI/PG/Actionability）全 Yes 的 pass rate，全部维度分布在 extra_metrics。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：mrbench_tutor n=3，均分 3.73，sd 0.65——分数拉得开但模型太少。","只有 200 段对话，样本量小，维度级估计噪声大。","tutor 侧结果依赖固定裁判的标注质量；judge 侧 excluded 不计分。","pass rate 复合问题同 BEA（构念核对 R2：Mistake_Identification→P11c 错因归因、Guidance/Actionability→P17/P18、Revealing_Answer/Tutor_Tone→P20，单维分现成）。"]}],"file":"mrbench.md","missing":false}},{"id":"mrbench_tutor","name":"MRBench Tutor","confidence":0.85,"metric_family":"share_0_to_1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"tutor 回复生成、固定裁判 8 维标注。R2 裁决：复合 pass rate 换单维度分（Mistake_Identification/Providing_Guidance/Actionability 用 Yes 占比）。R19：Tutor_Tone 一份标注取两个统计量——P20 边界用 1−Offensive，P18 语气支持用 Encouraging 占比（替换原 Encouraging+0.5×Neutral 单格，去重）。仅 3 个模型面（2026-07-16 决定不补跑）。","profile":{"one_liner":"AI tutor 回复的 8 维人工标注基准（NAACL 2025 *Unifying AI Tutor Evaluation*）——200 段学生犯错对话 × 至多 9 个模型的 tutor 回复，每条人工标 8 个教学维度。","sections":[{"heading":"出处与背景","bullets":["Maurya、Kochmar 等（MBZUAI），NAACL 2025；repo kaushal0494/UnifyingAITutorEvaluation，数据 MRBench/MRBench_V2.json。","动机：把 tutor 回复质量的评价维度统一成一个分类学（后来直接衍生出 BEA 2025 共享任务）。"]},{"heading":"数据","bullets":["200 段对话（源自 MathDial + Bridge，真实学生数学错误），每段配至多 9 个 tutor 模型的回复，人工标注 8 维。英文。","获取：fetch_eval_datasets.py --benchmark mrbench（urllib 直下）。"]},{"heading":"任务与判分","bullets":["8 个原生维度：Mistake Identification / Mistake Location / Revealing of the Answer（No / Yes-correct / Yes-incorrect）/ Providing Guidance / Actionability / Coherence / Tutor Tone（鼓励/中性/冒犯）/ Humanlikeness。","两个 adapter：","mrbench_judge：被测模型当裁判逐维贴标签，与人类金标算一致率 + macro-F1 + kappa（测\"这个模型做裁判有多像人\"）；","mrbench_tutor：被测模型生成下一句 tutor 回复，固定裁判（MRBENCH_JUDGE_MODEL，默认 MiniMax-M3）标 8 维；headline = 关键三维（MI/PG/Actionability）全 Yes 的 pass rate，全部维度分布在 extra_metrics。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：mrbench_tutor n=3，均分 3.73，sd 0.65——分数拉得开但模型太少。","只有 200 段对话，样本量小，维度级估计噪声大。","tutor 侧结果依赖固定裁判的标注质量；judge 侧 excluded 不计分。","pass rate 复合问题同 BEA（构念核对 R2：Mistake_Identification→P11c 错因归因、Guidance/Actionability→P17/P18、Revealing_Answer/Tutor_Tone→P20，单维分现成）。"]}],"file":"mrbench.md","missing":false}},{"id":"olympiadbench","name":"OlympiadBench","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"高难学科推理和多模态竞赛题，答题能力未完全饱和；仍作为门槛/诊断而非教育核心。R22：0.55→0.7——解题簇唯一未饱和、真正承担区分度的证据不应压最低档；污染风险低于 mmlu。","profile":{"one_liner":"奥林匹克竞赛级数学/物理开放题（非选择题），双语带图，是当前门槛类里最难、离饱和最远的一个。","sections":[{"heading":"出处与背景","bullets":["OpenBMB / 清华，2024（ACL 2024）；https://github.com/OpenBMB/OlympiadBench","动机：常规考试题对强模型饱和，用奥赛题（IMO/IPhO 级别）保持区分度，且带完整推理过程标注。"]},{"heading":"数据","bullets":["全集 8,476 题，数学+物理，中英双语，部分带图（多模态）。","本仓库只用 OE（开放式作答）配置，TP（证明题）配置跳过（无法自动判分）；图片抽取到 olympiadbench/images/。","获取：fetch_eval_datasets.py --benchmark olympiadbench（HF Hothan/OlympiadBench）。"]},{"heading":"任务与判分","bullets":["开放式作答，答案是数值/表达式/区间。","判分移植官方 repo：make_prompt 构造提示，sympy 符号等价的 AutoScoringJudge 判对错——需要 antlr4-python3-runtime==4.11（与 hydra-core 的 4.9 依赖冲突，必要时独立 venv）。"]},{"heading":"在本仓库怎么用","bullets":["adapter scripts/eval/benchmarks/olympiadbench.py；多模态题需要视觉模型。"]},{"heading":"局限与注意","bullets":["区分度（13 号实测）：n=2，均分 7.26，标准差 0.14——没天花板问题，但共同模型太少，什么都推不出来。补模型时优先补它（门槛类里唯一有区分度潜力的）。","竞赛真题，污染风险存在但比普通考试题低（解题过程难背）。"]}],"file":"olympiadbench.md","missing":false}},{"id":"p07_selfcheck","name":"P07 两轮自查","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"两轮自查协议（先答题、再无提示复查），P07 的首个直接测量（2026-07-12 缺口填补）；headline=0.5×改对率+0.5×(1−改错率)，与第一轮正确率解耦。复查时对自身答案的把握与校准相通，P08 占 0.15。","profile":{"one_liner":"先答题、再在同一对话里无提示地要求\"重新检查你的解答\"，规则判分分离\"错改对\"（真自查）与\"对改错\"（有害的自我怀疑）——P07（自我校验与修正）的第一个直接测量。","sections":[{"heading":"出处与背景","bullets":["本仓库自建（2026-07-12，缺口推荐文档优先级第 2 项）；协议是学术界 intrinsic self-correction 评测的标准做法（无外部反馈、不暗示对错）。","动机：构念核对（R9）发现 P07 此前全是搭车格子——分数看着有，实际没有任何测验直接考\"自查\"这个行为。"]},{"heading":"数据","bullets":["零新增标注：复用 P08 的 delegate（ceval 0-shot / mmlu_pro / agieval / mtb_problem_solving）和同一份难度分层 item_list（data/p08_calibration/item_list_v1.txt，550 题），P07/P08 同题可比。"]},{"heading":"任务与判分","bullets":["第一轮：delegate 原生出题（prediction 阶段）；第二轮：extract 阶段把原对话 + 模型自己的第一轮回答 + 固定复查指令再发给被测模型本身（harness 会把被测模型名写进 adapter.model_under_test；传给 extract 的 client 是抽取模型，不是被测模型）。","两轮答案都用 delegate 自己的抽取和判分。headline score_10 = 10×[0.5×改对率 + 0.5×(1−改错率)]，两项都以第一轮状态为条件，构造上与第一轮正确率解耦。extra_metrics 含 r1/r2 accuracy、net_gain、change_rate、逐来源分解。"]},{"heading":"为什么不能复用以前跑过的预测","bullets":["以前各 benchmark 的全量预测只有\"第一轮答案\"，而 P07 测的是第二轮行为——模型看到自己的第一轮回答后改不改、改对还是改错。第二轮必须以第一轮的原始回复作为对话历史现场再调一次被测模型，这个交互在旧预测里不存在，也没法离线补造（换措辞、换上下文都算换协议）。所以旧全量分数只能省下\"第一轮\"这一半成本吗？也不能：为了保证两轮在同一套 prompt/参数/对话格式下发生，第一轮也要在本协议内重跑，否则改答率会混入格式差异。"]},{"heading":"局限与注意","bullets":["每题两次被测模型调用（round 1 + round 2），成本约是普通跑分的 2 倍。","\"复查\"指令措辞固定（中/英各一版）；换措辞就是换协议，对比时注意。","已知现象（文献一致）：多数模型 intrinsic self-correction 改对率低、部分模型改错率不低——低分是真实测量结果，不是 bug。"]}],"file":"p07_selfcheck.md","missing":false}},{"id":"p08_abstention","name":"P08 能力性弃答","confidence":0.85,"metric_family":"composite_0_to_10","score_direction":"higher_better","source_scope":"repo_eval","rationale":"公开弃答数据集（UMWP/TreeCut）测对不可答题能否说“不会”；识别并按格式声明带少量指令遵循成分故 P01 占 0.15。与 p08_calibration 共同构成 P08 两半证据。","profile":{"one_liner":"为 P08（置信度校准与弃答）专门设计的两个自建测验——一个测\"自信地教错有多少\"，一个测\"不会的题敢不敢说不会\"。教育产品里这是\"模型会不会一本正经误导学生\"的直接代理。","sections":[{"heading":"出处与背景","bullets":["本仓库自建，设计文档 doc/p08_calibration_eval_plan_2026-07-11.md（v1 零标注方案）。","动机：P08 此前完全无覆盖；方案刻意选择零人工标注路线——复用已有 exact-match benchmark 的对错信号。"]},{"heading":"数据","bullets":["p08_calibration：550 题，从 ceval / mmlu_pro / agieval / mtb_problem_solving 分层抽样（data/p08_calibration/item_list_v1.txt，抽样器 build_p08_item_list.py），答题时要求附带 verbalized confidence（ceval 走 0-shot 以容纳置信度后缀）。","p08_abstention：UMWP（不可答数学应用题——删掉必要条件后的题）等公开集，fetch_ev <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const app = document.getElementById('app');

/* ---------- indexes ---------- */
const abilityBy = {}; D.abilities.forEach(a => abilityBy[a.p_code] = a);
const benchBy = {}; D.benchmarks.forEach(b => benchBy[b.id] = b);
const modelBy = {}; D.models.forEach(m => modelBy[m.key] = m);
const groupLabel = {}; D.groups.forEach(g => groupLabel[g.id] = g.label);
const coveredP = D.abilities.map(a => a.p_code).filter(p => !D.meta.uncovered_p.includes(p));

/* --- R22 缺测替代，页面内复算 ------------------------------------------
   聚合脚本只给 5 个发布面板模型铺替代行（PANEL_MODEL_KEYS），外围模型缺格
   就直接不进分母。这里把同一条规则复算一遍，好让页面能把它铺到全部模型，
   而不必改上游产物。规则本身一字不改：某格已测面 >= IMPUTE_MIN_FACES 时，
   取该格最低分顶替，标 imputed。
   'panel' 档复算的结果与已发布的 09_atomic_p_scores.jsonl 逐行一致（见
   console 的自检输出），所以两档走的是同一段代码，只有铺给谁不同。      */
const MEASURED = D.evidence.filter(r => !r.imp);
const cellFaces = {};
MEASURED.forEach(r => {
  const k = [r.p, r.f, r.b, r.sd].join('');
  (cellFaces[k] ||= {})[r.m] = r;
});

function buildScores(){
  const targets = D.panel;
  const rows = MEASURED.slice();
  Object.values(cellFaces).forEach(faces => {
    const keys = Object.keys(faces);
    if (keys.length < D.meta.impute_min_faces) return;
    const minM = keys.reduce((a, b) => faces[a].s <= faces[b].s ? a : b);
    const t = faces[minM];
    targets.forEach(m => {
      if (faces[m]) return;
      rows.push(Object.assign({}, t, {m: m, imp: true, impm: minM, impf: keys.length}));
    });
  });
  const acc = {};
  rows.forEach(r => {
    const s = (acc[r.m + '|' + r.p] ||= {facets: {}, n: 0, imp: 0, impw: 0, w: 0, b: new Set()});
    const f = (s.facets[r.f] ||= {ws: 0, w: 0});
    f.ws += r.s * r.eff; f.w += r.eff;
    s.n++; s.w += r.eff; s.b.add(r.b);
    if (r.imp){ s.imp++; s.impw += r.eff; }
  });
  const scores = {};
  Object.keys(acc).forEach(k => {
    const s = acc[k], parts = k.split('|');
    const facets = {}, means = [];
    Object.keys(s.facets).forEach(id => {
      const f = s.facets[id];
      if (f.w){ facets[id] = f.ws / f.w; means.push(f.ws / f.w); }
    });
    if (!means.length) return;
    scores[k] = {
      m: parts[0], p: parts[1], s: means.reduce((a, b) => a + b, 0) / means.length,
      facets: facets, n: s.n, imp: s.imp, impw: s.w ? s.impw / s.w : 0,
      nf: means.length, b: [...s.b].sort()
    };
  });
  const groups = {};
  Object.keys(scores).forEach(k => {
    const r = scores[k], g = abilityBy[r.p].group;
    const slot = (groups[r.m + '|' + g] ||= {sum: 0, n: 0});
    slot.sum += r.s; slot.n++;
  });
  Object.keys(groups).forEach(k => groups[k] = {s: groups[k].sum / groups[k].n, np: groups[k].n});
  return {scores: scores, groups: groups, evidence: rows};
}

let scoreOf, groupScoreOf, evByModelP, evByBench;
function applyMode(){
  const built = buildScores();
  scoreOf = built.scores;
  groupScoreOf = built.groups;
  evByModelP = {}; evByBench = {};
  built.evidence.forEach(r => {
    (evByModelP[r.m + '|' + r.p] ||= []).push(r);
    (evByBench[r.b] ||= []).push(r);
  });
}
applyMode();

// Self-check: the rebuild must reproduce the committed artifact exactly.
(() => {
  let worst = 0, n = 0;
  D.scores.forEach(r => {
    const mine = scoreOf[r.m + '|' + r.p];
    if (mine){ worst = Math.max(worst, Math.abs(mine.s - r.s)); n++; }
  });
  // 已发布的 score_10 本身是 4 位小数，所以 5e-5 是这个比对的理论下限，
  // 阈值只能卡在它之上；真正的逻辑错误会差好几个数量级。
  const msg = `R22 复算自检：${n}/${D.scores.length} 行比对，最大偏差 ${worst.toExponential(1)}`;
  (worst < 2e-4 && n === D.scores.length ? console.log : console.error)(msg);
})();
const benchToCells = {};     // benchmark -> [{p_code,facet,subdimension,weight}]
D.abilities.forEach(a => a.facets.forEach(f => f.cells.forEach(c => {
  (benchToCells[c.benchmark_id] ||= []).push({
    p_code: a.p_code, p_name: a.p_name, facet_id: f.facet_id,
    facet_name: f.facet_name, subdimension: c.subdimension, weight: c.weight
  });
})));

const fullPanel = D.models.filter(m => m.full_panel).map(m => m.key);
const SERIES = ['--s1', '--s2', '--s3'];

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx = (v, n = 2) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : Number(v).toFixed(n);
const mName = k => (modelBy[k] || {}).display || k;

// Sequential 0-10 -> ramp class; the steps themselves live in CSS so the
// dark-mode ramp can run the opposite direction without a re-render.
function heatClass(v){
  if (v === null || v === undefined) return '';
  return 'h' + Math.max(0, Math.min(9, Math.floor(v)));
}
function markers(row){
  if (!row) return '';
  let out = '';
  if (row.nf < (abilityBy[row.p]?.facets.length || 0)) out += '<span class="mark" title="并非所有 facet 都有证据">◐</span>';
  if (row.imp > 0) out += `<span class="mark" title="含 ${row.imp} 条替代值（占有效权重 ${(row.impw*100).toFixed(0)}%）">※</span>`;
  return out;
}
function go(hash){ location.hash = hash; }
function pLink(p){ return `<span class="link" onclick="go('#/p/${p}')">${p} ${esc(abilityBy[p]?.p_name || '')}</span>`; }
function bLink(b){ return `<span class="link" onclick="go('#/bench/${encodeURIComponent(b)}')">${esc(benchBy[b]?.name || b)}</span>`; }
function mLink(m){ return `<span class="link" onclick="go('#/model/${encodeURIComponent(m)}')">${esc(mName(m))}</span>`; }
// Real measured coverage, independent of whichever impute mode is active.
const measuredP = {};
MEASURED.forEach(r => (measuredP[r.m] ||= new Set()).add(r.p));

function covBadge(m){
  const mm = modelBy[m];
  const real = (measuredP[m] || new Set()).size;
  const now = coveredP.filter(p => scoreOf[m + '|' + p]).length;
  if (now > real){
    // Don't let imputation dress a thinly-measured model up as fully covered.
    return `<span class="badge warn" title="实测 ${real} 项，另有 ${now - real} 项完全由缺测替代值构成">实测 ${real}/${coveredP.length}，替代补至 ${now}</span>`;
  }
  return real >= coveredP.length
    ? `<span class="badge full">全覆盖 ${real}/${coveredP.length}</span>`
    : `<span class="badge warn">${real}/${coveredP.length} 项有证据</span>`;
}

/* ---------- charts ---------- */
function radar(series){
  const R = 168, cx = 250, cy = 210, N = coveredP.length;
  const ang = i => (i / N) * 2 * Math.PI - Math.PI / 2;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  let g = '';
  for (const lvl of [2, 4, 6, 8, 10]){
    const pts = coveredP.map((_, i) => pt(i, R * lvl / 10).map(n => n.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
  }
  g += `<text x="${cx+4}" y="${cy-R+2}" font-size="9" fill="var(--muted)">10</text>`;
  coveredP.forEach((p, i) => {
    const [x, y] = pt(i, R);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const [lx, ly] = pt(i, R + 26);
    const anchor = Math.abs(lx - cx) < 12 ? 'middle' : (lx > cx ? 'start' : 'end');
    g += `<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--ink-2)"
            style="cursor:pointer" onclick="go('#/p/${p}')"><title>${esc(abilityBy[p].p_name)}</title>${p}</text>`;
  });
  series.forEach((s, si) => {
    const col = `var(${SERIES[si % SERIES.length]})`;
    // Missing axes break the ring: draw only contiguous measured runs, never
    // interpolate a model's uncovered ability as if it scored there.
    const vals = coveredP.map(p => { const r = scoreOf[s.key + '|' + p]; return r ? r.s : null; });
    let run = [];
    const flush = () => {
      if (run.length > 1){
        g += `<polyline points="${run.map(a => a.join(',')).join(' ')}" fill="none"
                stroke="${col}" stroke-width="2" stroke-linejoin="round" opacity=".92"/>`;
      }
      run = [];
    };
    if (vals.every(v => v !== null)){
      const pts = vals.map((v, i) => pt(i, R * v / 10).map(n => n.toFixed(1)));
      // Fill only a lone series - stacked translucent fills mix into a muddy
      // third hue and stop reading as either model.
      const fill = series.length === 1 ? `fill="${col}" fill-opacity=".13"` : 'fill="none"';
      g += `<polygon points="${pts.map(a => a.join(',')).join(' ')}" ${fill}
              stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    } else {
      vals.forEach((v, i) => { if (v === null) flush(); else run.push(pt(i, R * v / 10).map(n => n.toFixed(1))); });
      flush();
    }
    vals.forEach((v, i) => {
      if (v === null) return;
      const [x, y] = pt(i, R * v / 10);
      // A mostly-imputed point is not a measurement of this model - draw it
      // hollow so it never reads as one at a glance.
      const row = scoreOf[s.key + '|' + coveredP[i]];
      const mostlyImputed = row && row.impw >= 0.5;
      const note = mostlyImputed ? `（其中 ${(row.impw * 100).toFixed(0)}% 为替代值，非实测）` : '';
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"
              fill="${mostlyImputed ? 'var(--surface)' : col}" stroke="${col}" stroke-width="2"
              ><title>${esc(mName(s.key))} · ${coveredP[i]} ${esc(abilityBy[coveredP[i]].p_name)}: ${fx(v)}${note}</title></circle>`;
    });
  });
  return `<svg viewBox="0 0 500 440" role="img" aria-label="原子能力雷达图">${g}</svg>`;
}

function bars(rows, maxV = 10){
  return rows.map(r => `
    <tr>
      <td>${mLink(r.key)}
        ${r.facetCov && r.facetCov.have < r.facetCov.total
          ? `<span class="badge warn" title="这项能力有 ${r.facetCov.total} 个 facet，该模型只测了 ${r.facetCov.have} 个，分数不可与全测模型直接比">仅测 ${r.facetCov.have}/${r.facetCov.total} facet</span>`
          : ''}
        ${r.impShare > 0
          ? `<span class="badge warn" title="这一分数里有 ${(r.impShare*100).toFixed(0)}% 的有效权重来自缺测替代值，不是真实测量">替代 ${(r.impShare*100).toFixed(0)}%</span>`
          : ''}
        ${r.full ? '' : '<span class="badge">全库 ' + modelBy[r.key].p_count + '/' + coveredP.length + '</span>'}</td>
      <td style="width:52%"><div class="track" title="${esc(r.tip || '')}">
        <div class="bar${r.full ? '' : ' hollow'}" style="width:${(r.value / maxV * 100).toFixed(1)}%"></div></div></td>
      <td class="num">${fx(r.value)}${r.mark || ''}</td>
    </tr>`).join('');
}

/* ---------- view: overview ---------- */
let ovSort = {key: '_avg', dir: -1};
function viewOverview(){
  const rowsFor = list => list.map(m => {
    const cells = coveredP.map(p => {
      const r = scoreOf[m.key + '|' + p];
      return r
        ? `<td class="num cell"><span class="heat ${heatClass(r.s)}"
             title="${esc(m.display)} · ${p} ${esc(abilityBy[p].p_name)}: ${fx(r.s)}（${r.n} 条证据）">${fx(r.s, 1)}</span>${markers(r)}</td>`
        : `<td class="num cell"><span class="mark" title="未覆盖">·</span></td>`;
    }).join('');
    const gcells = D.groups.map(g => {
      const r = groupScoreOf[m.key + '|' + g.id];
      const last = g.id === D.groups[D.groups.length - 1].id;
      return `<td class="num${last ? ' gsep' : ''}">${r ? fx(r.s, 1) : '<span class="mark">·</span>'}</td>`;
    }).join('');
    return `<tr><td>${mLink(m.key)}<br>${covBadge(m.key)}</td>${gcells}${cells}</tr>`;
  }).join('');

  const sorted = list => {
    const k = ovSort.key;
    return [...list].sort((a, b) => {
      const va = k === '_avg' ? a.p_count : (scoreOf[a.key + '|' + k]?.s ?? -1);
      const vb = k === '_avg' ? b.p_count : (scoreOf[b.key + '|' + k]?.s ?? -1);
      return ovSort.dir === -1 ? vb - va : va - vb;
    });
  };
  const full = sorted(D.models.filter(m => m.full_panel));
  const partial = sorted(D.models.filter(m => !m.full_panel));

  app.innerHTML = `
    <h2>总览</h2>
    <p class="sub">模型 × 原子能力得分矩阵（0–10）。列头可排序；点任意模型名或能力编号进入详情。
      <span class="mark">◐</span> 该能力并非所有 facet 都有证据，<span class="mark">※</span> 含缺测替代值。</p>
    <div class="stats">
      <div class="stat"><b>${D.meta.n_models}</b><span>已测模型</span></div>
      <div class="stat"><b>${D.meta.full_panel_size}</b><span>全覆盖模型</span></div>
      <div class="stat"><b>${D.meta.n_abilities_covered}/${D.meta.n_abilities_total}</b><span>有数据的原子能力</span></div>
      <div class="stat"><b>${D.meta.n_benchmarks}</b><span>benchmark 取分维度来源</span></div>
      <div class="stat"><b>${D.meta.n_evidence}</b><span>条证据行</span></div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th class="sortable" data-k="_avg">模型</th>
          ${D.groups.map((g, i) => `<th class="num${i === D.groups.length - 1 ? ' gsep' : ''}" title="${esc(g.label)}">${g.id}</th>`).join('')}
          ${coveredP.map(p => `<th class="num sortable" data-k="${p}" title="${esc(abilityBy[p].p_name)}">${p}</th>`).join('')}
        </tr></thead>
        <tbody>
          <tr class="rowsep"><td colspan="${1 + D.groups.length + coveredP.length}">
            发布面板 · ${D.panel.length} 个模型，${coveredP.length} 项能力都有分；缺测的格按 R22 用该格最低分顶替，徽章里的「实测 n」才是真跑过的项数</td></tr>
          ${rowsFor(full)}
          <tr class="rowsep"><td colspan="${1 + D.groups.length + coveredP.length}">
            部分覆盖 · 覆盖面差异很大，跨行比较前务必看徽章上的覆盖率</td></tr>
          ${rowsFor(partial)}
        </tbody>
      </table>
    </div>
    <p class="foot">大类：${D.groups.map(g => `${g.id} ${esc(g.label)}`).join(' · ')}。
      ${D.meta.uncovered_p.length ? D.meta.uncovered_p.join('、') + ' 目前全库无数据，未列入矩阵。' : ''}</p>`;

  app.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    ovSort = {key: k, dir: ovSort.key === k ? -ovSort.dir : -1};
    viewOverview();
  });
}

/* ---------- view: model ---------- */
let picked = [];
let openP = null;
function viewModel(){
  if (!picked.length) picked = fullPanel.slice(0, 2);
  const chips = D.models.map(m => {
    const i = picked.indexOf(m.key);
    const dot = i >= 0 ? `<span class="dot" style="background:var(${SERIES[i]})"></span>` : '';
    // Count measured abilities, not scored ones - imputed P scores must not
    // inflate the chip past what the model was actually run on.
    const real = (measuredP[m.key] || new Set()).size;
    return `<button class="chip${real >= coveredP.length ? '' : ' partial'}" aria-pressed="${i >= 0}" data-m="${esc(m.key)}"
      title="实测 ${real}/${coveredP.length} 项原子能力">
      ${dot}${esc(m.display)} <span class="cnt">${real}/${coveredP.length}</span></button>`;
  }).join('');

  const series = picked.map(k => ({key: k}));
  const legend = picked.map((k, i) => {
    const real = (measuredP[k] || new Set()).size;
    const now = coveredP.filter(p => scoreOf[k + '|' + p]).length;
    const cov = now > real
      ? `实测 ${real}/${coveredP.length}，其余为替代值（空心点＝该项过半为替代值，非实测）`
      : `${real}/${coveredP.length} 项有证据${real >= coveredP.length ? '' : '（缺口处断线）'}`;
    return `<span><i style="background:var(${SERIES[i]})"></i>${esc(mName(k))}
      <span class="cov">${cov}</span></span>`;
  }).join('');

  const primary = picked[0];
  const list = coveredP.map(p => {
    const r = scoreOf[primary + '|' + p];
    const a = abilityBy[p];
    if (!r) return `<div class="prow" style="opacity:.45" onclick="go('#/p/${p}')">
      <div class="name"><b>${p} ${esc(a.p_name)}</b><span>${esc(a.definition)}</span></div>
      <div class="val">—</div></div>`;
    return `<div class="prow" data-p="${p}">
        <div class="name"><b>${p} ${esc(a.p_name)}</b><span>${esc(a.definition)}</span></div>
        <div class="track" style="width:110px;flex:none"><div class="bar" style="width:${(r.s * 10).toFixed(1)}%"></div></div>
        <div class="val">${fx(r.s)}</div><div style="width:26px">${markers(r)}</div>
      </div>${openP === p ? drill(primary, p) : ''}`;
  }).join('');

  app.innerHTML = `
    <h2>模型视图</h2>
    <p class="sub">最多叠加 3 个模型。部分覆盖的模型缺口处断线，不会把没测过的能力画成 0。点右侧任一能力展开它的证据构成。</p>
    <div class="chips" id="chips">${chips}</div>
    <div class="grid2">
      <div class="card radarwrap">
        <div class="radarwrap">${radar(series)}</div>
        <div class="legend">${legend}</div>
      </div>
      <div class="card">
        <h3>${esc(mName(primary))} 的能力得分 ${covBadge(primary)}</h3>
        <div>${list}</div>
        <p class="foot">数值为 0–10 归一分。表格视图见「总览」，同一批数据。</p>
      </div>
    </div>`;

  app.querySelectorAll('#chips .chip').forEach(c => c.onclick = () => {
    const k = c.dataset.m, i = picked.indexOf(k);
    if (i >= 0){ if (picked.length > 1) picked.splice(i, 1); }
    else { if (picked.length >= 3) picked.shift(); picked.push(k); }
    openP = null; viewModel();
  });
  app.querySelectorAll('.prow[data-p]').forEach(r => r.onclick = () => {
    openP = openP === r.dataset.p ? null : r.dataset.p; viewModel();
  });
}

function drill(model, p){
  const a = abilityBy[p];
  const rows = evByModelP[model + '|' + p] || [];
  const byFacet = {};
  rows.forEach(r => (byFacet[r.f] ||= []).push(r));
  const sc = scoreOf[model + '|' + p];
  const groups = a.facets.map(f => {
    const rs = byFacet[f.facet_id] || [];
    if (!rs.length) return `<div class="facetgrp"><h4>${esc(f.facet_name)} <span class="badge">无证据</span></h4>
      <p>${esc(f.facet_description)}</p></div>`;
    return `<div class="facetgrp">
      <h4>${esc(f.facet_name)} <span class="badge">facet 分 ${fx(sc.facets[f.facet_id])}</span></h4>
      <p>${esc(f.facet_description)}</p>
      <table><thead><tr>
        <th>benchmark · 取分维度</th><th class="num">相关</th><th class="num">置信</th>
        <th class="num">有效</th><th class="num">原始值</th><th class="num">0–10 分</th>
      </tr></thead><tbody>
      ${rs.map(r => r.imp
        ? `<tr class="imputed">
            <td>${bLink(r.b)} · ${esc(r.sd)}
              <br><b class="untested">未测过</b>
              <span style="color:var(--muted);font-size:11.5px">
                ——计分时按 R22 规则记为该格已测 ${r.impf} 个模型里的最低分（来自 ${esc(mName(r.impm))}），这不是本模型的成绩</span></td>
            <td class="num">${fx(r.rel)}</td><td class="num">${fx(r.conf)}</td><td class="num">${fx(r.eff)}</td>
            <td class="num untested">未测过</td>
            <td class="num">${fx(r.s)}<span class="mark" title="替代值，非实测">※</span></td>
          </tr>`
        : `<tr>
            <td>${bLink(r.b)} · ${esc(r.sd)}
              <br><span style="color:var(--muted);font-size:11.5px">${esc(benchBy[r.b]?.profile.one_liner || '')}</span></td>
            <td class="num">${fx(r.rel)}</td><td class="num">${fx(r.conf)}</td><td class="num">${fx(r.eff)}</td>
            <td class="num">${fx(r.raw, 3)}</td><td class="num"><b>${fx(r.s)}</b></td>
          </tr>`).join('')}
      </tbody></table></div>`;
  }).join('');
  const nImp = rows.filter(r => r.imp).length;
  return `<div class="drill">
    <div class="defn"><b>${p} ${esc(a.p_name)}</b>——${esc(a.definition)}
      ${a.single_source ? '<span class="badge warn">单源测量</span>' : ''}</div>
    ${nImp ? `<div class="notice" style="margin-bottom:12px">
      这项分数里有 <b>${nImp} 条来自缺测替代</b>，占有效权重 <b>${(sc.impw * 100).toFixed(0)}%</b>。
      下表中标黄「未测过」的行，${esc(mName(model))} <b>并没有跑过</b>——那一格按 R22 规则记了别的模型的最低分，
      只为让 P 分有个保守下界，不代表这个模型在该维度上的任何实测表现。</div>` : ''}
    ${groups}
    <p class="foot">有效权重 = 相关度 × 置信度；facet 内按有效权重加权平均，P 分为各 facet 的等权平均。
      <span class="link" onclick="go('#/p/${p}')">查看这项能力的完整说明与全模型排名 →</span></p>
  </div>`;
}

/* ---------- view: ability ---------- */
let curP = null;
function viewAbility(){
  if (!curP || !abilityBy[curP]) curP = coveredP[0];

  // 边界口径 titles look like "P03 / P04" or "P05 与 P06/P17" - match the P code as a token.
  const bounds = D.boundaries.filter(b => new RegExp(curP + '\\b').test(b.title));

  const facetBlocks = a.facets.map(f => `
    <div class="facetgrp">
      <h4>${esc(f.facet_name)}${f.coverage_gap ? ' <span class="badge warn">覆盖缺口</span>' : ''}</h4>

        ${f.cells.map(c => {

      ${f.revision_rationale ? `<details><summary>裁决原文（P 编号为旧制，R20 前）</summary>

      // Facet coverage *within this P* is the honest caveat on a ranking: a model
      // scored on one easy facet can outrank one measured on all three.
      facetCov: {have: x.row.nf, total: a.facets.length},
      impShare: x.row.impw,
      tip: Object.entries(x.row.facets).map(([k, v]) => `${a.facets.find(f => f.facet_id === k)?.facet_name || k}: ${fx(v)}`).join(' · ')

  app.innerHTML = `
    <h2>原子能力视图</h2>
    <p class="sub">这项能力是什么、怎么测的、谁做得好。</p>
    <div class="toolbar"><select id="psel">${opts}</select>
      <span class="badge">${a.group} ${esc(groupLabel[a.group] || '')}</span>
      <span class="badge">${esc(a.model_type)}</span>
      ${a.single_source ? '<span class="badge warn">单源直接测量</span>' : ''}
      ${D.meta.uncovered_p.includes(curP) ? '<span class="badge warn">暂无任何模型数据</span>' : ''}
    </div>
    <div class="card">
      <h3>它是什么</h3>
      <p style="margin:0 0 12px"><b>${curP} ${esc(a.p_name)}</b>——${esc(a.definition)}</p>
      ${bounds.length ? `<h3 style="margin-top:14px">与相邻能力的边界</h3>
        <ul style="margin:0;padding-left:18px;color:var(--ink-2);font-size:12.5px">
        ${bounds.map(b => `<li><b>${esc(b.title)}</b>：${esc(b.text)}</li>`).join('')}</ul>` : ''}
      ${a.rationale ? `<details><summary>能力级裁决原文（P 编号为旧制，R20 前）</summary>
        <div class="body stale">${esc(a.rationale)}</div></details>` : ''}
    </div>
    <div class="card"><h3>怎么测的</h3>${facetBlocks}
      <p class="foot">相关度五档由 R25 规则推导（1.0 完全一致 / 0.8 强 / 0.5 中等 / 0.2 弱）；
        置信度起点 1.0，判分方式与数据质量各可扣 0.15。区分度 n / sd 取自 13 号映射效度检查。</p>
    </div>
    <div class="card"><h3>谁做得好</h3>
      ${ranked.length ? `<table><tbody>${bars(ranked)}</tbody></table>
        <p class="foot">实心条 = 全覆盖面板模型，描边条 = 部分覆盖模型。悬停条形看 facet 拆解。
          <b>排名要连着覆盖徽章一起读</b>：P 分是各 facet 的等权平均，只测了部分 facet 的模型等于跳过了没测的那几面，
          与全测模型不在同一量尺上。</p>`
        : '<p class="empty">这项能力目前没有任何模型数据。</p>'}
    </div>`;

  document.getElementById('psel').onchange = e => go('#/p/' + e.target.value);
}

/* ---------- view: benchmark ---------- */
let curB = null, curSub = null;
function viewBench(){
  if (!curB || !benchBy[curB]) curB = D.benchmarks[0].id;
  const b = benchBy[curB];
  const rows = evByBench[curB] || [];
  const subs = [...new Set(rows.map(r => r.sd))].sort();
  if (!curSub || !subs.includes(curSub)) curSub = subs[0];

  const opts = D.benchmarks.map(x => `<option value="${esc(x.id)}" ${x.id === curB ? 'selected' : ''}>${esc(x.id)} — ${esc(x.name)}</option>`).join('');
  const cells = benchToCells[curB] || [];

  // A benchmark's leaderboard lists only models actually run on it. Imputed
  // rows carry the *donor* model's raw value, so showing them here would put a
  // number next to a model that was never evaluated - exactly the fabrication
  // this view must not commit. They are listed separately as 未测过.
  const board = rows.filter(r => r.sd === curSub && !r.imp);
  const seen = new Set();
  const uniq = board.filter(r => { if (seen.has(r.m)) return false; seen.add(r.m); return true; })
                    .sort((x, y) => y.s - x.s);
  const untested = D.models.map(m => m.key).filter(k => !seen.has(k));
  const v = D.validity[curB + '||' + curSub] || {};

  app.innerHTML = `
    <h2>Benchmark 视图</h2>
    <p class="sub">它测什么、我们给了多少置信度、喂给了哪些原子能力、所有模型在它上面的表现。</p>
    <div class="toolbar"><select id="bsel">${opts}</select></div>
    <div class="card">
      <h3>${esc(b.name)} <span style="color:var(--muted);font-weight:400">${esc(b.id)}</span></h3>
      ${b.profile.one_liner ? `<p class="oneline">${esc(b.profile.one_liner)}</p>` : ''}
      ${b.profile.missing ? '<span class="badge warn">档案待补 —— 下方仅有摘要，无完整 profile 文档</span>' : ''}
      <div class="kv">
        <span class="tag">置信权重 ${fx(b.confidence)}</span>
        <span class="tag">${esc(b.metric_family)}</span>
        <span class="tag">${esc(b.score_direction)}</span>
        <span class="tag">${esc(b.source_scope)}</span>
        ${b.profile.file ? `<span class="tag">doc/benchmark_profiles/${esc(b.profile.file)}</span>` : ''}
      </div>
      ${b.profile.sections.length ? `<div class="secs">${b.profile.sections.map(s => `
        <section><h4>${esc(s.heading)}</h4><ul>${s.bullets.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>` : ''}
      ${b.rationale ? `<details><summary>置信权重的定权理由（含 R2x 裁决记号）</summary>
        <div class="body stale">${esc(b.rationale)}</div></details>` : ''}
    </div>
    <div class="card"><h3>喂给了哪些原子能力</h3>
      ${cells.length ? `<table><thead><tr><th>取分维度</th><th>原子能力 · facet</th><th class="num">相关</th><th class="num">有效</th></tr></thead><tbody>
        ${cells.map(c => `<tr>
          <td>${esc(c.subdimension)}</td>
          <td>${pLink(c.p_code)} · ${esc(c.facet_name)}</td>
          <td class="num">${fx(c.weight)}</td>
          <td class="num">${b.confidence ? fx(c.weight * b.confidence) : '—'}</td>
        </tr>`).join('')}</tbody></table>`
        : '<p class="empty">这个 benchmark 在 v6 映射里没有挂载格。</p>'}
    </div>
    <div class="card">
      <h3>模型表现</h3>
      <div class="toolbar"><select id="ssel">${subs.map(s => `<option ${s === curSub ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <span class="badge">实测 n=${uniq.length}</span>
        <span class="badge">均分 ${fx(v.mean)}</span>
        <span class="badge">sd ${fx(v.sd)}</span>
        ${(v.flags || []).map(f => `<span class="badge warn">${esc(f)}</span>`).join('')}
      </div>
      <table><thead><tr><th>模型</th><th class="num">原始值</th><th></th><th class="num">0–10 分</th></tr></thead><tbody>
        ${uniq.map(r => `<tr>
          <td>${mLink(r.m)}</td>
          <td class="num">${fx(r.raw, 3)}</td>
          <td style="width:42%"><div class="track"><div class="bar${modelBy[r.m].full_panel ? '' : ' hollow'}"
            style="width:${(r.s * 10).toFixed(1)}%"></div></div></td>
          <td class="num"><b>${fx(r.s)}</b></td>
        </tr>`).join('')}
      </tbody></table>
      ${untested.length ? `<p class="foot" style="margin-top:12px">
        <b class="untested">未测过这一维度的 ${untested.length} 个模型</b>：${untested.map(k => mLink(k)).join('、')}。
        榜上只放真跑过的结果。</p>` : ''}
      <p class="foot">原始值为该 benchmark 的原生指标（${esc(b.metric_family)}），0–10 分是归一后进入映射的值。本榜<b>只列实际跑过的模型</b>，缺测替代值不进这里。
        ${v.variance_restricted ? '⚠️ 13 号效度检查判定这一维度<b>方差受限</b>，当前模型集上排名信息量低。' : ''}</p>
    </div>`;

  document.getElementById('bsel').onchange = e => { curSub = null; go('#/bench/' + encodeURIComponent(e.target.value)); };
  document.getElementById('ssel').onchange = e => { curSub = e.target.value; viewBench(); };
}

/* ---------- search ---------- */
const index = [
  ...D.models.map(m => ({label: m.display, kind: '模型', hash: '#/model/' + encodeURIComponent(m.key), t: m.display + ' ' + m.key})),
  ...D.abilities.map(a => ({label: a.p_code + ' ' + a.p_name, kind: '原子能力', hash: '#/p/' + a.p_code, t: a.p_code + a.p_name + a.definition})),
  ...D.benchmarks.map(b => ({label: b.name + ' · ' + b.id, kind: 'Benchmark', hash: '#/bench/' + encodeURIComponent(b.id), t: b.id + b.name + b.profile.one_liner}))
];
const qEl = document.getElementById('q'), qrEl = document.getElementById('qr');
let hits = [], sel = 0;
qEl.oninput = () => {
  const q = qEl.value.trim().toLowerCase();
  if (!q){ qrEl.classList.remove('open'); return; }
  hits = index.filter(x => x.t.toLowerCase().includes(q)).slice(0, 12);
  sel = 0;
  qrEl.innerHTML = hits.length
    ? hits.map((h, i) => `<div class="${i === 0 ? 'sel' : ''}" data-i="${i}">${esc(h.label)}<span class="kind">${h.kind}</span></div>`).join('')
    : '<div style="color:var(--muted)">无匹配</div>';
  qrEl.classList.add('open');
  qrEl.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => { go(hits[+d.dataset.i].hash); qEl.value = ''; qrEl.classList.remove('open'); });
};
qEl.onkeydown = e => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
    qrEl.querySelectorAll('div[data-i]').forEach((d, i) => d.classList.toggle('sel', i === sel));
  } else if (e.key === 'Enter'){
    go(hits[sel].hash); qEl.value = ''; qrEl.classList.remove('open');
  } else if (e.key === 'Escape'){ qrEl.classList.remove('open'); }
};
document.addEventListener('click', e => { if (!e.target.closest('.search')) qrEl.classList.remove('open'); });

/* ---------- theme ---------- */
const themeBtn = document.getElementById('theme');
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', next);
  render();
};

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#\/?/, '');
  const [view, arg] = h.split('/');
  let active = 'overview';
  if (view === 'model'){ active = 'model'; if (arg && modelBy[decodeURIComponent(arg)]){ const k = decodeURIComponent(arg); if (!picked.includes(k)) picked = [k]; else picked = [k, ...picked.filter(x => x !== k)].slice(0, 3); openP = null; } viewModel(); }
  else if (view === 'p'){ active = 'ability'; if (arg) curP = arg; viewAbility(); }
  else if (view === 'bench'){ active = 'bench'; if (arg) curB = decodeURIComponent(arg); viewBench(); }
  else viewOverview();
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === active)));
  window.scrollTo({top: 0});
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  const v = b.dataset.view;
  go(v === 'overview' ? '#/overview' : v === 'model' ? '#/model/' + encodeURIComponent(picked[0] || fullPanel[0])
     : v === 'ability' ? '#/p/' + (curP || coveredP[0]) : '#/bench/' + encodeURIComponent(curB || D.benchmarks[0].id));
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
