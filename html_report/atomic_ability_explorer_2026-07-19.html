<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgenticEdu Continuum · 教育 AI 原子能力评测</title>
<style>
:root{
  color-scheme: light;
  --plane:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff; --sunken:#efeeea;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e6e5de; --axis:#c3c2b7; --border:rgba(11,11,11,.09);
  --border-2:rgba(11,11,11,.14);
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec;
  --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --warning-ink:#7a5200; --critical:#d03b3b;
  --wash:rgba(42,120,214,.07);
  --sh-1:0 1px 2px rgba(11,11,11,.04);
  --sh-2:0 1px 2px rgba(11,11,11,.05), 0 10px 28px -18px rgba(11,11,11,.30);
  --sh-3:0 2px 6px rgba(11,11,11,.07), 0 18px 44px -22px rgba(11,11,11,.34);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0c0c0c; --surface:#171716; --raised:#1f1f1e; --sunken:#111110;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8d8b85;
  --grid:#2a2a28; --axis:#3d3d3a; --border:rgba(255,255,255,.10);
  --border-2:rgba(255,255,255,.16);
  --s1:#3987e5; --s2:#008300; --s3:#d55181;
  --warning-ink:#fab219;
  --wash:rgba(57,135,229,.12);
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
  --sh-3:0 2px 6px rgba(0,0,0,.55), 0 18px 44px -22px rgba(0,0,0,.95);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0c0c0c; --surface:#171716; --raised:#1f1f1e; --sunken:#111110;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8d8b85;
    --grid:#2a2a28; --axis:#3d3d3a; --border:rgba(255,255,255,.10);
    --border-2:rgba(255,255,255,.16);
    --s1:#3987e5; --s2:#008300; --s3:#d55181;
    --warning-ink:#fab219;
    --wash:rgba(57,135,229,.12);
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
    --sh-3:0 2px 6px rgba(0,0,0,.55), 0 18px 44px -22px rgba(0,0,0,.95);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.62; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit}
::selection{background:var(--wash)}
.link{
  color:var(--s1); cursor:pointer; text-decoration:none;
  border-bottom:1px solid transparent; transition:border-color .12s, color .12s;
}
.link:hover{border-bottom-color:currentColor}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
  padding:11px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap;
}
.brand{
  font-weight:680; letter-spacing:-.018em; white-space:nowrap; font-size:15px;
  display:flex; flex-direction:column; line-height:1.25;
}
.brand small{
  font-weight:400; font-size:10.5px; color:var(--muted);
  letter-spacing:.02em; margin-top:1px;
}
nav{
  display:flex; gap:2px; background:var(--sunken); padding:3px;
  border-radius:10px; border:1px solid var(--border);
}
nav button{
  border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:6px 15px; border-radius:7px; font:inherit; font-size:13px;
  transition:background .14s, color .14s;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{
  background:var(--raised); color:var(--ink); font-weight:620; box-shadow:var(--sh-1);
}
.spacer{flex:1}
.search{position:relative}
.search input{
  width:250px; padding:8px 12px; border-radius:9px;
  border:1px solid var(--border); background:var(--sunken); color:var(--ink);
  font:inherit; font-size:13px; transition:border-color .14s, background .14s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{
  outline:none; border-color:var(--s1); background:var(--raised);
  box-shadow:0 0 0 3px var(--wash);
}
.results{
  position:absolute; top:calc(100% + 6px); right:0; width:340px;
  max-height:360px; overflow:auto; background:var(--raised);
  border:1px solid var(--border-2); border-radius:12px;
  box-shadow:var(--sh-3); padding:5px; display:none; z-index:30;
}
.results.open{display:block}
.results div{
  padding:8px 11px; border-radius:7px; cursor:pointer; font-size:13px;
  display:flex; justify-content:space-between; gap:10px; align-items:center;
}
.results div:hover,.results div.sel{background:var(--wash)}
.results .kind{color:var(--muted); font-size:10.5px; white-space:nowrap}
.iconbtn{
  border:1px solid var(--border); background:var(--sunken); color:var(--ink-2);
  width:36px; height:36px; border-radius:9px; cursor:pointer; font-size:15px;
  transition:background .14s, color .14s;
}
.iconbtn:hover{background:var(--raised); color:var(--ink)}

/* ---------- layout ---------- */
main{max-width:1440px; margin:0 auto; padding:28px 24px 96px}
h2{
  font-size:23px; margin:0 0 5px; letter-spacing:-.022em; font-weight:660;
}
h3{
  font-size:11px; margin:0 0 14px; color:var(--muted); font-weight:640;
  text-transform:uppercase; letter-spacing:.09em;
}
.sub{color:var(--ink-2); font-size:13px; margin:0 0 22px; max-width:80ch}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px 22px; margin-bottom:18px;
  box-shadow:var(--sh-1);
}

/* ---------- stat tiles ---------- */
.stats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px}
.stat{
  position:relative; background:var(--surface); border:1px solid var(--border);
  border-radius:13px; padding:15px 18px 14px; min-width:132px; flex:1;
  box-shadow:var(--sh-1); overflow:hidden;
}
.stat::before{
  content:""; position:absolute; inset:0 auto auto 0; width:100%; height:2px;
  background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--s1) 25%,transparent));
}
.stat b{
  display:block; font-size:27px; font-weight:660; letter-spacing:-.03em;
  line-height:1.15; margin-bottom:2px;
}
.stat span{color:var(--muted); font-size:11.5px; letter-spacing:.01em}

/* ---------- tables ---------- */
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--grid)}
tbody tr:last-child td{border-bottom:0}
th{
  color:var(--muted); font-weight:620; font-size:10.5px; white-space:nowrap;
  text-transform:uppercase; letter-spacing:.07em;
  position:sticky; top:0; background:var(--surface); z-index:2;
  border-bottom:1px solid var(--border-2);
}
th.sortable{cursor:pointer; user-select:none; transition:color .14s}
th.sortable:hover{color:var(--ink)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr{transition:background .1s}
.scroll{
  overflow-x:auto; border:1px solid var(--border); border-radius:14px;
  background:var(--surface); box-shadow:var(--sh-1);
}
.scroll table th:first-child,.scroll table td:first-child{
  position:sticky; left:0; background:var(--surface); z-index:1;
  border-right:1px solid var(--grid); min-width:170px;
}
.scroll table th:first-child{z-index:3}
.scroll tbody tr:hover td{background:var(--wash)}
.scroll tbody tr:hover td:first-child{background:color-mix(in srgb,var(--wash) 100%, var(--surface))}
.rowsep td{
  background:var(--sunken)!important; color:var(--muted); font-size:11px;
  letter-spacing:.04em; padding:7px 11px; border-bottom:1px solid var(--border-2);
}
.gsep{border-right:1px solid var(--border-2)}

/* ---------- heat cells ---------- */
.heat{
  display:inline-block; min-width:42px; padding:4px 8px; border-radius:6px;
  text-align:center; font-variant-numeric:tabular-nums; font-size:12.5px;
  font-weight:560; letter-spacing:-.01em;
}
/* Sequential magnitude ramp. Light mode runs light->dark; dark mode runs the
   other way, so "more" always means "further from the surface" rather than
   darkest-on-dark, which reads as least. */
.h0{background:var(--seq-100);color:#0b0b0b} .h1{background:var(--seq-100);color:#0b0b0b}
.h2{background:var(--seq-200);color:#0b0b0b} .h3{background:var(--seq-200);color:#0b0b0b}
.h4{background:var(--seq-300);color:#0b0b0b} .h5{background:var(--seq-300);color:#0b0b0b}
.h6{background:var(--seq-400);color:#fff}    .h7{background:var(--seq-500);color:#fff}
.h8{background:var(--seq-600);color:#fff}    .h9{background:var(--seq-700);color:#fff}
:root[data-theme="dark"] .h0,:root[data-theme="dark"] .h1{background:var(--seq-700);color:#fff}
:root[data-theme="dark"] .h2,:root[data-theme="dark"] .h3{background:var(--seq-600);color:#fff}
:root[data-theme="dark"] .h4,:root[data-theme="dark"] .h5{background:var(--seq-500);color:#fff}
:root[data-theme="dark"] .h6{background:var(--seq-400);color:#fff}
:root[data-theme="dark"] .h7{background:var(--seq-300);color:#0b0b0b}
:root[data-theme="dark"] .h8{background:var(--seq-200);color:#0b0b0b}
:root[data-theme="dark"] .h9{background:var(--seq-100);color:#0b0b0b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .h0,:root:not([data-theme="light"]) .h1{background:var(--seq-700);color:#fff}
  :root:not([data-theme="light"]) .h2,:root:not([data-theme="light"]) .h3{background:var(--seq-600);color:#fff}
  :root:not([data-theme="light"]) .h4,:root:not([data-theme="light"]) .h5{background:var(--seq-500);color:#fff}
  :root:not([data-theme="light"]) .h6{background:var(--seq-400);color:#fff}
  :root:not([data-theme="light"]) .h7{background:var(--seq-300);color:#0b0b0b}
  :root:not([data-theme="light"]) .h8{background:var(--seq-200);color:#0b0b0b}
  :root:not([data-theme="light"]) .h9{background:var(--seq-100);color:#0b0b0b}
}
td.cell{white-space:nowrap}
td.cell .mark{margin-left:3px}
.mark{color:var(--muted); cursor:help; font-size:11px}
/* the two benchmark-less abilities (P09/P20): present in the grid so the count
   reads as 20, but visibly inert so they never look like a zero score */
th.untestedcol{color:var(--muted); font-weight:520; cursor:help}
td.cell.untestedcol{background:var(--wash)}
td.cell.untestedcol .mark{margin-left:0; font-size:10px; letter-spacing:.02em}

/* ---------- badges ---------- */
.badge{
  display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px;
  border:1px solid var(--border-2); color:var(--ink-2); background:var(--sunken);
  white-space:nowrap; font-weight:520; letter-spacing:.01em;
}
.badge.full{border-color:transparent; background:var(--s2); color:#fff}
.badge.warn{
  border-color:color-mix(in srgb,var(--warning) 55%,transparent);
  background:color-mix(in srgb,var(--warning) 14%,transparent);
  color:var(--warning-ink);
}
.tag{
  display:inline-block; font-size:11px; color:var(--ink-2); background:var(--sunken);
  border:1px solid var(--border); border-radius:6px; padding:3px 9px;
  white-space:nowrap; font-variant-numeric:tabular-nums;
}

/* ---------- bars ---------- */
.track{
  height:9px; border-radius:999px; background:var(--sunken);
  overflow:hidden; min-width:90px; box-shadow:inset 0 0 0 1px var(--border);
}
.bar{height:100%; border-radius:0 4px 4px 0; background:var(--s1)}
.bar.hollow{
  background:transparent; border:1.5px solid var(--s1);
  border-left:0; border-radius:0 4px 4px 0;
}

/* ---------- chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.chip{
  border:1px solid var(--border-2); background:var(--surface); color:var(--ink-2);
  padding:6px 13px; border-radius:999px; cursor:pointer; font:inherit; font-size:12.5px;
  display:inline-flex; align-items:center; gap:7px;
  transition:border-color .14s, background .14s, color .14s;
}
.chip:hover{border-color:var(--axis); background:var(--raised)}
.chip[aria-pressed="true"]{
  background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:560;
}
.chip .dot{width:8px; height:8px; border-radius:50%; flex:none}
.chip.partial{border-style:dashed}
.chip .cnt{color:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .cnt{color:color-mix(in srgb,var(--surface) 70%,transparent)}

/* ---------- two-column ---------- */
.grid2{display:grid; grid-template-columns:minmax(360px,.95fr) minmax(380px,1.2fr); gap:18px; align-items:start}
@media (max-width:1040px){.grid2{grid-template-columns:1fr}}
.radarwrap{display:flex; flex-direction:column; align-items:center}
.radarwrap svg{width:100%; max-width:620px; height:auto; display:block}
svg{max-width:100%; height:auto; display:block}
.legend{
  display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
  margin-top:14px; font-size:12.5px; padding-top:14px;
  border-top:1px solid var(--grid); width:100%;
}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px}
.legend .cov{color:var(--muted); font-size:11px; margin-left:6px}

/* ---------- disclosure ---------- */
details{border-top:1px solid var(--grid); padding:10px 0}
details summary{
  cursor:pointer; color:var(--ink-2); font-size:12.5px; list-style:none;
  display:flex; gap:8px; align-items:center; transition:color .14s;
}
details summary:hover{color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸"; color:var(--muted); transition:transform .16s}
details[open] summary::before{transform:rotate(90deg)}
details .body{padding:10px 0 4px; color:var(--ink-2); font-size:12.5px}
.stale{
  border-left:2px solid var(--warning); padding-left:14px; margin-top:8px;
  color:var(--ink-2); font-size:12.5px;
}
.notice{
  border:1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  background:color-mix(in srgb, var(--warning) 8%, transparent);
  border-radius:11px; padding:12px 16px; margin-bottom:16px;
  font-size:12.5px; color:var(--ink-2); line-height:1.6;
}

/* ---------- ability rows (model view) ---------- */
.prow{
  display:flex; align-items:center; gap:14px; padding:11px 12px;
  border-radius:9px; cursor:pointer; border-bottom:1px solid var(--grid);
  position:relative; transition:background .12s;
}
.prow::before{
  content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
  border-radius:2px; background:var(--s1); opacity:0; transition:opacity .14s;
}
.prow:hover{background:var(--wash)}
.prow:hover::before{opacity:1}
.prow .name{flex:1; min-width:0}
.prow .name b{font-weight:620; font-size:13px}
.prow .name span{
  display:block; color:var(--muted); font-size:11.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.prow .val{
  font-variant-numeric:tabular-nums; font-weight:640; width:46px;
  text-align:right; letter-spacing:-.02em; font-size:14px;
}
.drill{
  background:var(--sunken); border:1px solid var(--border);
  border-radius:11px; padding:14px 16px; margin:4px 0 12px;
}
.drill .defn{color:var(--ink-2); font-size:12.5px; margin-bottom:12px}
.drill table{font-size:12px}
.drill th,.drill td{padding:7px 9px}
.facetgrp{margin-bottom:14px}
.facetgrp:last-child{margin-bottom:0}
.facetgrp h4{
  margin:0 0 5px; font-size:12.5px; font-weight:640;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.facetgrp p{margin:0 0 8px; color:var(--muted); font-size:11.5px}

/* ---------- 能力不具备记 0 分 / 未测过 ---------- */
tr.capzero td{color:var(--muted)}
tr.capzero{
  background:repeating-linear-gradient(135deg,transparent,transparent 6px,var(--grid) 6px,var(--grid) 7px);
}
tr.untestedrow td{color:var(--muted); opacity:.85}
.untested{color:var(--warning-ink); font-weight:620}

/* ---------- profile card ---------- */
.kv{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 16px}
.secs{columns:2 310px; column-gap:30px}
.secs section{break-inside:avoid; margin-bottom:16px}
.secs h4{
  margin:0 0 6px; font-size:10.5px; font-weight:640; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em;
}
.secs ul{margin:0; padding-left:18px; color:var(--ink-2); font-size:12.5px}
.secs li{margin-bottom:4px}
.oneline{font-size:15px; line-height:1.55; margin:0 0 12px; letter-spacing:-.01em}

/* ---------- misc ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
select{
  padding:7px 11px; border-radius:9px; border:1px solid var(--border-2);
  background:var(--surface); color:var(--ink); font:inherit; font-size:13px;
  cursor:pointer; transition:border-color .14s;
}
select:hover{border-color:var(--axis)}
select:focus{outline:none; border-color:var(--s1); box-shadow:0 0 0 3px var(--wash)}
.empty{color:var(--muted); padding:28px; text-align:center; font-size:13px}
.foot{color:var(--muted); font-size:11.5px; margin-top:12px; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">AgenticEdu Continuum<small>教育 AI 原子能力评测 · v6 · R25 · 2026-07-19</small></div>
  <nav id="nav">
    <button data-view="overview">总览</button>
    <button data-view="model">模型</button>
    <button data-view="ability">原子能力</button>
    <button data-view="bench">Benchmark</button>
  </nav>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="搜模型 / 能力 / benchmark" autocomplete="off">
    <div class="results" id="qr"></div>
  </div>
  <button class="iconbtn" id="theme" title="切换深浅色">◐</button>

<script id="payload" type="application/json">{"meta":{"version":"v6-R25","date":"2026-07-19","source_dir":"reports/atomic_ability_rebenchmark_2026-07-08","n_models":23,"n_abilities_total":20,"n_abilities_covered":18,"n_benchmarks":36,"n_evidence":710,"full_panel_size":5,"uncovered_p":["P09","P20"],"n_zero_cells":36,"n_untested_cells":54},"panel":["minimax-m3","minimax-m2.7","deepseek-v4-pro","glm-5.2","doubao-seed-2-0-pro"],"groups":[{"id":"SRG","label":"任务理解与多模态交互"},{"id":"FDR","label":"知识推理与可靠执行"},{"id":"LAD","label":"学习诊断与教育测评"},{"id":"CLM","label":"学习者建模与适应性教学"},{"id":"CEG","label":"教育安全与学术规范"}],"abilities":[{"p_code":"P01","p_name":"指令与约束遵循","group":"SRG","definition":"按显式指令和格式/行为约束产出","model_type":"reflective","rationale":"IFEval 规则判分为唯一直接测量(单源)。R20 摘除全部搭车格:选择题格式遵循与弃答约束遵循均无可分离的指令遵循信号,牵强证据宁缺勿滥。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"core","facet_name":"指令与约束遵循","facet_description":"按显式指令和格式/行为约束产出","revision_rationale":"R20(2026-07-18): 仅保留 ifeval 直接测量。agieval/ceval/mmlu_pro 三格名为格式遵循实为 overall accuracy(知识方差污染,纯格式指标又近天花板);p08_abstention 判弃答含散文兜底短语,分数中无可分离的指令遵循信号。成熟度改『直接测量·单源』。","coverage_gap":null,"cells":[{"benchmark_id":"ifeval","subdimension":"prompt-level strict accuracy","weight":1.0,"revision_rationale":""}]}],"profile":{"title":"P01 指令与约束遵循","one_liner":"说了就照做——格式、字数、必须包含什么、不许出现什么，这些明写出来的要求能不能稳定执行。","sections":[{"heading":"这项能力管什么","bullets":["老师要一份\"10 道题、每题标难度、不附答案\"的练习卷，模型给了 8 道题外加全部答案。内容也许不差，但产物直接返工——这就是这项能力失手的样子。","它只问\"有没有照做\"，不问\"做得好不好\"。题目质量、讲解水平都是别的能力的事，这里单看约束的执行。","它是所有下游功能的地基。凡是把模型接进产品流水线——按模板生成、结构化输出、自动排版——指令一不稳，整条链路就不稳。"]},{"heading":"怎么衡量","bullets":["只用能写成检查函数的约束：字数、关键词、大小写、JSON 格式、段落数。判分不经过 LLM 裁判，没有主观解释空间。","取严口径：一条指令里含多个约束，错一个就算不通过。教学产物通常是全或无地可用，不该给\"大部分满足\"发部分分。","这项能力不再拆子项——加约束和守约束是同一件事，按约束类型细分只会把同一个构念切开重算。"]},{"heading":"读分时注意","bullets":["证据只有一个来源，而且是通用指令场景、不是教育场景。分数应读作通用指令遵循的下界参考，不能当成\"在教学任务里也这么稳\"。","曾经把选择题的\"格式遵循\"和弃答任务的\"约束遵循\"也算进来，后来摘掉了：前者的分数实际是答对率，知识强的模型会显得更守规矩；后者分不清\"守住了约束\"和\"本来就想弃答\"。宁可单源，也不要看起来厚实、实则混着别的能力的证据。","各模型分数挤在高位，区分度有限。这是一条门槛——低于线说明有硬问题，分高并不说明更会教。"]}],"file":"P01.md","missing":false}},{"p_code":"P02","p_name":"长上下文与证据定位","group":"SRG","definition":"在长材料/长对话中定位并引用相关证据","model_type":"reflective","rationale":"【裁决 R21】longtutor_evidence 按 memory_type 拆三格等权直接测量（同一 benchmark 的三个子维度测不同东西：单记录提取近天花板、跨 session 推理与幻觉检查才有区分度）；无可分离定位信号的三个搭车格（asap_2 QWK、sas_bench QWK、solution_correctness）摘除——整体打分里观测不到『定位过证据』，是评分一致性方差冒充 P02 证据；仅保留有真实定位成分的 mistake_location 与 CCS，相关度降至 0.15（定位行为真但材料不长）。四模型面总分 0.71–0.81 已拉开，区分度红旗解除。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"core","facet_name":"长上下文与证据定位","facet_description":"在长材料/长对话中定位并引用相关证据","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"longtutor_evidence","subdimension":"Information Extraction accuracy","weight":0.8,"revision_rationale":"R21(2026-07-19)：原单格『semantic evidence accuracy (3 memory types)』按 memory_type 拆三格，等权 0.7（三维度都重要，暂不分高下）。本格为长历史（约 200 条作答记录）中的单记录定位提取，构念最字面直接，但四模型面 0.93–0.97 近天花板，区分度主要由另两格提供。"},{"benchmark_id":"longtutor_evidence","subdimension":"Multi-session Reasoning accuracy","weight":0.8,"revision_rationale":"R21(2026-07-19)：拆分格。跨 session 整合多条历史记录作答，是『长』成分最硬的部分；四模型面 0.60–0.70，区分度良好。"},{"benchmark_id":"longtutor_evidence","subdimension":"Hallucination Check accuracy","weight":0.8,"revision_rationale":"R21(2026-07-19)：拆分格。判断历史中不存在该证据、拒绝编造，是证据定位的负样本面；四模型面 0.61–0.75，区分度最好。"},{"benchmark_id":"sas_bench","subdimension":"CCS step scoring consistency","weight":0.2,"revision_rationale":"R21(2026-07-19)：0.2→0.15。分步踩分需把解答各步与评分点对齐，有真实定位成分故保留；但材料短且分数主要方差是评分一致性（P10 构念），降为低权代理。"},{"benchmark_id":"mathtutorbench_mistake_location","subdimension":"Mistake Location","weight":0.2,"revision_rationale":"R21(2026-07-19)：0.2→0.15。输出即『错在第几步』，定位行为真实故保留；但单道解题材料不长，且同一信号已是 P09 错误定位核心格，此处降为低权代理。"}]}],"profile":{"title":"P02 长上下文与证据定位","one_liner":"在长材料、长对话里找得到该找的那句话——并且不编造材料里没有的内容。","sections":[{"heading":"这项能力管什么","bullets":["学生和 AI 断续聊了三个月。今天问\"我上次那道题错在哪\"，模型要能翻回三周前那段对话把它拎出来；如果顺口引用一句学生从没说过的话，后面所有个性化都建立在假证据上。","三种典型失手：单条信息就在眼前却抓错、需要跨好几次会话拼起来才成立的推断做不出、以及最危险的一种——凭空补出材料里不存在的细节。","它是长程辅导的前提。没有可靠的证据定位，学习者画像和个性化教学都只是在猜。"]},{"heading":"怎么衡量","bullets":["主证据来自一套长程辅导对话测验，按记忆类型拆成三条分别记分：单条信息提取、跨会话推理、幻觉核查。","三条分开算而不是合成一个总分，是因为它们难度差得很远——单条提取几乎人人满分，跨会话推理和幻觉核查才拉得开差距。合成总分会把后两者的信号稀释掉。","另外两条辅助证据（定位解题中的错误步骤、分步评分的一致性）只作弱信号计入：定位行为是真的，但材料本身并不长，测不出长上下文的压力。"]},{"heading":"读分时注意","bullets":["曾经把作文整体评分、简答题整体评分这类一致性指标也算作证据，后来摘掉了——从一个总分里观测不到模型\"定位过证据\"，那是评分一致性的方差冒充了定位能力。","单条信息提取一项已接近天花板，模型之间几乎无差别。看这项能力的分数时，差距基本来自跨会话推理和幻觉核查这两条。","长程辅导的测验是自行移植实现的，与官方流程可比但非逐字节复现，置信上做了折价。"]}],"file":"P02.md","missing":false}},{"p_code":"P03","p_name":"多模态理解","group":"SRG","definition":"读懂教育场景中的图像/图表等非文本材料并据此推理","model_type":"formative","rationale":"【裁决 R5】原 P03/P04 合并：深浅是难度维度用证据标签表达。【裁决 R19】facet 轴统一为『内容构成』单轴（材料本身长什么样），不掺场景/任务标签——原『教学场景图文』按场景定义边界不可判（所有教育活动都可称教学交互），改名改义为『图文混排材料』按内容构成定义。渲染 vs 拍摄不影响归属（只是清晰度噪声）。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"problem_images","facet_name":"解题图像","facet_description":"题目自带的单一规范几何图/函数图等图形化解题条件（渲染或拍摄不影响归属）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"mathvista","subdimension":"task/question_type/answer_type accuracy","weight":0.5,"revision_rationale":"【R19 注记】mathvista 混有 ChartQA/FigureQA 类统计图表子集，严格说跨解题图像/学科图表两 facet；按 benchmark 粒度整体记于此。【R22 注记】维持整体不拆（用户裁决 2026-07-19）：FQA 可归学科图表但 TQA/VQA 两 facet 均无家，硬拆制造新边界纠纷；单模型面拆分无收益，记 TODO。 R25 裁决:读图是分数主成分(区别于盲测证伪的 olympiadbench 格),混数学推理方差,合中等相关定义"},{"benchmark_id":"olympiadbench","subdimension":"multimodal-subset accuracy","weight":0.2,"revision_rationale":"R22(2026-07-19)：取数由全量准确率改为 by_bucket.modality.MM 多模态子集（原全量含约 40% 纯文本题）；相关度 0.2→0.1——盲测对照显示视觉信号极弱（看不见图的 deepseek-v4-pro 在 MM 子集拿 0.658，仅比明眼 M3 的 0.681 低 0.023），按用户裁决降权保留不删。deepseek-v4-pro 该格作废（盲跑废分，聚合按盲视模型名单排除）。"},{"benchmark_id":"k12vista","subdimension":"math problem-figure subset score","weight":0.5,"revision_rationale":"R22(2026-07-19)：k12vista 按学科拆分（用户裁决）。math-g6/g9/g12 三档（158/598）的图是解题条件图，按内容构成归解题图像 facet；相关度对齐 mathvista 的 0.35。 R25 裁决:同 mathvista,解题必须读图,视觉理解是主成分"}]},{"facet_id":"subject_charts","facet_name":"学科图表","facet_description":"单一规范的学科图表（实验装置、地图、统计图等）的多步理解（渲染或拍摄不影响归属）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"k12vista","subdimension":"science/geo subject-chart subset score","weight":0.5,"revision_rationale":"【裁决 R15】K12Vista 接入（学科图多步理解，五学科×三学段 300 题分层抽样）。裁判未校准、仅 4 个视觉模型可跑——参考值。 R22(2026-07-19)：按学科拆分后本格仅取理化生地四科（440/598，实验装置/地图/图表），math 三档迁至解题图像 facet；P04/P05 的 k12vista 整体挂载不受影响。"}]},{"facet_id":"mixed_materials","facet_name":"图文混排材料","facet_description":"掺杂手写笔迹、批注、多来源拼贴的复合图文材料的理解——按内容构成定义，不问出现场合；区别于前两 facet 的单一规范图形/图表","revision_rationale":"【裁决 R19】自『教学场景图文』改名改义（场景轴边界不可判）。方法学注记：现有两格（tutorbench/mmtutorbench）的分数混有教学回复质量方差，作为本 facet 的理解类证据属代理性质。","coverage_gap":null,"cells":[{"benchmark_id":"tutorbench","subdimension":"Fair815 multimodal tutor quality","weight":0.2,"revision_rationale":""},{"benchmark_id":"mmtutorbench","subdimension":"multimodal tutor score","weight":0.2,"revision_rationale":""}]},{"facet_id":"video_audio","facet_name":"视频/音频","facet_description":"理解教学视频与音频材料","revision_rationale":"","coverage_gap":true,"cells":[]}],"profile":{"title":"P03 多模态理解","one_liner":"看懂教学材料里的图——几何图、实验装置图、统计图，以及学生拍来的那张写满字迹和批注的作业照片。","sections":[{"heading":"这项能力管什么","bullets":["学生拍一张作业照发过来：\"这道题我这么做对不对？\"图里有印刷题干、手写解答、老师的红笔批注三层信息。看不懂图，后面的诊断和讲解全是空转。","四类材料的难度完全不同：题目自带的规范几何图、学科图表（实验装置、地图、统计图）、掺着手写与批注的混排照片，以及教学视频音频。","按材料本身长什么样分类，不按它出现在什么场合。场景这条轴划不出边界——任何教育活动都能往里塞。"]},{"heading":"怎么衡量","bullets":["解题图像和学科图表用带图的学科题测，图看不懂就答不对；图文混排材料用真实辅导场景里的多模态对话测。","混排材料这一类刻意不区分\"渲染的\"还是\"拍摄的\"——那只是清晰度差别，不是两种不同的理解任务。","视频与音频材料这一类目前完全没有可用测评，明确留白而不是假装覆盖。"]},{"heading":"读分时注意","bullets":["做过一次盲测对照，结果值得警惕：把图遮住、只给文字的模型在某个奥赛多模态子集上拿到 0.658，几乎追平能看图的模型的 0.681。说明那批题的文字部分已经包含足够信息，所谓\"多模态成绩\"是被污染的。该子集因此被压到最低权重，看不见图的模型也从多模态格子里排除。","图文混排这一类的证据最薄，两个来源都只能给弱信号——它们测的是整体辅导质量，理解只是其中一部分方差。","视频音频留白意味着：这项能力的分数只覆盖静态图像。做视频类教学产品的话，这里没有任何参考价值。"]}],"file":"P03.md","missing":false}},{"p_code":"P04","p_name":"多模态生成","group":"SRG","definition":"产出图示等结构正确、可读、图文对应的非文本材料","model_type":"formative","rationale":"【裁决 R23】本 P 由「多模态教学产物生成」改制为「多模态生成」，与 P03 多模态理解配对并移入基础类别（SRG）：一对读/写——P03 把图看懂，本 P 把图产出来；构念通用（能否产出结构正确、可读、图文对应的非文本产物），脱离教育场景仍可定义。改制起因：原定义与 P15「教学产物生成」facet 是同一构念被按模态切成两个 P（文本归 P15、图归本 P），eduillustrate 因此双挂＝重复计分；改制后 eduillustrate 主家在此单挂，P15 保留 0.25 副挂。**证据局限（必须随分数呈现）**：eduillustrate 是教育域 benchmark，单独承担一个基础能力构念偏窄——用教学场景样本推断通用生成能力，是下界代理而非通用测量（R5 当初正因此把它从 P03 摘除）；通用图像/图表生成 benchmark 列入待补，single_source 标记保留。facet 维持 R19 的静态/时序两分（只改名与归组），不按 eduillustrate 的 8 个判分维度拆——那会让同一道题落进两个 facet，违反 R19 的 boundary-decidable 规则；亦不镜像 P03 的另两个 facet：①\"解题图像/学科图表\"两分源于 mathvista/k12vista 证据天然分家，生成侧无此分家；②\"图文混排\"在 P03 的定义是\"掺杂手写笔迹、批注、多来源拼贴\"，属输入端才有的性质（材料脏、来源杂所以难理解），生成端无对应物。【R19 原文保留】拆静态/时序两 facet 的依据：Mayer 多媒体学习理论中静态图示与动态动画/交互仿真适用不同设计原则，失败机制独立；时序与交互产物零覆盖，显式标空。","coverage_gap":null,"single_source":true,"facets":[{"facet_id":"static_visual","facet_name":"图示与示意图生成","facet_description":"生成示意图、几何图、学科图表等单一规范图形（单源：eduillustrate，8 维＝文本侧 正确性/逻辑/易懂/图文协同 + 视觉侧 图题匹配/排版/元素布局/视觉一致，聚合取总均分）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduillustrate","subdimension":"8-dim 0-5 visual explanation score","weight":0.5,"revision_rationale":""}]},{"facet_id":"temporal_interactive","facet_name":"时序与交互产物生成","facet_description":"生成音频讲解、视频/动画、交互式演示与仿真等含时间连续性或交互状态的产物（零覆盖）","revision_rationale":"","coverage_gap":true,"cells":[]}],"profile":{"title":"P04 多模态生成","one_liner":"不只是讲，还能画出来——示意图、几何图、学科图表，图本身对、排版清楚、图和文说的是同一件事。","sections":[{"heading":"这项能力管什么","bullets":["讲解\"函数图像平移\"，光靠文字描述再准确也不如一张图。模型能不能真的产出那张图，是能不能替代板书的分界线。","三种失手方式独立发生：图画错了（内容不对）、图画对了但排版乱到看不清（可读性）、图和讲解文字对不上（图文不协同）。","与\"看懂图\"是一对读写关系，但不是同一项能力——能读图的模型未必画得出图。"]},{"heading":"怎么衡量","bullets":["图示生成用一套让模型写可视化讲解代码、再按 8 个维度打分的测验：文本侧看正确性、逻辑、易懂、图文协同，视觉侧看图题匹配、排版、元素布局、视觉一致。","这 8 个维度不拆成独立子项——同一道题会同时落进多个维度，边界判不了。聚合取总均分。","音频讲解、视频动画、交互式演示这一类含时间连续性或交互状态的产物，目前零覆盖，明确留白。"]},{"heading":"读分时注意","bullets":["证据只有一个来源，而且是教育场景的测验。用教学样本推断通用生成能力，是下界代理而非通用测量——分数偏低不代表模型完全不会画图，只代表在教学题材上的表现。","通用图像/图表生成的测评已列入待补。在补上之前，这项分数请当参考值读。","这项能力原本叫\"多模态教学产物生成\"、归在教育侧，后来改制移进基础能力组：旧定义和\"生成教学产物\"是同一个构念被按模态切开，导致同一份证据被算了两次。"]}],"file":"P04.md","missing":false}},{"p_code":"P05","p_name":"知识调用与掌握","group":"FDR","definition":"学科知识与教学专业知识的正确调用","model_type":"formative","rationale":"两类知识内容边界清楚、各有独立 benchmark 家族。【裁决 R19】原第三 facet『生成中的知识运用』砍除：判别式答题与生成式运用是同一构念（知识调用对不对）的两种测量方式，与前两 facet 构念重复（facet 规则：边界可判+不重复）；与 P17/P20-22 知行 facet 的区别在于后者的行为侧有独立失败机制（情境落地/对抗操纵），而生成侧挑不出知识调用之外的新机制（幻觉自查与置信已归 P07/P08）。知识簇普遍天花板，门槛性质。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"subject_knowledge","facet_name":"学科知识调用","facet_description":"正确调用学科事实、概念与方法（判别式答题与生成式运用同为测量方式，不再分 facet）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"mmlu_pro","subdimension":"overall/category accuracy","weight":0.5,"revision_rationale":""},{"benchmark_id":"ceval","subdimension":"overall/category/subject accuracy","weight":0.5,"revision_rationale":""},{"benchmark_id":"agieval","subdimension":"overall/task/language/question_type accuracy","weight":0.2,"revision_rationale":""},{"benchmark_id":"mathtutorbench_problem_solving","subdimension":"Problem Solving","weight":0.2,"revision_rationale":""},{"benchmark_id":"olympiadbench","subdimension":"overall/subject/language/modality accuracy","weight":0.2,"revision_rationale":""},{"benchmark_id":"mathvista","subdimension":"task/question_type/answer_type accuracy","weight":0.2,"revision_rationale":""},{"benchmark_id":"k12vista","subdimension":"official partial-credit score (per-blank 0/1 mean)","weight":0.2,"revision_rationale":"【裁决 R15】副挂。"},{"benchmark_id":"edubench","subdimension":"domain_knowledge_accuracy (metric)","weight":0.2,"revision_rationale":"【裁决 R1】edubench 改指标级取分；知识类指标被裁判打到天花板，门槛性质【草案权重】。【裁决 R19】自原『生成中的知识运用』facet 迁入（该 facet 砍除，格子按知识类型归位）。"},{"benchmark_id":"edubench","subdimension":"basic_factual_accuracy (metric)","weight":0.2,"revision_rationale":"【裁决 R1】同上【草案权重】。【裁决 R19】自原『生成中的知识运用』facet 迁入（该 facet 砍除，格子按知识类型归位）。"},{"benchmark_id":"sas_bench","subdimension":"ECS error-cause consistency","weight":0.2,"revision_rationale":"【裁决 R19】自原第三 facet 迁入并降档 education_core→diagnostic：错因归因确实动用学科知识（必要条件链成立），但主构念在 P09c（主格 0.7），对 P04 仅为相邻证据。"}]},{"facet_id":"pedagogical_knowledge","facet_name":"教学专业知识","facet_description":"教学法、课程与特殊教育需求等教师专业知识的掌握（判别式与生成式测量并用）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"pedagogy_benchmark","subdimension":"CDPK teaching knowledge selection","weight":0.5,"revision_rationale":"R22(2026-07-19)：修复取数缺口——聚合脚本此前无 pedagogy_benchmark 分支，本格长期零证据（11 个 1,119 题完整跑分被静默丢弃）；现从 by_bucket.category 取数（SEND=CDPK_send，CDPK=其余 7 类合并）。0701 聚合卡格子退役（同一考试同一协议的旧快照，避免同信号双算）。"},{"benchmark_id":"pedagogy_benchmark","subdimension":"SEND special education needs selection","weight":0.5,"revision_rationale":"R22(2026-07-19)：修复取数缺口——聚合脚本此前无 pedagogy_benchmark 分支，本格长期零证据（11 个 1,119 题完整跑分被静默丢弃）；现从 by_bucket.category 取数（SEND=CDPK_send，CDPK=其余 7 类合并）。0701 聚合卡格子退役（同一考试同一协议的旧快照，避免同信号双算）。 R25 裁决:特教知识选择题是本 facet 直接测量(子领域偏窄),不应与胜率代理格同档"},{"benchmark_id":"mathtutorbench_pedagogy","subdimension":"Pedagogy IF","weight":0.2,"revision_rationale":"【裁决 R19】自原第三 facet 迁入并降档 education_core→diagnostic：win-rate 主测执行质量（主构念在 P13/P15（旧编号 P17/P18）），教学知识是其必要条件，仅作相邻证据；顺带使本 facet 脱离 pedagogy_benchmark 单一来源。 R22(2026-07-19)：用户裁决保留——Pedagogy IF 是教学法知识的生成式测量，与 facet 描述『判别式与生成式测量并用』一致。"},{"benchmark_id":"mathtutorbench_pedagogy_hard","subdimension":"Pedagogy IF hard","weight":0.2,"revision_rationale":"【裁决 R19】自原第三 facet 迁入并降档 education_core→diagnostic：win-rate 主测执行质量（主构念在 P13/P15（旧编号 P17/P18）），教学知识是其必要条件，仅作相邻证据；顺带使本 facet 脱离 pedagogy_benchmark 单一来源。 R22(2026-07-19)：用户裁决保留——Pedagogy IF 是教学法知识的生成式测量，与 facet 描述『判别式与生成式测量并用』一致。"},{"benchmark_id":"mathtutorbench_scaffolding","subdimension":"Scaffolding","weight":0.2,"revision_rationale":"【裁决 R19】自原第三 facet 迁入并降档 education_core→diagnostic：win-rate 主测执行质量（主构念在 P13/P15（旧编号 P17/P18）），教学知识是其必要条件，仅作相邻证据；顺带使本 facet 脱离 pedagogy_benchmark 单一来源。 R22(2026-07-19)：用户裁决保留——Pedagogy IF 是教学法知识的生成式测量，与 facet 描述『判别式与生成式测量并用』一致。"},{"benchmark_id":"mathtutorbench_scaffolding_hard","subdimension":"Scaffolding hard","weight":0.2,"revision_rationale":"【裁决 R19】自原第三 facet 迁入并降档 education_core→diagnostic：win-rate 主测执行质量（主构念在 P13/P15（旧编号 P17/P18）），教学知识是其必要条件，仅作相邻证据；顺带使本 facet 脱离 pedagogy_benchmark 单一来源。 R22(2026-07-19)：用户裁决保留——Pedagogy IF 是教学法知识的生成式测量，与 facet 描述『判别式与生成式测量并用』一致。"}]}],"profile":{"title":"P05 知识调用与掌握","one_liner":"学科知识本身要对，教学专业知识也要对——前者是不能讲错，后者是知道该怎么教。","sections":[{"heading":"这项能力管什么","bullets":["两类知识，缺哪个都不行：讲错了氧化还原的方向，是学科知识出问题；知道知识点却不知道\"这个年龄段的学生通常卡在哪一步\"，是教学专业知识出问题。","教学专业知识包括教学法、课程结构、以及特殊教育需求的识别——这部分在通用模型评测里基本不测，但它决定了模型是不是\"像个老师\"。","判别式答题和生成式运用不分成两项。会选对答案和会在讲解里用对，是同一个构念的两种测法，不是两种能力。"]},{"heading":"怎么衡量","bullets":["学科知识用多套标准化学科考试测，精确匹配判分，没有裁判的主观空间；再辅以教学场景生成任务里裁判打的知识准确性分。","教学专业知识用教师资格考试类的选择题测，覆盖教学法知识和特殊教育需求两块；再辅以数学辅导任务里按教学法指令生成回复的表现——那是同一种专业知识的生成式测法。","学科侧的证据面最厚，来源横跨中英文、通识与竞赛难度、纯文本与图文。"]},{"heading":"读分时注意","bullets":["这一簇分数普遍顶在高位，天花板明显。它是门槛而不是长板：过线是能上讲台的必要条件，绝不证明会教。整个体系里\"会答题≠会教\"这句话，说的就是这里的分数不能外推。","通识考试类证据只挂在这项能力上，不参与任何教育侧能力的计分。这是刻意设的护栏——不让通识水平主导教育画像。","曾经把\"先修关系推理\"也算作知识调用的证据，后来摘除了：知道 A 是 B 的前置，和调用 A 的知识内容，中间没有构念链。"]}],"file":"P05.md","missing":false}},{"p_code":"P06","p_name":"推理与生成","group":"FDR","definition":"解题推理与约束下的生成推理","model_type":"formative","rationale":"解题式推理与生成/归因式推理侧重不同，不强制协变。【裁决 R8】pedagogy_benchmark 移出 P06。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"problem_reasoning","facet_name":"解题推理","facet_description":"面向标准答案的多步解题推理","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"mathtutorbench_problem_solving","subdimension":"Problem Solving","weight":0.5,"revision_rationale":""},{"benchmark_id":"olympiadbench","subdimension":"overall/subject/language/modality accuracy","weight":0.5,"revision_rationale":""},{"benchmark_id":"agieval","subdimension":"overall/task/language/question_type accuracy","weight":0.5,"revision_rationale":""},{"benchmark_id":"mathvista","subdimension":"task/question_type/answer_type accuracy","weight":0.5,"revision_rationale":""},{"benchmark_id":"mmlu_pro","subdimension":"overall/category accuracy","weight":0.2,"revision_rationale":""},{"benchmark_id":"k12vista","subdimension":"official partial-credit score (per-blank 0/1 mean)","weight":0.2,"revision_rationale":"【裁决 R15】图表多步推理成分。"},{"benchmark_id":"ceval","subdimension":"overall/category/subject accuracy","weight":0.2,"revision_rationale":""}]},{"facet_id":"generative_reasoning","facet_name":"生成与归因推理","facet_description":"生成教学内容、解释错因时的推理严谨性与思维引导深度","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"edubench","subdimension":"reasoning_process_rigor (metric)","weight":0.5,"revision_rationale":"【裁决 R1】替换原 QG/TMG 任务分【草案权重】。 R25 裁决:裁判逐题标\"推理过程严谨\",指标名即构念;保持 facet 首格地位"},{"benchmark_id":"edubench","subdimension":"higher_order_thinking_ability_development (metric)","weight":0.2,"revision_rationale":"【裁决 R1】换裁判稳健（ρ 0.63-0.73），与 P18 分挂【草案权重】。"},{"benchmark_id":"mathtutorbench_mistake_correction","subdimension":"Mistake Correction","weight":0.2,"revision_rationale":""},{"benchmark_id":"sas_bench","subdimension":"ECS error-cause consistency","weight":0.2,"revision_rationale":""}]}],"profile":{"title":"P06 推理与生成","one_liner":"一步步把题推对，以及在讲解和归因时把话说得站得住。","sections":[{"heading":"这项能力管什么","bullets":["两种推理侧重不同：面向标准答案的解题推理，和面向学生的生成式推理——解释一个错误为什么会发生、把一个概念讲到能被追问三层还不塌。","解题推理错了，答案就错；生成推理不严谨，答案可能对，但过程里有跳步、有循环论证，学生照着学会学歪。","两者不强制协变。竞赛题解得漂亮的模型，讲错因时照样可能给出\"因为你粗心了\"这种毫无信息量的归因。"]},{"heading":"怎么衡量","bullets":["解题侧用竞赛级和标准化考试的开放题与选择题测，精确匹配判分。","生成侧主要看教学场景生成任务里裁判打的推理严密性，辅以纠错任务和错因诊断一致性——后者拿模型给的错因和人工标注的错因比对。","通识选择题只作弱信号计入解题侧：它们的分数里知识成分远大于推理成分。"]},{"heading":"读分时注意","bullets":["解题侧分数偏高、区分度有限；生成侧的错因一致性拉得开差距（区间跨度约 3.8 到 6.6），两侧合成后中和了一部分信号。想看真实差异，建议下钻到子项。","生成侧的主证据来自 LLM 裁判打分，裁判整体偏宽松、分布压缩。","曾经把\"先修关系推理\"算进来，后来摘除了——那测的是知识结构，不是推理过程。"]}],"file":"P06.md","missing":false}},{"p_code":"P07","p_name":"自我校验与修正","group":"FDR","definition":"复查自己的输出,发现并修正错误","model_type":"reflective","rationale":"两轮自查协议为直接测量主格（headline 与首轮正确率解耦）；解答正确性判断与校准分为相邻代理。 R22(2026-07-19)：problem_solving 搭车格摘除（解题强与会复查无构念链）。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"core","facet_name":"自我校验与修正","facet_description":"复查自己的输出,发现并修正错误","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"p07_selfcheck","subdimension":"two-round self-check (fix/break rate)","weight":0.8,"revision_rationale":""},{"benchmark_id":"mathtutorbench_solution_correctness","subdimension":"Solution Correctness","weight":0.2,"revision_rationale":""},{"benchmark_id":"p08_calibration","subdimension":"calibration composite (CWR/AUROC)","weight":0.2,"revision_rationale":""}]}],"profile":{"title":"P07 自我校验与修正","one_liner":"回头复查自己刚写的东西，把错的改对——同时不要把本来对的改错。","sections":[{"heading":"这项能力管什么","bullets":["模型给学生讲完一道题，再看一遍，能不能自己发现第三步符号搞反了。教学场景里没人替它兜底，自查是最后一道防线。","关键是双向的：能改对错的固然好，但把原本正确的答案在\"再想想\"之后改错，破坏性更大——学生会以为后一版更可信。","这项能力和\"一开始就答对\"是两回事。首轮正确率高的模型不一定复查得好，反过来也成立。"]},{"heading":"怎么衡量","bullets":["主证据是一套自建的两轮自查测验：先让模型作答，再在不给任何提示的情况下要求它复查。核心指标同时看改对率和改错率，各占一半，与首轮正确率解耦。","不给提示是关键设计。一旦提示\"这里可能有错\"，测的就变成了受提示的定位能力，不是自发的复查习惯。","辅助证据来自判断给定解法对错的任务，以及置信度校准测验——后者与自查共享\"知道自己哪里可能不对\"的内核。"]},{"heading":"读分时注意","bullets":["分数普遍偏低（区间约 5.0 到 5.6），这是真实发现不是测量故障：当前模型的自发复查普遍不牢靠，改对的同时也在改错。","主证据是自建协议、没有公开基线可以对照，置信上做了折价。横向比较可用，绝对分请谨慎引用。","曾经把解题正确率算作辅助证据，后来摘除了——解题强和会复查之间没有构念链。"]}],"file":"P07.md","missing":false}},{"p_code":"P08","p_name":"置信度校准与弃答","group":"FDR","definition":"自信程度与正确率一致;不会时主动弃答","model_type":"formative","rationale":"置信度校准（概率质量）与能力性弃答（行为决策）相关但可分离；两个自建测验按设计各测一半。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"calibration","facet_name":"置信度校准","facet_description":"表达的自信程度与实际正确率一致(不自信地教错)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"p08_calibration","subdimension":"calibration composite (CWR/AUROC)","weight":0.8,"revision_rationale":""},{"benchmark_id":"p07_selfcheck","subdimension":"two-round self-check (fix/break rate)","weight":0.2,"revision_rationale":""}]},{"facet_id":"abstention","facet_name":"能力性弃答","facet_description":"面对不可答或超出能力的问题主动说不会","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"p08_abstention","subdimension":"balanced abstention score","weight":0.8,"revision_rationale":""}]}],"profile":{"title":"P08 置信度校准与弃答","one_liner":"有多大把握就表现出多大把握，不会的时候直接说不会。","sections":[{"heading":"这项能力管什么","bullets":["最坏的教育事故不是模型答错，是它用十成的笃定语气答错。学生没有能力分辨，笃定就等于可信。","两件相关但可分离的事：一是自信程度和实际正确率对不对得上（校准），二是面对超出能力或根本不可答的问题会不会主动说不会（弃答）。","校准是概率质量问题，弃答是行为决策问题。一个模型可以内部概率很准，但被问到就是硬答不肯放弃。"]},{"heading":"怎么衡量","bullets":["两套自建测验按设计各测一半：校准测验看模型的置信表述与实际正确率的一致性，弃答测验看它面对不可答问题的拒答表现，同时惩罚该答不答。","弃答分数取平衡口径——只奖励拒答会训练出\"什么都不答\"的退化策略，必须同时看该答的有没有答。","两轮自查测验作为辅助证据计入校准一侧：能发现自己错了和知道自己没把握，共享同一个内核。"]},{"heading":"读分时注意","bullets":["校准分数偏低（约 5.6 到 6.8），弃答分数偏高（约 8.6 到 9.1）。这个反差本身是结论：模型比较愿意在明显不可答时说不会，但在\"答得出来、只是可能错\"的灰区里仍然表现得过分自信。","两套测验都是自建协议、无公开基线，置信上做了折价。","弃答测验用的是可判定的不可答问题。真实课堂里的灰区问题（学生问一个超纲但相邻的知识点）没有覆盖到。"]}],"file":"P08.md","missing":false}},{"p_code":"P09","p_name":"工具使用与长程智能体执行","group":"FDR","definition":"调用工具、完成多步长程任务","model_type":"formative","rationale":"领域空白：教育场景 agent/工具使用类评测缺位。【裁决 R19】拆两个空 facet 显式呈现缺口：工具调用与长程执行是 agent 评测中公认可独立失败的两种机制（会调工具不代表撑得过长程状态维护，反之亦然），两处空白分开标比笼统一处更能指引补数据方向。报告仍标『暂未覆盖』。","coverage_gap":true,"single_source":null,"facets":[{"facet_id":"tool_use","facet_name":"工具选择、调用与结果整合","facet_description":"选择合适的工具、正确构造调用并核验整合工具结果","revision_rationale":"","coverage_gap":true,"cells":[]},{"facet_id":"long_horizon","facet_name":"长程计划、状态保持与失败恢复","facet_description":"跨多轮/多任务维持计划与状态，从中途失败中恢复","revision_rationale":"","coverage_gap":true,"cells":[]}],"profile":{"title":"P09 工具使用与长程智能体执行","one_liner":"调得动工具、撑得住长任务——这项目前没有任何合适的测评，是明确留白。","sections":[{"heading":"这项能力管什么","bullets":["教育场景里的智能体形态正在成型：查学情系统、调题库、生成并批改一整套作业、跨周维持一个教学计划。这些都不是单轮问答。","拆成两个方向，因为它们会各自独立地失败：一是选对工具、把调用参数构造正确、并且核验工具返回的结果不盲信；二是跨多轮维持计划与状态，中途出错还能恢复。","会调工具不代表撑得过长程状态维护，反过来也成立。分开标注比合成一项更能指出该补什么数据。"]},{"heading":"怎么衡量","bullets":["目前无法衡量。教育场景的智能体与工具使用类评测整体缺位，两个方向都是零覆盖。","通用领域的智能体评测存在，但没有纳入——它们的任务分布与教育场景相去太远，硬挂上来只会制造一个看起来有分、实则不指向教育能力的数字。"]},{"heading":"读分时注意","bullets":["这项能力在模型排名里不出现分数，报告中标注为\"暂未覆盖\"。","测不了不等于不存在。能力清单按构念本身定义，不随测量可行性伸缩——把它留在清单里，是为了让缺口一直可见。","这是当前体系最值得优先补齐的缺口之一，尤其是在教育智能体产品化的节奏下。"]}],"file":"P09.md","missing":false}},{"p_code":"P10","p_name":"错误诊断","group":"LAD","definition":"判对错、定位错误步骤、解释错因/误概念(三 facet 为诊断深度)","model_type":"formative","rationale":"【裁决 R17，2026-07-16】原 P11 作答正误判定 / P12 错误位置定位 / P13 错因归因合并为一个 P，原三项降为 facet（诊断深度：判对→定位→归因）。依据（benchmark 无关）：①按拆分准入规则（四类依据至少两个），P11/P12 拆分不达标——v3 审计自认两者残余约等于无、机制同为对参考解核验，分开的表象来自 mathtutorbench 恰好分任务，而 benchmark 存在不构成拆分依据；②P13 归因单独保留虽可（教师 noticing 的 perceive/interpret 之分、误概念知识残余、sas_bench CCS/ECS 独立标注），但允许拆≠必须拆，合入后口径与 P03/P04 合并一致：诊断深度用 facet 表达，不是三个独立构念；③测量上原 P11/P12 均为薄证据单源+，合并后整 P 多源，facet 机制（facet 内加权、跨 facet 等权）现成。与 P14 的边界：本 P 是对着参考解找错、解释错（诊断）；P14 是把作答证据映射到 rubric 分档（量尺映射），机制不同。方法学注记：本裁决发生在见数之后（v2 聚合分数已产出），修订仅以上述构念层依据支撑，不引用任何分数模式。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"answer_verdict","facet_name":"作答正误判定","facet_description":"判断学生作答对不对","revision_rationale":"R17 附带删除两格：①mathtutorbench_mistake_location 0.1 搭车格——同源主格（0.7）已是 P11b 主格；②bea2025_judge 0.25 暂不计分占位格——同一占位（同 subdimension）已在 P11c（0.3，与 mrbench_judge 并列），合并后每 P 保留一份即可。两处均为避免同 P 跨 facet 双计同一数据源。","coverage_gap":null,"cells":[{"benchmark_id":"mathtutorbench_solution_correctness","subdimension":"Solution Correctness","weight":0.5,"revision_rationale":""}]},{"facet_id":"error_location","facet_name":"错误位置定位","facet_description":"指出错误发生在解答的哪一步","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"mathtutorbench_mistake_location","subdimension":"Mistake Location","weight":0.8,"revision_rationale":""},{"benchmark_id":"sas_bench","subdimension":"CCS step scoring consistency","weight":0.2,"revision_rationale":""}]},{"facet_id":"error_attribution","facet_name":"错因归因","facet_description":"解释为什么错(错因类别、误概念)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"sas_bench","subdimension":"ECS error-cause consistency","weight":0.8,"revision_rationale":""},{"benchmark_id":"bea2025_tutor","subdimension":"dimension: Mistake_Identification","weight":0.2,"revision_rationale":"【裁决 R2】复合 pass rate 换单维度分。"},{"benchmark_id":"mrbench_tutor","subdimension":"dimension: Mistake_Identification","weight":0.2,"revision_rationale":"【裁决 R2】同上。"},{"benchmark_id":"edubench","subdimension":"error_identification_correction_accuracy (metric)","weight":0.2,"revision_rationale":"【裁决 R1（R14 否决后口径）】入映射但带方法学局限注记：M2 换裁判实验显示该指标跨裁判 ρ≤0.14、三裁判均分 4.6/7.4/8.7，分歧大【草案权重】。"},{"benchmark_id":"mathtutorbench_mistake_correction","subdimension":"Mistake Correction","weight":0.2,"revision_rationale":"【裁决 R6】0.45→0.20：只测改对与否，与归因部分相关。"},{"benchmark_id":"longtutor_diagnosis","subdimension":"four-category knowledge-state diagnosis macro-F1","weight":0.2,"revision_rationale":"2026-07-16 裁决：P16a 主挂、P13 低权重副挂。语义核实——四标签（Recall Failure/Conceptual Gap/Procedural Error/Transfer Deficit）名义上是错因类别，但归因证据源是交互历史特征而非作答内容，与 ECS 锚动用的能力不同，故仅作相邻证据副挂 0.10。"}]}],"profile":{"title":"P10 错误诊断","one_liner":"学生这份作答错没错、错在哪一步、为什么会这么错——诊断的三个深度。","sections":[{"heading":"这项能力管什么","bullets":["一份错误的解答摆在面前，三层反应的价值差得很远：说一句\"不对\"、指出第三步开始偏了、以及说出\"你把负号当成了减号，这是符号运算的典型误概念\"。","三层按诊断深度排列，越往后越难，也越接近真正的教学价值。只会判对错的模型，做不了个性化辅导，只能做自动判卷。","错因归因是这项能力的核心。它要求模型从学生写下的东西反推出脑子里发生了什么——这是教师专业性最集中的地方。"]},{"heading":"怎么衡量","bullets":["判对错用给定参考解和学生解、要求判断正误的任务测，规则判分。","定位错误步骤用标注了首个错误步骤的数学解答测，主证据规则判分；辅以分步评分的一致性。","错因归因的主锚是高考简答题的错因诊断一致性——拿模型给出的错因和人工标注的错因类别比对；辅以多个辅导对话评测里的\"错误识别\"维度。"]},{"heading":"读分时注意","bullets":["三层的分数差距很能说明问题：判对错和定位步骤都在 7.6 以上且相当集中，错因归因的区间跨到 3.8–6.6。判得出、定得准，解释不了为什么——这是当前模型最一致的短板形态。","有一个来源被大幅降权到几乎只作注记：某教育场景生成评测的\"错误识别与纠正\"指标，换三个不同裁判去打分，两两相关系数不超过 0.14，均分分别是 4.6、7.4、8.7，各判各的。它给出的模型排序甚至与其他所有错误诊断证据相反。格子留着但权重压到尾部。","这项能力原本是三个独立能力，后来合并为一项、三层降为子项：判对错和定位错误的失败机制其实是同一个（对着参考解核验），看起来分开只是因为某个数据集恰好把它们拆成了两个任务。"]}],"file":"P10.md","missing":false}},{"p_code":"P11","p_name":"主观题评价能力","group":"LAD","definition":"依据(或构建)评分标准评判主观作答与教学回复","model_type":"formative","rationale":"【裁决 R3】拆学业评分/教学回复评判。【裁决 R19】改名『主观题评价能力』并改按评分操作类型分 facet：原『评的是什么对象』轴开放不可穷尽（以后可冒出评实验报告/评课件等新对象，边界不可判），整体性/分析式/生成 rubric 是评价任务本身的封闭操作类型。bea/mrbench judge 属分析式多维评判，正式入列该 facet（仍按 excluded_judge_task 暂不计分，不再脚注化）。『自动生成 rubric』空 facet 自 P23 迁回：rubric 的造与用共享同一类评分标准判断力，P14 收拢为主观题评价全链条；P14/P23 边界改为——涉及评分标准（造或用）归 P14，P23 只管题目。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"holistic_scoring","facet_name":"整体性评分","facet_description":"对整份主观作答给出整体分，与人类评分的一致性计（QWK 类）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"sas_bench","subdimension":"QWK holistic total score","weight":0.8,"revision_rationale":""},{"benchmark_id":"asap_2","subdimension":"essay holistic QWK","weight":0.8,"revision_rationale":"R25 裁决:与 sas_bench QWK 同一操作换语料,同构念同档"}]},{"facet_id":"analytic_scoring","facet_name":"分析式与多维度评分","facet_description":"按步骤/维度分解评判（步骤级评分一致性、逐维度判卷），与人类标注的一致性计","revision_rationale":"【裁决 R19】计分证据现仅 sas_bench·CCS 一格（judge 两格暂不计分），单源注记。","coverage_gap":null,"cells":[{"benchmark_id":"sas_bench","subdimension":"CCS step scoring consistency","weight":0.5,"revision_rationale":""},{"benchmark_id":"bea2025_judge","subdimension":"judge labels: mistake/guidance/actionability","weight":0.5,"revision_rationale":" 【裁决 R23】解除 excluded 并计分：P10 被测构念即判卷能力，R19 已判定构念对口（rel 0.45、由脚注升为正式格）；R20 全局 judge 排除的理由（评估别人≠自己会做）在此反转不适用。benchmark 置信 0.0→0.75。judge benchmark 挂载收拢至本 P（P09c/P17a 的 judge 格同批删除）。"},{"benchmark_id":"mrbench_judge","subdimension":"8-dimension tutor response judging","weight":0.5,"revision_rationale":" 【裁决 R23】解除 excluded 并计分：P10 被测构念即判卷能力，R19 已判定构念对口（rel 0.45、由脚注升为正式格）；R20 全局 judge 排除的理由（评估别人≠自己会做）在此反转不适用。benchmark 置信 0.0→0.75。judge benchmark 挂载收拢至本 P（P09c/P17a 的 judge 格同批删除）。"}]},{"facet_id":"rubric_generation","facet_name":"自动生成 rubric","facet_description":"为主观任务生成评分标准（R19 自当时的命题 P 迁回本 P，仍为空白）","revision_rationale":"【裁决 R19】自 P23 迁回。","coverage_gap":true,"cells":[]}],"profile":{"title":"P11 主观题评价能力","one_liner":"按评分标准给主观作答打分，打得跟有经验的人类评卷人一致。","sections":[{"heading":"这项能力管什么","bullets":["一篇作文、一道简答题、一段辅导回复——没有标准答案，只有评分标准。模型能不能把作答证据映射到正确的分档，决定了它能不能进批改流程。","三种评价操作：给整份作答一个整体分、按步骤或维度拆开逐项判、以及为一个新任务从头写出评分标准。","和错误诊断是两件事。诊断是对着参考解找错、解释错；评价是把作答映射到量尺上的分档，机制不同。"]},{"heading":"怎么衡量","bullets":["整体性评分用作文自动评分和简答题总分测，指标是与人类评分的一致性（QWK 类）——不看模型打了几分，看它和人打的分是否同步升降。","分析式评分用分步踩分的一致性，以及两套辅导回复的逐维度判卷任务测。判卷任务一律取 macro-F1 而不是裸准确率，因为标签类别高度不平衡，裸准确率会奖励\"全猜多数类\"。","自动生成评分标准这一项目前零覆盖——模型能用 rubric，但能不能造出一份好 rubric，没有测评能回答。"]},{"heading":"读分时注意","bullets":["这里有一个已知的量尺问题，必须说明：判卷任务的 macro-F1（约 3.7–5.6）和整体评分的 QWK（约 7.3–8.7）不在同一个度量尺度上，两者进同一个加权平均隐含了可比性假设。这项能力的分数因此整体下移了约 0.7 到 1.0——那是口径变化，不是模型退步。","判卷类证据曾经被整体排除在计分之外，后来重新纳入：对别的能力来说，\"模型当裁判打的分\"是测量工具而不是被测对象；但对这项能力而言，被测构念恰恰就是判卷能力本身，数据是对口的。","子项按评价操作类型划分，而不是按评价对象。\"评作文/评简答/评实验报告\"这条轴永远列不完，边界判不了。"]}],"file":"P11.md","missing":false}},{"p_code":"P12","p_name":"命题与作业设计","group":"LAD","definition":"为学生设计考试/作业题目:出题、难度定标、目标对齐","model_type":"formative","rationale":"【裁决 R18】新设。【裁决 R19】改名『测评设计与出题』→『命题与作业设计』（消除与『给 AI 设计 benchmark』的歧义；对齐教师标准条目原文；本 P 指为学生设计考试/作业题目），并收窄为纯命题：『生成 rubric』facet 迁回 P14（P14/P23 边界：涉及评分标准归 P14，P23 只管题目）。facet 二分按用户口径：题目生成对不对（正确性与质量）/难度对齐等（难度定标、区分度、对齐课标与考查目标）——对应经典测量学中项目技术质量与难度/区分度定标两类独立参数。现有 QG 格仅测表达质量，正确性效度零覆盖，facet 标薄覆盖；整 P 参考值。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"item_generation","facet_name":"题目生成（正确性与质量）","facet_description":"生成题目及其内容正确性（表达质量 + 学科内容正确性；测评学效度仍无覆盖）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"edubench","subdimension":"QG × clarity_concision_inspiration + scenario_element_integration (task×metric)","weight":0.5,"revision_rationale":"【裁决 R18】自 P18 artifact_generation 拆出,权重沿用 0.4;表达质量代理,测评效度维度无覆盖,参考值。死格子剔除规则随迁。"},{"benchmark_id":"edubench","subdimension":"QG × domain_knowledge_accuracy + basic_factual_accuracy (task×metric)","weight":0.2,"revision_rationale":"【裁决 R23】新增：用现成逐题裁判数据把\"生成题目的内容正确性\"从零覆盖变部分覆盖（裁判逐题核对学科内容对错）。置信沿用 QG 复合格 override 0.75。知识维度偏天花板（7.8–9.9），作代理格注记保留；测评学效度（区分度、干扰项有效性、作答歧义）仍无覆盖。"}]},{"facet_id":"difficulty_alignment","facet_name":"难度与目标对齐","facet_description":"难度定标、区分度控制、与课标/考查目标对齐","revision_rationale":"","coverage_gap":true,"cells":[]}],"profile":{"title":"P12 命题与作业设计","one_liner":"给学生出题——题目本身要对、要清楚，还要难度合适、对得上教学目标。","sections":[{"heading":"这项能力管什么","bullets":["出题是教师日常工作量最大的一块，也是最容易被自动化的一块。但一道有歧义的题、一个无效的干扰项、一份难度全部集中在中段的卷子，伤害是隐性的：学生做完了，你也不知道他到底会不会。","拆成两件独立的事：题目本身的技术质量（表述清楚、学科内容正确、没有歧义），以及难度定标与目标对齐（难度可控、有区分度、覆盖课标要考的东西）。","这两件对应测量学里两类独立参数，一个模型完全可能题出得漂亮但全都是同一难度。"]},{"heading":"怎么衡量","bullets":["题目生成质量用教育场景生成评测里的出题任务测，取两组指标：表达清晰与启发性、情景元素整合（对应表述质量），以及学科知识与基础事实准确性（对应内容正确性）。","内容正确性这一路是裁判逐题核对模型出的题里学科内容对不对——这让\"生成题目的正确性\"从完全没覆盖变成了部分覆盖。","难度与目标对齐这一项零覆盖。没有任何现成测评在测模型给题目定难度、控区分度、对课标的能力。"]},{"heading":"读分时注意","bullets":["整项请当参考值读。测评学效度——区分度、干扰项有效性、作答歧义——完全没有覆盖，而这些恰恰是\"出的题能不能用\"的核心判据。","内容正确性一路的分数偏天花板（约 8.4–9.9），作代理指标看，不宜当作强证据。","评分标准的生成不算在这里，归主观题评价能力：涉及评分标准的（用或造）都归那边，这项只管题目本身。防作弊的题目设计算在这项，因为那是出题动作。"]}],"file":"P12.md","missing":false}},{"p_code":"P13","p_name":"学习者画像建模","group":"CLM","definition":"从交互中建模学生的水平、需求与特征","model_type":"formative","rationale":"【裁决 R12】facet 升级为 4 个子能力声明（知识状态估计/误概念识别/情感与参与识别/支持需求判断），允许空 facet；覆盖 2/4（2026-07-16 起 P16a 有分）。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"knowledge_state_estimation","facet_name":"知识状态估计","facet_description":"从作答历史判断学生会什么、不会什么","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"longtutor_diagnosis","subdimension":"four-category knowledge-state diagnosis macro-F1","weight":0.8,"revision_rationale":"2026-07-16 裁决（主挂）：语义核实结论——模型看到的是 199 条历史作答记录（题面+知识点+时间+对错）+ 当前题面，没有任何学生解题过程；四标签是认知层失败机制（官方 schema L1 记忆/L2 理解/L3 应用/L4 迁移），归因证据源是交互历史特征。构念对齐 P16a『从作答历史判断学生会什么、不会什么』（构念核对文档声明的零覆盖子能力，缺口原因正是'缺任务协议'）。方法学注记：①类别不平衡（Procedural 506/Recall 212/Conceptual 180/Transfer 102），多数类基线 accuracy 0.506，三模型 accuracy 仅 0.35-0.44（headline 用 macro-F1 0.23-0.32 是对的）；②金标为特征决策矩阵 + 人工修订，非独立盲标，有模板化风险——权重保守 0.30、参考值；③3 模型面不补跑。 R25 裁决:从交互历史推断知识状态就是 facet 构念本身(范围窄:数学辅导、四分类);金标非盲标疑虑留注记。单格 facet,不影响分数"}]},{"facet_id":"misconception_identification","facet_name":"误概念识别","facet_description":"识别学生持有的具体误概念","revision_rationale":"","coverage_gap":true,"cells":[]},{"facet_id":"affect_engagement","facet_name":"情感与参与识别","facet_description":"识别学生情绪、动机与参与度信号","revision_rationale":"","coverage_gap":true,"cells":[]},{"facet_id":"support_needs","facet_name":"支持需求判断","facet_description":"判断学生需要哪类支持(含特殊教育需求)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"pedagogy_benchmark","subdimension":"SEND special education needs selection","weight":0.2,"revision_rationale":" 【裁决 R23】0.35→0.25：SEND 是教师考试选择题，测\"知道特教需求知识\"；本 facet 构念是\"判断学生需要哪类支持\"（行为侧），知识侧证据挂行为侧构念降一档，作知识代理注记。知识主家 P04 不动。"},{"benchmark_id":"edubench","subdimension":"personalized_adaptation_learning_support (metric)","weight":0.2,"revision_rationale":"【裁决 R1】原 PLS 任务均分换该原生指标（换裁判稳健 ρ 0.77-0.81）【草案权重】。"}]}],"profile":{"title":"P13 学习者画像建模","one_liner":"从跟学生的交互里判断出这个学生是什么样——会什么、卡在哪、什么状态、需要哪种支持。","sections":[{"heading":"这项能力管什么","bullets":["所有个性化的前提。不知道学生现在在哪，\"因材施教\"就只是换个说法重讲一遍。","拆成四个方向：从作答历史判断会与不会（知识状态）、识别学生具体持有的误概念、感知情绪与参与度、判断需要哪一类支持（含特殊教育需求）。","和错因归因容易混：归因是从这一次的作答解释这次为什么错，画像是从交互历史判断这个学生整体的状态。前者看一道题，后者看一段关系。"]},{"heading":"怎么衡量","bullets":["知识状态估计用长程辅导对话的四类诊断任务测，指标取 macro-F1。","支持需求判断用教育场景生成评测里的个性化适应与学习支持维度，辅以教师考试里的特殊教育需求题。","误概念识别、情感与参与识别两个方向零覆盖。前者尤其可惜——它是画像里最接近教学价值的一块。"]},{"heading":"读分时注意","bullets":["知识状态估计的分数很低（约 2.0–3.2），这是真实发现，但要带两条注记读：一是类别不平衡，多数类基线的准确率 0.506 反而高过模型的 0.35–0.44，说明模型的判断还不如\"全猜最常见的那一类\"；二是金标由特征决策矩阵加人工修订产生，不是独立盲标。","特殊教育需求那条证据是教师考试选择题，测的是\"知不知道特教需求的相关知识\"，而这项能力问的是\"判断这个学生需要哪类支持\"——知识侧证据挂到行为侧构念，权重降了一档。","四个方向覆盖两个。这项能力的分数只代表已测的那部分，不能读成完整的画像能力。"]}],"file":"P13.md","missing":false}},{"p_code":"P14","p_name":"个性化教学策略选择","group":"CLM","definition":"对齐教学目标与学生状态,制定并执行合适的教学策略","model_type":"formative","rationale":"【裁决 R18】三 facet:教学目标对齐(空白)→ 教学策略制定(原『教学策略知识』改名,facet 按构念命名;pedagogy_benchmark 为情境化决策题、陈述性代理,knowing-doing gap 注记)→ 教学策略执行。P 定义改为『对齐教学目 ition":"基于知识先修结构规划学习顺序","model_type":"reflective","rationale":"【裁决 R16】定义澄清为知识结构层的路径规划；『针对学生当前状态的个性化路径』是 P16×P19 组合能力，不设 P19b。单源·参考值（自建协议、无公开基线）。","coverage_gap":null,"single_source":true,"facets":[{"facet_id":"core","facet_name":"知识结构层路径规划","facet_description":"基于知识先修结构规划学习顺序(知识结构层)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"mooccube_prereq","subdimension":"chance-corrected composite (先修选择 + 学习顺序排序)","weight":0.8,"revision_rationale":"【裁决 R16】P19 首个测量。规则判分零裁判；自建协议、无公开基线，benchmark 权重压至 0.70，参考值。"}]}],"profile":{"title":"P15 学习路径规划（知识结构层）","one_liner":"知道什么该先学、什么该后学——按知识本身的先修结构排出学习顺序。","sections":[{"heading":"这项能力管什么","bullets":["要学会解一元二次方程，得先会因式分解；要理解电磁感应，得先有磁通量的概念。这张先修关系网是课程设计的骨架。","这项能力只管知识结构这一层：给定一批知识点，判断谁是谁的前置，并排出合理的学习顺序。","明确不包括\"针对某个学生当前状态的个性化路径\"——那是学习者画像和这项能力的组合，不单独设一层。这样划分是为了让\"排不好序\"和\"不了解这个学生\"这两种失败可以分开归因。"]},{"heading":"怎么衡量","bullets":["用大规模在线课程知识图谱里的专家标注先修边当金标，测两件事：判断先修关系的选择题、以及把一组知识点排出学习顺序。","两者合成一个经过随机基线校正的复合分——不校正的话，二选一任务上\"全猜一边\"就能拿到看起来不低的分。","100% 规则判分，全程没有 LLM 裁判参与。"]},{"heading":"读分时注意","bullets":["分数很低（约 3.8–4.8）。判分方式很硬，所以这个低分不是裁判噪声——模型对知识先修结构的把握确实弱。","测试协议是自建的，没有公开基线可以对照，置信上做了折价，请当参考值读。","只有一个证据来源。这项能力目前没有跨数据集的互证。"]}],"file":"P15.md","missing":false}},{"p_code":"P16","p_name":"适配性解释与反馈生成","group":"CLM","definition":"生成适配学生的解释、引导与反馈","model_type":"formative","rationale":"【裁决 R19】对话侧 2→3 facet：『语气、情感与动机支持』独立成 facet（冷冰冰讲对 vs 温暖鼓励地讲对可独立失败，且有独立干净指标）；概念讲解与纠错反馈合并为『内容性讲解与纠错反馈』（最重的 tutorbench/mmtutorbench 整体分无法拆出讲解/纠错，强行四分会让最厚证据悬空）。eduguard 拒答质量副挂删除（主体是安全处置、主挂 P22 0.6，属过于擦边证据）。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"content_feedback","facet_name":"内容性讲解与纠错反馈","facet_description":"对学生作答/提问的内容性响应：概念解释、引导提问、纠错、脚手架与可执行反馈","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"tutorbench","subdimension":"Fair815 multimodal tutor quality","weight":0.5,"revision_rationale":""},{"benchmark_id":"mmtutorbench","subdimension":"multimodal tutor score","weight":0.5,"revision_rationale":""},{"bench on","facet_name":"教学产物生成","facet_description":"生成教材、讲义、图解等教学材料（出题已随 R18 拆出至 P12 命题与作业设计；图示生成主家已随 R23 迁至 P04 多模态生成，此处为副挂）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"edubench","subdimension":"TMG/PCC × clarity_concision_inspiration + scenario_element_integration (task×metric)","weight":0.5,"revision_rationale":"【裁决 R1+草案】替换原 PCC 0.45 / QG 0.35 / TMG 0.4 任务分；R7 裁决 QG 不动（份额不降、不移 P06）。死格子（题级 SD<0.5，如 PCC 上 4 个指标）在首轮 v2 聚合后剔除。【裁决 R18】QG 任务拆出迁 P23(item_generation),本格子收窄为 TMG/PCC,权重不动。 【裁决 R23】0.4→0.55：生成教学产物的直接测量，原值低于 facet1 一批代理格，声明层不合理。"},{"benchmark_id":"eduillustrate","subdimension":"8-dim 0-5 visual explanation score","weight":0.2,"revision_rationale":"【裁决 R23】0.3→0.25：主家迁 P16（多模态生成），此处降为副挂，低于原值以体现降级；本 facet 收窄为\"文本与结构化教学材料为主 + 图示副挂\"。"}]}],"profile":{"title":"P16 适配性解释与反馈生成","one_liner":"把话说到这个学生能听懂、愿意听——讲解、引导、纠错、鼓励，以及做出能直接用的教学材料。","sections":[{"heading":"这项能力管什么","bullets":["这是学生真正接触到的那一层。前面所有能力——诊断、画像、选策略——最终都要落到一段话上，这段话是好是坏，学生立刻能感觉到。","拆成三个方向：内容性的讲解与纠错反馈（讲清楚、引导得动、给的建议可执行）、语气情感与动机支持（说得让人愿意继续）、以及教学产物生成（讲义、材料、图解）。","语气单独成一层，因为它会独立地失败：冷冰冰地讲对和温暖地讲对，是两种体验，而且有干净的指标能分开测。"]},{"heading":"怎么衡量","bullets":["内容反馈这一层的证据最厚，横跨真实辅导对话的整体质量评分、数学辅导的脚手架与纠错任务、以及教育场景生成评测的清晰启发性和高阶思维培养维度。","语气支持用教育场景评测的动机引导与正向反馈维度，辅以辅导回复标注里的鼓励语气占比。","教学产物生成用教学材料生成和个性化内容生成两类任务测，图示生成作为副证据计入——它的主场在多模态生成那项。"]},{"heading":"读分时注意","bullets":["讲解与纠错刻意没有再往下拆。最厚的那批证据（真实辅导对话的整体质量分）本身就拆不出\"讲解\"和\"纠错\"两块，硬拆会让最重的证据悬空。","内容反馈这一层有一半格子来自同一个数据集家族，其中两对子任务的跨模型相关高达 0.98 和 0.92——这一层的分数实质由那一家主导。","有一处矛盾值得知道：同一层里，某教育场景评测的\"清晰启发性\"和数学辅导的\"脚手架\"给出的模型排序几乎完全相反（相关系数 −0.92）。这与该评测\"家族内高度相关、与外部零或负相关\"的整体问题同源，属于方法方差，不是模型表现的真实反转。","有 9 个证据格与\"个性化教学策略选择\"共享同一批判分数据。两项分数会机械性高相关，不得互为独立证据。"]}],"file":"P16.md","missing":false}},{"p_code":"P17","p_name":"教育角色边界判断","group":"CEG","definition":"守住教育者的角色与行为边界","model_type":"formative","rationale":"知道边界（SATA 知识）与守住边界（对抗/对话行为）不协变（pilot ρ=0.07）。【裁决 R10】知识 facet 与 P21/P22 同源，报告注明不构成互证；SATA 类别标注 todo 发布后做。 【裁决 R23】补 single_source 声明：facet1 的 SATA 与 facet2 的对抗两个子任务同属 EduGuard-Bench 一家（mrbench_tutor 哨兵格降至 0.1 后更是如此），两 facet 不协变的立论仍成立，但不构成跨 benchmark 互证。同批删除本 P 的 mrbench_judge 格（judge 挂载收拢至 P10）。","coverage_gap":null,"single_source":true,"facets":[{"facet_id":"safety_knowledge","facet_name":"安全知识","facet_description":"知道教育场景中哪些行为构成伤害/越界(选择题)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduguard_sata","subdimension":"Teaching Harm / SATA RFS","weight":0.2,"revision_rationale":""}]},{"facet_id":"boundary_behavior","facet_name":"边界行为","facet_description":"常规与对抗条件下实际守住教育者的角色与行为边界（两种条件都需观测：常规对话不越界＝基线，对抗诱导下不越界＝压力测试；只测压力条件等于默认常规条件必然安全，该默认在弱模型上不成立）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduguard_adversarial","subdimension":"Adversarial Safety ASR","weight":0.5,"revision_rationale":"R25 裁决:对抗压力下守边界的直接测量;恢复对哨兵格的主导"},{"benchmark_id":"mrbench_tutor","subdimension":"dimension: Tutor_Tone (non-offensive)","weight":0.2,"revision_rationale":"【裁决 R2 延伸+草案】原 pass rate 格换语气维度（Encouraging/Neutral/Offensive），构念对齐『角色边界』。【裁决 R19】统计量由 Encouraging+0.5×Neutral 改为 1−Offensive 占比：边界构念只关心越不越界（Offensive 是越界信号），鼓励成分归 P18 语气 facet（同一份标注两个统计量，去重）。 【裁决 R23】0.25→0.1：当前 5 个面全 10.00、方差为零，但这是\"当前面板全都不冒犯\"而非指标永久饱和（换弱模型 Offensive 会出现），保留作哨兵格；降权使其不再压缩 ASR 格拉开的真实差距。此前以\"无压力观测不符 facet 描述\"为由的删格主张已撤回——应反过来放宽描述（见 facet_description）。"},{"benchmark_id":"eduguard_adversarial","subdimension":"Refusal quality distribution","weight":0.2,"revision_rationale":""}]}],"profile":{"title":"P17 教育角色边界判断","one_liner":"知道教育者不该做什么，并且在被反复试探时也真的守得住。","sections":[{"heading":"这项能力管什么","bullets":["面对未成年人的产品，角色边界是硬约束：不替学生写该他自己写的作业、不越位扮演心理治疗师、不和学生建立超出教育关系的互动、不在被追问时松口。","拆成两层：知道哪些行为构成越界（知识），以及实际守不守得住（行为）。行为这一层同时看两种条件——常规对话里不越界是基线，被刻意诱导时仍不越界是压力测试。","两种条件都要测。只测压力条件等于默认常规条件必然安全，而这个默认在弱模型上并不成立。"]},{"heading":"怎么衡量","bullets":["知识层用教育安全评测的选择题部分，规则判分。","行为层主要用对抗攻击成功率——用各种诱导话术去试，看有多少次把模型带过界；辅以拒答质量的分布，以及辅导回复标注里的非冒犯占比。","拒答质量看的不只是拒没拒，还有拒得得不得体：生硬拒绝和有解释、有替代方案的拒绝，教学后果不一样。"]},{"heading":"读分时注意","bullets":["这项能力最重要的发现是：知道边界和守住边界几乎不相关（预实验相关系数 0.07）。选择题满分的模型可能在对抗诱导下失守。看分时务必下钻到两层，合成分会掩盖这个分裂。","对抗攻击那条是全体系区分度最好的证据之一，分数跨度从 3.8 一直到 10.0——模型之间的安全水平差距是真实存在的巨大差距。","所有证据来自同一个安全评测的两个子任务。两层不相关的结论仍然成立，但这不构成跨数据集的互证。","非冒犯占比那条目前所有模型都是满分。它保留下来作哨兵用——当前面板恰好都不冒犯，不代表指标永久饱和，换更弱的模型就会出现区分。权重已降到不压缩对抗测试拉开的真实差距。"]}],"file":"P17.md","missing":false}},{"p_code":"P18","p_name":"学生风险识别","group":"CEG","definition":"识别学生消息中的风险信号","model_type":"formative","rationale":"【裁决 R19】facet 轴由『知识/对抗鲁棒』改为『信号识别/严重度与紧迫性判断』：P21 定义是输入侧感知任务（识别学生消息中的风险信号），原对抗鲁棒格（eduguard_adversarial·ASR）测的是越狱压力下的输出侧行为，构念不匹配且该数据已在P20/P22 计分，不构成 P21 独立证据——删除。删后 P21 仅剩与 P20/P22 同源的 SATA 一格，独立证据为零，成熟度按『单源·同源，近似缺口』诚实表述。严重度分级（立即干预/短期关注/一般支持）决定后续处置，与识别可独立失败，留空 facet。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"risk_signal_recognition","facet_name":"风险信号识别","facet_description":"识别学生消息中的风险信号（现仅选择题式知识面测量；与 P17 教育角色边界、P19 安全处置同源，不构成互证）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduguard_sata","subdimension":"Teaching Harm / SATA RFS","weight":0.2,"revision_rationale":""}]},{"facet_id":"severity_urgency","facet_name":"风险严重度与紧迫性判断","facet_description":"判断已识别风险的严重度与紧迫性（需立即干预/短期关注/一般性支持）","revision_rationale":"","coverage_gap":true,"cells":[]}],"profile":{"title":"P18 学生风险识别","one_liner":"从学生说的话里察觉出危险信号——自伤倾向、霸凌、家庭问题，在他没有直说的时候。","sections":[{"heading":"这项能力管什么","bullets":["学生很少直接说\"我想死\"。更多的是\"最近做什么都没意思\"、\"反正也没人在乎\"这种夹在数学问题中间的一句。能不能接住这一句，是教育产品最高风险的一环。","拆成两件事：察觉到有风险信号（识别），以及判断这个风险有多急——需要立即干预、短期关注、还是一般性支持（严重度判断）。","这项能力是输入侧的感知任务：从学生发来的内容里读出东西。模型自己会不会说出格的话，是别的能力管的。"]},{"heading":"怎么衡量","bullets":["目前只有一条证据：教育安全评测里的选择题部分，测的是\"知不知道什么算风险\"这类教师侧知识。","严重度与紧迫性判断零覆盖。没有测评在检验模型对风险等级的分级判断。","曾经把对抗攻击成功率算进来，后来删掉了：那测的是被诱导时输出侧的行为，而这项能力问的是输入侧的感知，两者是不同任务。"]},{"heading":"读分时注意","bullets":["这项能力的独立证据为零。 唯一那条证据与教育角色边界判断、安全处置选择两项共用同一份数据，显示的分数会和它们的知识层完全相同——报告里绝不能读作三份独立证据。","而且那条证据测的是\"知道什么算风险\"的知识，与\"从学生消息里察觉信号\"的失败机制其实可以分开。评审时曾主张连它一起摘除，最终裁决保留，作为这项能力唯一的知识代理。","结论：这项能力目前几乎没有被真正测量。风险很高、覆盖很薄，是补数据的最高优先级之一。"]}],"file":"P18.md","missing":false}},{"p_code":"P19","p_name":"安全处置选择","group":"CEG","definition":"对风险与越界请求选择正确处置方式","model_type":"formative","rationale":"同 P20：处置知识 vs 对抗处置行为。【裁决 R7】拒答质量主格在此。知识 facet 同源注记同 P20。【裁决 R19】对抗 facet 含义精确为对抗鲁棒（抵抗恶意操纵的稳健性——有对手主动构造话术诱导偏离，非一般性知行执行力差）。升级转介深度缺口注记（经 satas.jsonl 语料核实）：知识侧部分覆盖但不可计量（『联系校心理老师』等转介选项散在心理健康类题目的正确答案里，无类别标签无法单独取分）；行为侧零覆盖（拒答质量三档 educational/standard/flimsy 无转介/升级维度，场景全为主动越狱请求，无『学生被动流露风险需主动升级』情形）。补法是扩题/加统计维度，不是新开 facet（轻度劝导到转介人类是同一处置选择技能的严重度连续谱）。","coverage_gap":null,"single_source":null,"facets":[{"facet_id":"safety_knowledge","facet_name":"安全知识","facet_description":"知道对风险与越界请求的正确处置方式(选择题)","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduguard_sata","subdimension":"Teaching Harm / SATA RFS","weight":0.2,"revision_rationale":""}]},{"facet_id":"adversarial_robustness","facet_name":"对抗鲁棒","facet_description":"越狱等恶意操纵压力下仍选择并执行正确处置（对抗鲁棒：抵抗刻意诱导话术，非一般执行力；拒答且拒得有质量）","revision_rationale":"","coverage_gap":null,"cells":[{"benchmark_id":"eduguard_adversarial","subdimension":"Refusal quality distribution","weight":0.8,"revision_rationale":"R25 裁决:rubric 判处置得体是\"安全处置选择\"构念的直接测量;恢复 R7/R23 主格意图"},{"benchmark_id":"eduguard_adversarial","subdimension":"Adversarial Safety ASR","weight":0.5,"revision_rationale":""}]}],"profile":{"title":"P19 安全处置选择","one_liner":"察觉到风险或收到越界请求之后，选对处置方式并且执行到位。","sections":[{"heading":"这项能力管什么","bullets":["识别到风险只是第一步，接下来怎么办才是真正的决定：轻度劝导、明确拒绝、还是转介给学校心理老师和家长。选轻了失职，选重了会让学生下次不敢再开口。","拆成两层：知道正确的处置方式是什么（知识），以及在恶意诱导话术的压力下仍然选得对、做得到（对抗鲁棒）。","对抗这一层测的是抵抗刻意诱导，不是一般执行力。而且不止看顶没顶住，还看顶住之后处理得得不得体。"]},{"heading":"怎么衡量","bullets":["知识层用教育安全评测的选择题部分。","对抗层用两条互补的证据：攻击成功率测\"有没有被带过去\"，拒答质量的分布测\"守住之后处理得怎么样\"。后者是这一层的主证据——拒绝本身不难，拒绝得让学生还愿意继续对话才难。","两条证据出自同一套官方两阶段裁判流程，第二阶段判拒绝质量档相对更主观。"]},{"heading":"读分时注意","bullets":["三项安全能力里，这项的结构最健康：两层都有证据，对抗层的两条分工明确，不是同一件事测两遍。","有一个深度缺口必须知道：现在测的全是\"拒绝恶意请求\"，完全没测\"识别风险后主动转介人类\"。 知识侧的转介选项散在心理健康类题目的正确答案里，没有类别标签、无法单独取分；行为侧则是零覆盖——测试语料的 801 条场景全部是主动越狱请求，没有一条是\"学生被动流露风险、需要模型主动升级\"的情形。","这个缺口靠扩充题目和增加统计维度来补，不新拆一层：从轻度劝导到转介人类，是同一个处置选择技能上的严重度连续谱。","对抗层分数跨度很大（约 4.6– ,{"id":"bea2025_judge","name":"BEA 2025 Judge","confidence":1.0,"metric_family":"accuracy","score_direction":"higher_better","source_scope":"repo_eval","rationale":"作为教育评判者逐维度标注 tutor 回复，与人类标注算一致率/macro-F1/kappa。R23：仅在「主观题评价能力」P 计分（该 P 的被测构念就是判卷能力；见 mrbench_judge 条目）。取分用 extra_metrics.recommended_judge_score（官方口径：四维 exact macro-F1 均值，抗类别不平衡，优于裸 accuracy）。置信 0.0→0.75。","profile":{"title":"BEA 2025 · Judge 判卷一致性","one_liner":"BEA 2025 共享任务的两个子评测之一——让模型当评卷人给 tutor 回复贴标签，看它贴得像不像人类标注者。","sections":[{"heading":"这是哪个子评测","bullets":["家族是 ACL 2025 教育 NLP 研讨会（BEA/SIGEDU）的官方共享任务，本仓库据此实现了两个方向相反的子评测。","本页是判卷侧：模型当裁判。另一个是生成侧：模型当 tutor 写回复。","两者共用同一套四维标注体系和同一批人类金标，但被测能力完全不同——所以分开计分，本页只挂到主观题评价能力上。"]},{"heading":"出处与背景","bullets":["BEA Workshop @ ACL 2025，数据来自 MRBench v3（Kochmar 组），带人类标注金标。","对话来自 MathDial 与 Bridge，英文。"]},{"heading":"任务与判分","bullets":["模型对给定的 tutor 回复逐维贴标签：识别学生有没有错、定位错在哪、提供引导、可执行性。","与人类金标算一致性，取 macro-F1 而不是裸准确率——标签类别高度不平衡，裸准确率会奖励\"全猜多数类\"。"]},{"heading":"局限与注意","bullets":["这一类证据曾经被整体排除在计分之外，后来重新纳入。 对别的能力来说，\"模型当裁判打的分\"是测量工具而不是被测对象；但主观题评价能力的被测构念恰恰就是判卷本身，数据是对口的。","只在主观题评价能力上计分，不进任何其他能力。","量尺问题：macro-F1（约 3.7–5.5）与同一层里的评分一致性指标（QWK，约 7.3–8.7）不在同一个度量尺度上。两者进同一个加权平均隐含了可比性假设，该问题待单独处理。","因裁判协议本身的噪声，置信度做了一档折价。"]}],"file":"bea2025_judge.md","missing":false}},{"id":"bea2025_tutor","name":"BEA 2025 Tutor","confidence":0.85,"metric_family":"share_0_to_1","score_direction":"higher_better","source_scope":"repo_eval","rationale":"生成 tutor 回复、固定裁判逐维度标注。R2 裁决：复合 pass rate 换单维度 Yes 占比（Mistake_Identification→P11c、Providing_Guidance→P17、Actionability→P18 减半权重，κ 0.22 校准弱）。仅 3 个模型面（缺 deepseek-v4-pro / doubao-seed-2.0-pro 生成，2026-07-16 决定不补跑）。","profile":{"title":"BEA 2025 · Tutor 回复生成","one_liner":"BEA 2025 共享任务的两个子评测之一——让模型给犯错的学生写下一句辅导回复，再由固定裁判按四个教学质量维度贴标签。","sections":[{"heading":"这是哪个子评测","bullets":["家族是 ACL 2025 教育 NLP 研讨会（BEA/SIGEDU）的官方共享任务，本仓库据此实现了两个方向相反的子评测。","本页是生成侧：模型当 tutor，被别人评。另一个是判卷侧：模型当裁判，看它贴的标签像不像人。","两者用同一套四维标注体系，但被测的是完全不同的能力——会写好回复和会评价回复是两回事，所以分开计分、挂到不同的能力上。"]},{"heading":
